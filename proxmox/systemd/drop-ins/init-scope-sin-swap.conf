# Con qemu.slice y system.slice ya sin swap, los avisos SwapOutHostProxmox seguían (361 MiB/h el 2026-11-11 con
# 15 GB libres): lo único que kswapd todavía puede mandar a swap son init.scope (systemd, ~2,4 MB) y user.slice
# (sesiones ssh), y las vuelve a traer enseguida (swap usado total 49 MB). Ver docs/PENDIENTES.md § 4b3.
# Aplicado en el host con: systemctl set-property init.scope MemorySwapMax=0 && swapoff -a && swapon -a
[Scope]
MemorySwapMax=0
