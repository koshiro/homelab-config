# Los demonios de PVE (pveproxy, pvedaemon, pve-ha-*) tampoco van a swap: con el caché de página casi vacío
# (el ARC de ZFS no cuenta) kswapd solo puede sacar RAM anónima, y los avisos SwapOutHostProxmox seguían
# sonando con 15 GB libres (bug openzfs#18893; el fix #19276 está en OpenZFS pero no en proxmox-kernel 7.0.14-28).
# Ver docs/PENDIENTES.md § 4b3.
# Aplicado en el host con: systemctl set-property system.slice MemorySwapMax=0 && swapoff -a && swapon -a
[Slice]
MemorySwapMax=0
