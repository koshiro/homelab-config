# Ignorar pulsaciones cortas del botón de encendido (el gato). La pulsación larga (~4 s) es un
# corte por hardware de la placa y no se puede ignorar desde el sistema operativo.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
