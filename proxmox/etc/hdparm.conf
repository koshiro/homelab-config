# /etc/hdparm.conf de pve. Lo aplica /usr/lib/udev/hdparm al detectar cada disco (arranque o hotplug).
# Los HDD no se duermen: cada arranque del motor desgasta más que horas girando (sdd, WD 2 TB de
# scratch, llegó a 100 687 arranques en 10 años). La alerta DiscoArrancaMucho vigila Start_Stop_Count.
quiet

# WD 2 TB (pool scratch, se usa hasta que muera). Sin APM; -S 0 apaga el temporizador de standby.
/dev/disk/by-id/ata-WDC_WD20EURS-63S48Y0_WD-WMAZA7841984 {
	spindown_time = 0
}

# WD 1 TB 2,5" (pool scratch). Ya pasó los ~300 000 aparcados de cabezal nominales (Load_Cycle_Count):
# APM 254 = sin aparcar ni dormir.
/dev/disk/by-id/ata-WDC_WD10JPVX-08JC3T6_WD-WXG1A173P2L6 {
	apm = 254
	spindown_time = 0
}
