# Datos de apps k3s rescatados de TrueNAS (2026-09-30)
[nvme/k8s]
	use_template = k8s
	recursive = yes
	process_children_only = yes

[template_k8s]
	frequently = 0
	hourly = 24
	daily = 14
	weekly = 4
	monthly = 6
	autosnap = yes
	autoprune = yes

# TSDB de VictoriaMetrics: reescribe sus partes al compactar, así que snapshots largos
# retendrían varias veces su tamaño. Solo 2 diarios para deshacer un error; no va a syncoid ni restic.
[nvme/k8s/victoria-metrics]
	use_template = metricas

[template_metricas]
	frequently = 0
	hourly = 0
	daily = 2
	weekly = 0
	monthly = 0
	autosnap = yes
	autoprune = yes

# Réplica en disco respaldo (sde): no crea snapshots, solo poda lo recibido por syncoid
[respaldo/k8s]
	use_template = replica
	recursive = yes
	process_children_only = yes

[template_replica]
	autosnap = no
	autoprune = yes
	frequently = 0
	hourly = 0
	daily = 30
	weekly = 8
	monthly = 12

# Discos de las VMs 102–104 y root del LXC nas (2026-10-18): solo para la réplica horaria a `replica`
# (nvme1n1). Pocos snapshots en origen: cada uno retiene lo que el invitado reescribe en el zvol.
[nvme/vm-102-disk-0]
	use_template = vm

[nvme/vm-103-disk-0]
	use_template = vm

[nvme/vm-104-disk-0]
	use_template = vm

[nvme/subvol-110-disk-0]
	use_template = vm

[template_vm]
	frequently = 0
	hourly = 6
	daily = 1
	weekly = 0
	monthly = 0
	autosnap = yes
	autoprune = yes

# Réplica horaria en nvme1n1 (syncoid-replica.service): no crea snapshots, solo poda lo recibido
[replica]
	use_template = replica_horaria
	recursive = yes
	process_children_only = yes

[template_replica_horaria]
	autosnap = no
	autoprune = yes
	frequently = 0
	hourly = 24
	daily = 7
	weekly = 0
	monthly = 0

# homelab-storage (12 TB, recreado 2026-10-03): RAW y ComfyUI. Sin hourly (cambian poco).
# k8s-media-library queda fuera: la media de *arr se vuelve a descargar.
[homelab-storage/media]
	use_template = datos

[homelab-storage/comfyui]
	use_template = datos

# Copia rsync de ComfyUI sin modelos (syncoid-respaldo.service): user, input, output, swarmui/Data
[respaldo/comfyui]
	use_template = datos

[template_datos]
	frequently = 0
	hourly = 0
	daily = 14
	weekly = 4
	monthly = 6
	autosnap = yes
	autoprune = yes

# Time Machine (quota 1 TB, montado en el LXC 110). Ya es un respaldo: pocos snapshots.
[homelab-storage/timemachine]
	use_template = timemachine

[template_timemachine]
	frequently = 0
	hourly = 0
	daily = 0
	weekly = 2
	monthly = 0
	autosnap = yes
	autoprune = yes
