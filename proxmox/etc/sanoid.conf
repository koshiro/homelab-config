# Datos de apps k3s rescatados de TrueNAS (2026-09-30)
[nvme/k8s]
	use_template = k8s
	recursive = yes
	process_children_only = yes

[template_k8s]
	frequently = 0
	hourly = 24
	daily = 14
	weekly = 4
	monthly = 6
	autosnap = yes
	autoprune = yes

# Réplica en disco respaldo (sde): no crea snapshots, solo poda lo recibido por syncoid
[respaldo/k8s]
	use_template = replica
	recursive = yes
	process_children_only = yes

[template_replica]
	autosnap = no
	autoprune = yes
	frequently = 0
	hourly = 0
	daily = 30
	weekly = 8
	monthly = 12
