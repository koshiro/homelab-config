#NAS%3A Samba + Time Machine + Tailscale (reemplazo TrueNAS). Ver docs/ARQUITECTURA.md
arch: amd64
cores: 2
features: nesting=1
hostname: nas
memory: 1024
mp0: /nvme/nas-prueba,mp=/srv/prueba
mp1: /mnt/homelab-storage/timemachine,mp=/srv/timemachine
mp2: /mnt/homelab-storage/media,mp=/srv/archivo
nameserver: 192.168.1.1
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,hwaddr=BC:24:11:16:C4:BD,ip=192.168.1.21/24,type=veth
onboot: 1
ostype: debian
rootfs: nvme:subvol-110-disk-0,size=8G
swap: 512
unprivileged: 1
lxc.idmap: u 0 100000 1000
lxc.idmap: g 0 100000 1000
lxc.idmap: u 1000 1000 1
lxc.idmap: g 1000 1000 1
lxc.idmap: u 1001 101001 1999
lxc.idmap: g 1001 101001 1999
lxc.idmap: u 3000 3000 3
lxc.idmap: g 3000 3000 3
lxc.idmap: u 3003 103003 62533
lxc.idmap: g 3003 103003 62533
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
