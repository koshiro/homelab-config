# NAS homelab (LXC 110). Opciones fruit copiadas de TrueNAS para mantener legible el respaldo Time Machine existente.
[global]
   workgroup = WORKGROUP
   server string = nas
   server role = standalone server
   map to guest = never
   security = user
   hosts allow = 192.168.1.0/24 100.64.0.0/10 127.0.0.1
   min protocol = SMB2
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:encoding = native
   ea support = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 3 auth_audit:3

[timemachine]
   comment = Time Machine
   path = /srv/timemachine
   valid users = timemachine
   read only = no
   fruit:time machine = yes
   fruit:time machine max size = 1T

[archivo]
   comment = RAW y media (homelab-storage/media)
   path = /srv/archivo
   valid users = daniel plex
   read only = no
   follow symlinks = yes

# Temporal: prueba de acceso mientras homelab-storage no está montado
[prueba]
   path = /srv/prueba
   valid users = daniel
   read only = no
