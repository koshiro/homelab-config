name = "homelab-monitor"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "84f8d7966bfc3d39812bebeeeed0cfa4"
workers_dev = false

# Custom Domain: Cloudflare crea el registro DNS y el certificado
routes = [{ pattern = "monitor.danielriquelme.cl", custom_domain = true }]

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "MONITOR"
id = "8077998ad09e454bb6f02bbcc405dd7a"

[observability]
enabled = true

# Secretos (bunx wrangler secret put <NOMBRE>): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, HEARTBEAT_TOKEN
