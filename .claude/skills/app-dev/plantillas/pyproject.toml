# Plantilla del arquetipo B (servicio Python). Reemplazar <app> (nombre del paquete: minúsculas y guion bajo).
# Quitar las dependencias que la app no use; agregar las de references/stack.md según haga falta.
[project]
name = "<app>"
version = "0.1.0"
description = "<una línea>"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic-settings>=2.16",
  "psycopg[binary,pool]>=3.3",
  "procrastinate>=3.10",
  "httpx>=0.28",
  "structlog>=26.1",
  "prometheus-client>=0.26",
]

[project.scripts]
# Un solo punto de entrada con subcomandos: `<app> api`, `<app> worker`, `<app> migrate`.
<app> = "<app>.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff==0.17.2", # fijo: las versiones menores cambian las reglas por defecto
  "ty>=0.0.91",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"] # assert en tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
