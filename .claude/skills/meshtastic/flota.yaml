# Estado deseado de la flota Meshtastic. `mt.py diff|aplicar|provisionar <nodo>` compara y corrige contra esto.
# Claves = las del CLI (`--set seccion.campo valor`), en snake_case. Orden de mezcla: comun → perfil → nodo.set.
# Sin secretos aquí: `secreto:<clave>` se lee de ~/.config/meshtastic-fleet/secretos.yaml (chmod 600).
# Las llaves públicas no son secreto. Decisiones y porqués: references/arquitectura.md y references/plan.md.

firmware: 2.8.2.d5f1619          # release (2026-11-04), fijada el 2026-11-21 tras el canario; archivo en ~/.cache/meshtastic-fw

# Nodos cuya llave pública va en security.admin_key de todos (máx. 3). Se provisionan primero.
admins: [Dnto_L1, AcevedoRoof]   # Laptop fuera desde 2026-11-21: pasó a tracker del auto (LYZC60)

# Canales en orden de índice. La posición sale por el de índice más bajo con precision > 0.
canales:
  - nombre: ""                   # primario público: frecuencia de la malla pública (slot 20 en ANZ)
    psk: default                 # AQ==
    precision: 0
    # module_settings.is_muted: el buzzer no suena con broadcasts del público (gente fuera de la flota). Los DM y el
    # canal privado siguen sonando; un DM de un extraño solo se calla silenciando ese nodo. (2026-11-21)
    silenciado_en: [tracker]
  - nombre: secreto:canal_privado_nombre
    psk: secreto:canal_privado_psk   # 32 B en base64
    aead: true
    precision: 32
    mqtt: true                   # uplink/downlink solo en los nodos con `gateway: true`

comun:
  lora.region: ANZ               # Chile: 915–928 MHz
  lora.use_preset: true
  lora.modem_preset: LONG_FAST   # el de la malla pública; LONG_TURBO descartado (−3 dB)
  lora.channel_num: 0            # 0 = slot por hash del nombre del primario
  lora.hop_limit: 3
  lora.tx_enabled: true
  device.tzdef: "<-04>4<-03>,M9.1.6/24,M4.1.6/24"   # Chile continental
  security.serial_enabled: true
  security.is_managed: false     # no activar hasta probar admin remoto en ese nodo
  security.packet_signature_policy: PACKET_SIGNATURE_POLICY_COMPATIBLE   # BALANCED en la fase 5
  telemetry.device_telemetry_enabled: false   # saldría por el canal público; se pide por DM
  mqtt.enabled: false
  mqtt.map_reporting_enabled: false
  lora.config_ok_to_mqtt: true   # un gateway con broker público (Temuco) solo sube paquetes ajenos con este bit
  display.units: METRIC

perfiles:
  tracker:
    device.role: TRACKER
    device.rebroadcast_mode: NONE    # no retransmite tráfico público (batería y aire)
    position.gps_mode: ENABLED
    position.position_broadcast_smart_enabled: true
    position.position_broadcast_secs: 3600
    position.broadcast_smart_minimum_distance: 10
    position.broadcast_smart_minimum_interval_secs: 15
    position.gps_update_interval: 60
    # Batería baja (<3,1 V, sin USB) → deep sleep de sds_secs. Ni el Heltec ni el T1000-E despiertan solos al cargar:
    # con 300 s revisan cada 5 min y, si ya cargan, vuelven a transmitir. En nRF52 solo aplica con is_power_saving
    # (sin él entra en System OFF y despierta con el botón o, si el hardware lo hace, con el USB). (2026-10-18)
    power.sds_secs: 300
    power.is_power_saving: false   # T1000-E despierta de System OFF al conectar USB (probado 2026-10-18)
  base:                          # nodo fijo del techo, en la LAN por WiFi (BLE queda apagado en ESP32)
    device.role: CLIENT_BASE
    network.wifi_enabled: true
    network.wifi_ssid: secreto:wifi_ssid
    network.wifi_psk: secreto:wifi_psk
    # MQTT: broker del homelab (cluster/apps/mqtt). Usuario, clave y dirección van en cada nodo.
    mqtt.enabled: true
    mqtt.tls_enabled: true           # puerto 8883; el firmware no valida el certificado (autofirmado)
    mqtt.encryption_enabled: true    # sube los paquetes cifrados (el canal privado sigue con AEAD)
    mqtt.json_enabled: false
    mqtt.root: msh/acevedo
  cliente:
    device.role: CLIENT
  cliente_proxy:                 # CLIENT sin WiFi que llega al broker por MQTT Client Proxy: la app conectada
    device.role: CLIENT          # (Mac/iPhone/Android) abre la conexión; sin app conectada no hay MQTT (2026-10-24)
    mqtt.enabled: true
    mqtt.proxy_to_client_enabled: true
    mqtt.address: mqtt.danielriquelme.cl:8883   # desde cualquier red; usuario y clave van en cada nodo
    mqtt.tls_enabled: true
    mqtt.encryption_enabled: true
    mqtt.json_enabled: false
    mqtt.root: msh/acevedo

# id y pubkey los escribe `mt.py provisionar` (las llaves nacen en el nodo). owner ≤24 bytes (emoji = 4).
# IDs que ya no son de la flota: `mt.py favoritos` los quita de favoritos en cada nodo.
retirados:
  "!de7ae27e": CarTracker        # 2026-11-21: el Heltec pasó a PapoRelay (!06c19e45)
  "!ddb5828c": CarTracker        # instalación anterior (2026-10-18)
  "!0404f6d2": Laptop            # 2026-11-21: el XIAO S3 pasó a LYZC60 (!acff6687)
  "!561b1920": PapoRelay         # 2026-11-21: XIAO S3 sin radio

nodos:
  Dnto_L1:                       # nodo personal de Daniel; administra a los demás
    id: "!185e9038"
    pubkey: itL0Olq6ahmKafz5ZhnAeRndFaHqLOXrJ4RIQ7fQAgg=
    hw: SEEED_WIO_TRACKER_L1
    pio: seeed_wio_tracker_L1   # verificar con `estado` (hay variantes eink)
    perfil: cliente_proxy
    gateway: true                # uplink/downlink del canal privado por el proxy de la app
    set:
      mqtt.username: dnto
      mqtt.password: secreto:mqtt_pass_dnto
    owner: Dnto_L1
    owner_short: "🤓"
  LYZC60:                        # tracker del auto (patente); ex «Laptop» (mismo XIAO S3), reemplaza a CarTracker
    id: "!acff6687"
    pubkey: 50KhN2fFfY9n6v8EzFXzauTp7iT5blTB9w4zttIlDBI=
    # 2026-11-21: Wio-SX1262 original muerta (SX126x -2) → lleva la radio de PapoRelay. GPS L76K apilado sin el pin
    # RESET (chocaba con MOSI). USB del auto + batería de respaldo; sin medición de batería hasta sumar un MAX17048.
    hw: SEEED_XIAO_S3
    pio: seeed-xiao-s3
    perfil: tracker
    owner: LYZC60
    owner_short: "🚗"
    set:
      bluetooth.enabled: false           # mismo ahorro que CarTracker; se administra por USB/radio
      position.gps_update_interval: 120
      display.screen_on_secs: 10
  AcevedoRoof:
    id: "!918d5bf9"
    pubkey: TXOhwzLpnv4zJif1sRHxnsKmyrFlK4je7VSiNgPhajk=
    hw: SEEED_XIAO_S3
    pio: seeed-xiao-s3
    perfil: base
    gateway: true
    set:
      mqtt.address: 192.168.1.15     # IP privada: el firmware sube también los paquetes de otros nodos
      mqtt.username: roof
      mqtt.password: secreto:mqtt_pass_roof
    owner: AcevedoRoof
    owner_short: "🏡"
  CatTracker:
    id: "!1e945bee"
    pubkey: tFRoOyBIPOJfHsf8oX1e1EnsRzQ+/XzutmpBECRybkM=
    hw: TRACKER_T1000_E
    pio: tracker-t1000-e
    perfil: tracker
    owner: CatTracker
    owner_short: "😺"
    set:
      position.position_broadcast_secs: 900   # quieto: cada 15 min (en movimiento manda el smart broadcast)
  AkiraGPS:                      # tracker del perro
    id: "!66f2bcce"
    pubkey: c7xvNwWSgvjkxR9AK/M0QVB6xRadldUJKRnGgrb2HmM=
    hw: TRACKER_T1000_E
    pio: tracker-t1000-e
    perfil: tracker
    owner: AkiraGPS
    owner_short: "🐕"
    set:
      position.position_broadcast_secs: 900   # quieto: cada 15 min (en movimiento manda el smart broadcast)
  SolarT114:                     # nodo fijo solar remoto, sin MQTT (oído directo por el techo 2026-10-20)
    id: "!ba6e56de"
    pubkey: gvFbAZi3c+9LPzF9DC/FmppkByMn3SLkB+xXXsjIm1s=
    hw: HELTEC_MESH_NODE_T114
    pio: heltec-mesh-node-t114   # verificar con `estado`
    perfil: cliente              # CLIENT en la malla; solar, no gateway. Candidato a INA3221 → power metrics
    owner: SolarT114
    owner_short: "SOL"
  BlackHeltecV3:                 # extra
    id: "!6de158c2"
    pubkey: 5urJZ4Jx3P/jlVzyRRFA43pA1qM8YUqU7Ak/eys8YFg=
    hw: HELTEC_V3
    pio: heltec-v3
    perfil: cliente
    owner: BlackHeltecV3
    owner_short: "BH3"
  OrangeHeltecV3:                # extra
    id: "!583acc8e"
    pubkey: e7gErtxZXiAHDuLDKiMapSo1b+fnYsWxlQUmisnLbiU=
    hw: HELTEC_V3
    pio: heltec-v3
    perfil: cliente
    owner: OrangeHeltecV3
    owner_short: "OH3"
  XiaoNRF:                       # extra, XIAO nRF52840 kit (alta 2026-10-24)
    id: "!d4ac0a05"
    pubkey: quehtSpFE6TSD95iZ/wFjYxJjfGdrYtKAsE4r8xvcx8=
    hw: XIAO_NRF52_KIT
    pio: seeed_xiao_nrf52840_kit
    perfil: cliente_proxy        # sin WiFi: MQTT por Client Proxy, solo con una app conectada
    gateway: true
    set:
      mqtt.username: xiaonrf
      mqtt.password: secreto:mqtt_pass_xiaonrf
    owner: XiaoNRF
    owner_short: "XNR"
  PapoRelay:                     # relay MQTT en otra ciudad (WiFi de ahí); entra al broker por internet
    id: "!06c19e45"
    pubkey: vofDY5bX4Vu19s2Io1D8rXr81r2up/8xaCqPjsf82jQ=
    # 2026-11-21: ex CarTracker (Heltec Wireless Tracker V1.1); el XIAO S3 anterior (!561b1920) cedió su radio a LYZC60
    hw: HELTEC_WIRELESS_TRACKER
    pio: heltec-wireless-tracker
    perfil: base
    gateway: true
    set:
      network.wifi_ssid: secreto:papo_wifi_ssid
      network.wifi_psk: secreto:papo_wifi_psk
      mqtt.address: mqtt.danielriquelme.cl:8883
      mqtt.username: papo
      mqtt.password: secreto:mqtt_pass_papo
      position.gps_mode: DISABLED        # fijo: el GPS solo gastaría
    owner: papoRelay
    owner_short: papo
