# Checks de cada PR (docs/PLAN-FLUX.md, decisión «CI»). Sin ellos Renovate no puede hacer automerge.
# flux-local está deprecado (reemplazo: flate/konflate), pero flate salta las Kustomizations suspendidas: se migra
# cuando la fase 4 termine de quitar los suspend (antes del automerge de la fase 7).
name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifiestos:
    name: kubeconform
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v5
      - name: Instalar kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL "${base}/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Renderizar y validar cada kustomization
        run: scripts/flux/validar.sh

  secretos:
    name: secretos SOPS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Todo *.sops.* estructurado y cifrado
        run: python3 -I scripts/flux/revisar_sops.py

  flux-local:
    name: flux-local
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Instalar el CLI de Flux
        uses: fluxcd/flux2/action@v2.9.6
        with:
          version: 2.9.6
      # Renderiza como Flux (flux build ks) las Kustomizations de cluster/flux, también las suspendidas, y el
      # HelmRelease de cnpg con su chart.
      - name: flux-local test
        uses: allenporter/flux-local/action/test@8.4.0
        with:
          path: cluster/flux
          enable-helm: true
      # Informativo: si main todavía no tiene cluster/flux (el PR de la fase 3), falla sin bloquear.
      - name: flux-local diff contra main
        id: diff
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: allenporter/flux-local/action/diff@8.4.0
        with:
          path: cluster/flux
          resource: kustomization
          live-branch: main
      - name: Comentar el diff en el PR
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF: ${{ steps.diff.outputs.diff }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### flux-local diff (Kustomizations)'
            echo '```diff'
            printf '%s\n' "$DIFF" | head -c 60000
            echo '```'
          } > diff.md
          gh pr comment "$PR" --body-file diff.md --edit-last --create-if-none
