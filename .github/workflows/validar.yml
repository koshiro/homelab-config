# Checks de cada PR (docs/PLAN-FLUX.md, decisión «CI»). Sin ellos Renovate no puede hacer automerge.
name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifiestos:
    name: kubeconform
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v5
      - name: Instalar kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL "${base}/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Renderizar y validar cada kustomization
        run: scripts/flux/validar.sh

  secretos:
    name: secretos SOPS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Todo *.sops.* estructurado y cifrado
        run: python3 -I scripts/flux/revisar_sops.py

  flate:
    name: flate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # el diff lee origin/main con git archive
      - name: Instalar flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: ""
      # Renderiza como Flux las Kustomizations de cluster/flux (sin sus suspend: lo que se aplicaría al quitarlos)
      # y el HelmRelease de cnpg con su chart. Es el gate.
      - name: flate test
        run: scripts/flux/flate.sh test
      - name: flate diff contra main
        if: github.event_name == 'pull_request'
        run: scripts/flux/flate.sh diff origin/main > diff.txt
      - name: Comentar el diff en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### flate diff (lo que renderiza Flux, contra main)'
            if [[ -s diff.txt ]]; then
              echo '```diff'
              head -c 60000 diff.txt
              echo '```'
            else
              echo 'Sin cambios.'
            fi
          } > diff.md
          gh pr comment "$PR" --body-file diff.md --edit-last --create-if-none
