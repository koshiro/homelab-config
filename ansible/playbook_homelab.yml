# ansible/playbook_homelab.yml
# Orquestador Maestro del Homelab - Versión Organizada y Robusta
# Este playbook ejecuta toda la secuencia de despliegue desde cero

- name: 0. Bootstrap del Servidor Proxmox
  import_playbook: playbooks/core/playbook_bootstrap_server.yml
  tags: [bootstrap, proxmox]

- name: 1. Crear Máquinas Virtuales
  import_playbook: playbooks/core/playbook_create_vms.yml
  tags: [provision, vms]

- name: 2. Esperar a que las VMs estén listas
  hosts: truenas_vm:k3s_nodes
  gather_facts: false
  vars_files:
    - vars/homelab_vars.yml
  tags: [provision, wait]
  tasks:
    - name: Esperar por la conexión SSH a las VMs recién creadas
      wait_for_connection:
        delay: 60  # Incrementado para dar más tiempo de arranque
        timeout: 600

- name: 3. Configuración Inicial de TrueNAS y Generación de API Key
  import_playbook: playbooks/core/playbook_initial_truenas_setup.yml
  tags: [truenas, setup]

- name: 4. Configurar TrueNAS (Datasets y NFS Shares)
  import_playbook: playbooks/core/playbook_configure_truenas.yml
  tags: [truenas, storage]

- name: 5. Configurar el Clúster de Kubernetes
  import_playbook: playbooks/core/playbook_configure_cluster.yml
  tags: [k3s, cluster]

- name: 6. Desplegar aplicaciones base (Gitea, Traefik, etc.)
  hosts: k3s_nodes[0]
  gather_facts: false
  vars_files:
    - vars/homelab_vars.yml
  tags: [apps, base]
  tasks:
    - name: Esperar a que kubectl esté completamente funcional
      ansible.builtin.shell: "/usr/local/bin/k3s kubectl get nodes"
      retries: 10
      delay: 15
      until: kubectl_check.rc == 0
      register: kubectl_check

    - name: Aplicar manifiestos base del clúster
      ansible.builtin.command: "/usr/local/bin/k3s kubectl apply -k ../cluster"
      register: manifest_apply
      retries: 3
      delay: 30

    - name: Mostrar resultado de aplicación de manifiestos
      ansible.builtin.debug:
        msg: "Manifiestos aplicados: {{ manifest_apply.stdout_lines }}"

- name: 7. Configurar el Ecosistema de Gitea y GitOps
  import_playbook: playbooks/core/playbook_setup_gitea_ecosystem.yml
  tags: [gitops, gitea]

- name: 8. Verificación Final del Sistema
  hosts: k3s_nodes[0]
  gather_facts: false
  vars_files:
    - vars/homelab_vars.yml
  tags: [verify, final]
  tasks:
    - name: Verificar estado final del clúster
      ansible.builtin.shell: "/usr/local/bin/k3s kubectl get all --all-namespaces"
      register: final_status

    - name: Mostrar resumen final del deployment
      ansible.builtin.debug:
        msg: |
          🎉 HOMELAB DESPLEGADO EXITOSAMENTE
          ================================
          Clúster K3s: ✅ Operativo
          TrueNAS: ✅ Configurado
          GitOps: ✅ Activo
          
          Para administrar el clúster:
          ssh k3s-node-1
          sudo k3s kubectl get nodes
          
          Interface Web:
          - Gitea: http://gitea.homelab.local
          - TrueNAS: https://{{ hostvars['truenas']['ansible_host'] }}
          
          ¡Sistema listo para desarrollo y producción!
