# ansible/playbook_homelab.yml
# Playbook principal para el bootstrap completo del Homelab

- name: 0. Bootstrap del Servidor Proxmox
  import_playbook: playbooks/playbook_bootstrap_server.yml

- name: 1. Crear Máquinas Virtuales
  import_playbook: playbooks/playbook_create_vms.yml

- name: 2. Esperar a que las VMs estén listas
  hosts: truenas_vm:k3s_nodes
  gather_facts: no
  vars_files:
    - vars/homelab_vars.yml
  tasks:
    - name: Esperar por la conexión SSH a las VMs recién creadas
      wait_for_connection:
        delay: 30
        timeout: 600

- name: 3. Configuración Inicial de TrueNAS y Generación de API Key
  import_playbook: playbooks/playbook_initial_truenas_setup.yml

- name: 4. Configurar TrueNAS (Datasets y NFS Shares)
  import_playbook: playbooks/playbook_configure_truenas.yml

- name: 5. Configurar el Clúster de Kubernetes
  import_playbook: playbooks/playbook_configure_cluster.yml

- name: 6. Desplegar aplicaciones base (Gitea, Traefik, etc.)
  hosts: localhost
  connection: local
  tasks:
    - name: Aplicar manifiestos base
      command: "kubectl apply -k ../cluster"

- name: 7. Configurar el Ecosistema de Gitea y GitOps
  import_playbook: playbooks/playbook_setup_gitea_ecosystem.yml
