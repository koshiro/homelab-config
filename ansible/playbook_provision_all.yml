---
# ansible/playbook_provision_all.yml
# Reconstrucción desde cero: prepara el host Proxmox e instala k3s en los nodos.
# Las VMs (102–104) se crean/restauran en Proxmox (vzdump); el almacenamiento
# (ZFS, NFS, sanoid) vive en el host y está documentado en proxmox/README.md.
# Las aplicaciones de cluster/ las despliega Flux al mergear a main (cluster/flux).

- name: 0. Bootstrap del Servidor Proxmox
  import_playbook: playbooks/provisioning/playbook_bootstrap_server.yml
  tags: [bootstrap, proxmox]

- name: 1. Esperar a que los nodos k3s respondan
  hosts: k3s_nodes
  gather_facts: false
  tags: [provision, wait]
  tasks:
    - name: Esperar por la conexión SSH a los nodos
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 600

- name: 2. Configurar el Clúster de Kubernetes
  import_playbook: playbooks/provisioning/playbook_configure_cluster.yml
  tags: [k3s, cluster]

- name: 3. Verificación Final del Sistema
  hosts: k3s_master
  gather_facts: false
  tags: [verify, final]
  tasks:
    - name: Verificar nodos del clúster
      ansible.builtin.command: "kubectl get nodes -o wide"
      register: final_status
      changed_when: false

    - name: Mostrar estado de los nodos
      ansible.builtin.debug:
        var: final_status.stdout_lines
