# ansible/vars/truenas_vars.yml
# Variables para la configuración de TrueNAS

truenas_api_key: "TU_API_KEY_DE_TRUENAS"

# Definición de Datasets a crear en el pool 'Pool 4: Medios'
# Asumimos que el pool principal de datos se llama 'tank' o similar.
# Reemplaza 'tank' con el nombre real de tu pool de datos principal.
truenas_data_pool: "tank"

truenas_datasets:
  - name: media
    description: "Librería principal de Plex"
  - name: downloads
    description: "Directorio de descargas"
  - name: staging
    description: "Área de trabajo para apps de medios"
  - name: config-backups
    description: "Backups de configuración de aplicaciones"

# Definición de Recursos Compartidos NFS
truenas_nfs_shares:
  - path: "/mnt/{{ truenas_data_pool }}/media"
    comment: "Media para Plex"
    networks:
      - "192.168.1.0/24"
  - path: "/mnt/{{ truenas_data_pool }}/downloads"
    comment: "Descargas"
    networks:
      - "192.168.1.0/24"
  - path: "/mnt/{{ truenas_data_pool }}/staging"
    comment: "Staging"
    networks:
      - "192.168.1.0/24"
  - path: "/mnt/{{ truenas_data_pool }}/config-backups"
    comment: "Config Backups"
    networks:
      - "192.168.1.0/24"
