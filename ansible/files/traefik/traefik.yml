# traefik.yml (Configuración Base v1.0)
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# Puntos de entrada para el tráfico
entryPoints:
  web:
    address: ":80"
    # Redirección de HTTP a HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# Proveedores de configuración (de dónde Traefik lee las rutas)
providers:
  # Leer la configuración de los contenedores Docker en las VMs
  docker:
    # Esto se configurará para apuntar a los sockets de Docker de las VMs
    # Ejemplo para una VM (se añadirían las demás):
    # endpoint: "tcp://<IP_DE_LA_VM>:2375"
    exposedByDefault: false
  # También se configurará un proveedor de archivos para rutas manuales
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# Gestión de certificados SSL con Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: "tu-email@tu-dominio.com"
      storage: "/etc/traefik/acme.json"
      # Usar el desafío DNS de Cloudflare para certificados wildcard
      dnsChallenge:
        provider: cloudflare
        # Las credenciales se cargarán desde el archivo .env
