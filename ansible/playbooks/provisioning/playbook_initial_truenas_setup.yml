---
# ansible/playbooks/core/playbook_initial_truenas_setup.yml
- name: Configuración Inicial de TrueNAS y Generación de API Key
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/homelab_vars.yml

  tasks:
    - name: Esperar a que TrueNAS Web UI esté disponible
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/system/info"
        method: GET
        validate_certs: false
        status_code: [200, 401] # 401 es OK, significa que necesita auth
      register: truenas_api_check
      until: truenas_api_check.status in [200, 401]
      retries: 30
      delay: 10

    - name: Crear usuario de Ansible en TrueNAS usando API REST
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/user"
        method: POST
        body_format: json
        body:
          username: "ansible"
          password: "{{ truenas_initial_root_password }}"
          full_name: "Ansible Automation User"
          email: "ansible@example.com"
          group_create: true
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422] # 422 = usuario ya existe
      register: ansible_user_result
      failed_when:
        - ansible_user_result.status == 422
        - "'already exists' not in ansible_user_result.json['user_create.username'][0].message"

    - name: Obtener información del usuario ansible si ya existe
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/user?username=ansible"
        method: GET
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200
      register: existing_user_result
      when: ansible_user_result.status == 422

    - name: Crear API Key usando API REST
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/auth/api_key"
        method: POST
        body_format: json
        body:
          name: "ansible-automation-key"
          username: "truenas_admin"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422] # 422 si la API key ya existe
      register: truenas_generated_api_key
      failed_when:
        - truenas_generated_api_key.status == 422
        - "'already exists' not in (truenas_generated_api_key.content | default(''))"

    - name: Actualizar homelab_vars.yml con la API Key de TrueNAS
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/homelab_vars.yml"
        regexp: "^truenas_api_key: .*"
        line: "truenas_api_key: \"{{ truenas_generated_api_key.json.key }}\""
        state: present
      delegate_to: localhost
      run_once: true
      when:
        - truenas_generated_api_key.status == 200
        - truenas_generated_api_key.json.key is defined

    - name: Eliminar la contraseña root inicial de homelab_vars.yml (seguridad)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/homelab_vars.yml"
        regexp: "^truenas_initial_root_password: .*"
        line: "# truenas_initial_root_password: \"REMOVIDA_POR_SEGURIDAD\""
        state: present
      delegate_to: localhost
      run_once: true
      when:
        - truenas_generated_api_key.status == 200
        - truenas_generated_api_key.json.key is defined
