# ansible/playbooks/playbook_setup_gitea_ecosystem.yml
- name: Configurar el Ecosistema de Gitea y GitOps
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - ../../vars/homelab_vars.yml

  tasks:
    - name: Esperar a que la API de Gitea esté disponible
      uri:
        url: "http://gitea.homelab.local/api/v1/version"
        status_code: 200
      register: gitea_api_status
      until: gitea_api_status.status == 200
      retries: 30
      delay: 10

    - name: Crear token de administrador de Gitea
      uri:
        url: "http://gitea.homelab.local/api/v1/users/admin/tokens"
        method: POST
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        body:
          name: ansible-bootstrap-token
        body_format: json
        status_code: 201
      register: gitea_admin_token

    - name: Crear repositorio homelab-config
      uri:
        url: "http://gitea.homelab.local/api/v1/org/homelab/repos"
        method: POST
        headers:
          Authorization: "token {{ gitea_admin_token.json.sha1 }}"
        body:
          name: homelab-config
          private: yes
        body_format: json
        status_code: 201

    - name: Crear repositorio tattoo-app
      uri:
        url: "http://gitea.homelab.local/api/v1/org/homelab/repos"
        method: POST
        headers:
          Authorization: "token {{ gitea_admin_token.json.sha1 }}"
        body:
          name: tattoo-app
          private: yes
        body_format: json
        status_code: 201

    - name: Poblar repositorio homelab-config
      git:
        repo: "http://gitea.homelab.local/homelab/homelab-config.git"
        dest: /tmp/homelab-config
        clone: yes
        update: yes

    - name: Copiar manifiestos al repositorio
      copy:
        src: "../../cluster/"
        dest: /tmp/homelab-config/

    - name: Añadir archivos al repositorio Git
      ansible.builtin.command:
        cmd: git add .
        chdir: /tmp/homelab-config

    - name: Hacer commit de los manifiestos
      ansible.builtin.command:
        cmd: git commit -m "Initial cluster state"
        chdir: /tmp/homelab-config

    - name: Push de los cambios al repositorio
      ansible.builtin.command:
        cmd: git push origin main
        chdir: /tmp/homelab-config

    - name: Crear secreto para ArgoCD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: argocd-git-credentials
            namespace: argocd
          stringData:
            username: "{{ gitea_admin_user }}"
            password: "{{ gitea_admin_password }}"

    - name: Configurar repositorio para ArgoCD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: argocd-repo-config
            namespace: argocd
          data:
            url: http://gitea.gitea.svc.cluster.local/homelab/homelab-config.git
            branch: main

    - name: Obtener token de registro del runner
      uri:
        url: "http://gitea.homelab.local/api/v1/repos/homelab/tattoo-app/actions/runners/registration-token"
        method: GET
        headers:
          Authorization: "token {{ gitea_admin_token.json.sha1 }}"
      register: gitea_runner_token

    - name: Crear secreto para el runner de Gitea
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitea-runner-secret
            namespace: gitea
          stringData:
            token: "{{ gitea_runner_token.json.token }}"

    - name: Revocar token de administrador de Gitea
      uri:
        url: "http://gitea.homelab.local/api/v1/users/admin/tokens/{{ gitea_admin_token.json.id }}"
        method: DELETE
        user: "{{ gitea_admin_user }}"
        password: "{{ gitea_admin_password }}"
        status_code: 204
