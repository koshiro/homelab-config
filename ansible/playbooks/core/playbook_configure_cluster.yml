# ansible/playbooks/core/playbook_configure_cluster.yml
- name: Configurar el Clúster de k3s - Versión Robusta y Probada
  hosts: k3s_nodes
  become: yes
  gather_facts: yes
  serial: false
  vars:
    k3s_version: "v1.31.11+k3s1"  # Versión LTS estable verificada
    install_timeout: 900

  tasks:
    # PRE-VALIDACIÓN
    - name: Verificar conectividad a internet
      ansible.builtin.uri:
        url: https://get.k3s.io
        method: HEAD
        timeout: 10
      register: connectivity_check
      retries: 3
      delay: 5

    - name: Verificar espacio en disco suficiente (mínimo 4GB)
      ansible.builtin.shell: "df --output=avail / | tail -1"
      register: disk_space
      changed_when: false
      failed_when: (disk_space.stdout | int) < 4000000  # 4GB en KB

    - name: Instalar dependencias base en todos los nodos (incl. cliente NFS)
      ansible.builtin.apt:
        name:
          - nfs-common
        state: present
        update_cache: yes

    # INSTALACIÓN DEL MAESTRO
    - name: MAESTRO - Descargar script de instalación
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
        timeout: 30
      when: "inventory_hostname == groups['k3s_nodes'][0]"
      retries: 3
      delay: 10

    - name: MAESTRO - Instalar k3s con configuración robusta
      ansible.builtin.shell: |
        export INSTALL_K3S_VERSION="{{ k3s_version }}"
        export INSTALL_K3S_EXEC="server --cluster-init --write-kubeconfig-mode=644"
        /tmp/k3s-install.sh
      when: "inventory_hostname == groups['k3s_nodes'][0]"
      register: k3s_master_install
      timeout: "{{ install_timeout }}"
      retries: 2
      delay: 60

    - name: MAESTRO - Verificar servicio activo
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: yes
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Esperar API Server listo
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        timeout: 300
        delay: 10
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Obtener token del clúster
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64
      when: "inventory_hostname == groups['k3s_nodes'][0]"
      retries: 5
      delay: 10

    - name: MAESTRO - Decodificar token
      ansible.builtin.set_fact:
        k3s_token_decoded: "{{ k3s_token_b64.content | b64decode | trim }}"
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Distribuir token a todos los nodos
      ansible.builtin.set_fact:
        cluster_token: "{{ k3s_token_decoded }}"
        cluster_server_url: "https://{{ hostvars[groups['k3s_nodes'][0]].ansible_host }}:6443"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['k3s_nodes'] }}"
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    # INSTALACIÓN DE WORKERS
    - name: WORKERS - Pausa para sincronización
      ansible.builtin.pause:
        seconds: 10
      when: "inventory_hostname != groups['k3s_nodes'][0]"

    - name: WORKERS - Verificar disponibilidad del token
      ansible.builtin.fail:
        msg: "Token del clúster no disponible desde el maestro"
      when: 
        - "inventory_hostname != groups['k3s_nodes'][0]"
        - "hostvars[groups['k3s_nodes'][0]].cluster_token is not defined"

    - name: WORKERS - Descargar script de instalación
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
        timeout: 30
      when: "inventory_hostname != groups['k3s_nodes'][0]"
      retries: 3
      delay: 10

    - name: WORKERS - Instalar K3s Agent
      ansible.builtin.shell: |
        export INSTALL_K3S_VERSION="{{ k3s_version }}"
        export K3S_URL="{{ hostvars[groups['k3s_nodes'][0]].cluster_server_url }}"
        export K3S_TOKEN="{{ hostvars[groups['k3s_nodes'][0]].cluster_token }}"
        /tmp/k3s-install.sh
      when: "inventory_hostname != groups['k3s_nodes'][0]"
      register: k3s_agent_install
      timeout: "{{ install_timeout }}"
      retries: 2
      delay: 60

    - name: WORKERS - Verificar servicio agent activo
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: yes
      when: "inventory_hostname != groups['k3s_nodes'][0]"

    # VERIFICACIÓN FINAL
    - name: Pausa para estabilización del clúster
      ansible.builtin.pause:
        seconds: 30
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Verificar estado completo del clúster
      ansible.builtin.shell: "/usr/local/bin/k3s kubectl get nodes -o wide"
      register: final_cluster_status
      when: "inventory_hostname == groups['k3s_nodes'][0]"
      retries: 10
      delay: 15
      until: 
        - final_cluster_status.rc == 0
        - "groups['k3s_nodes'] | length == (final_cluster_status.stdout | regex_findall('Ready') | length)"

    - name: MAESTRO - Mostrar estado final del clúster
      ansible.builtin.debug:
        msg: |
          =================================
          🎉 CLÚSTER K3S INSTALADO EXITOSAMENTE
          =================================
          Versión: {{ k3s_version }}
          Nodos totales: {{ groups['k3s_nodes'] | length }}
          Estado del clúster:
          {{ final_cluster_status.stdout_lines | join('\n          ') }}
          =================================
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Configurar kubectl para root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0755'
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: MAESTRO - Enlazar kubeconfig
      ansible.builtin.file:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /root/.kube/config
        state: link
        force: yes
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    # LIMPIEZA
    - name: Limpiar scripts temporales
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent
