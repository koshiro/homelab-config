# ansible/playbooks/core/playbook_configure_truenas.yml
- name: Configurar TrueNAS
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - ../../vars/homelab_vars.yml

  tasks:
    - name: Esperar a que la API de TrueNAS esté disponible
      uri:
        url: "https://{{ truenas_host }}/api/v2.0/system/info"
        method: GET
        validate_certs: false
        status_code: [200, 401]
      register: truenas_api_status
      until: truenas_api_status.status in [200, 401]
      retries: 30
      delay: 10

    - name: Crear Datasets en TrueNAS usando API REST
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/pool/dataset"
        method: POST
        body_format: json
        body:
          name: "{{ (item.name == 'downloads') | ternary(truenas_downloads_pool, truenas_media_pool | default(truenas_data_pool)) }}/{{ item.name }}"
          type: "FILESYSTEM"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422]  # 200 = creado, 422 = ya existe
      loop: "{{ truenas_datasets }}"
      register: dataset_results

    - name: Crear Recursos Compartidos NFS en TrueNAS usando API REST
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/sharing/nfs"
        method: POST
        body_format: json
        body:
          path: "/mnt/{{ (item.name == 'downloads') | ternary(truenas_downloads_pool, truenas_media_pool | default(truenas_data_pool)) }}/{{ item.name }}"
          comment: "{{ item.description }}"
          networks:
            - "{{ network_cidr }}"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422]  # 200 = creado, 422 = ya existe
      loop: "{{ truenas_datasets }}"
      register: nfs_results

    - name: Habilitar el servicio NFS usando API REST
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/service/id/nfs"
        method: PUT
        body_format: json
        body:
          enable: true
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200

    - name: Mover System Dataset al pool de datos
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/systemdataset"
        method: PUT
        body_format: json
        body:
          pool: "{{ truenas_media_pool | default(truenas_data_pool) }}"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200

    - name: Crear directorio media/series
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/filesystem/mkdir"
        method: POST
        body_format: json
        body:
          path: "/mnt/{{ truenas_media_pool | default(truenas_data_pool) }}/media/series"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422]  # 422 si ya existe

    - name: Crear directorio media/peliculas
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/filesystem/mkdir"
        method: POST
        body_format: json
        body:
          path: "/mnt/{{ truenas_media_pool | default(truenas_data_pool) }}/media/peliculas"
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: [200, 422]  # 422 si ya existe

    - name: Permisos media/series (uid/gid 1000, 775)
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/filesystem/setperm"
        method: POST
        body_format: json
        body:
          path: "/mnt/{{ truenas_media_pool | default(truenas_data_pool) }}/media/series"
          mode: "775"
          uid: 1000
          gid: 1000
          options:
            recursive: false
            stripacl: false
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200

    - name: Permisos media/peliculas (uid/gid 1000, 775)
      ansible.builtin.uri:
        url: "https://{{ truenas_host }}/api/v2.0/filesystem/setperm"
        method: POST
        body_format: json
        body:
          path: "/mnt/{{ truenas_media_pool | default(truenas_data_pool) }}/media/peliculas"
          mode: "775"
          uid: 1000
          gid: 1000
          options:
            recursive: false
            stripacl: false
        headers:
          Authorization: "Basic {{ ('truenas_admin:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200
