# ansible/playbooks/playbook_configure_cluster.yml
- name: Configurar el Clúster de k3s
  hosts: k3s_nodes
  gather_facts: yes

  tasks:
    - name: Instalar k3s en el primer nodo (maestro)
      command: "curl -sfL https://get.k3s.io | sh -s - server --cluster-init"
      when: "inventory_hostname == groups['k3s_nodes'][0]"

    - name: Obtener el token del clúster
      command: "cat /var/lib/rancher/k3s/server/node-token"
      register: k3s_token
      when: "inventory_hostname == groups['k3s_nodes'][0]"
      changed_when: false

    - name: Instalar k3s en los nodos trabajadores
      command: "curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['k3s_nodes'][0]].ansible_host }}:6443 K3S_TOKEN={{ hostvars[groups['k3s_nodes'][0]].k3s_token.stdout }} sh -"
      when: "inventory_hostname != groups['k3s_nodes'][0]"
