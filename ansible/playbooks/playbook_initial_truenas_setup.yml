# ansible/playbooks/playbook_initial_truenas_setup.yml
- name: Configuración Inicial de TrueNAS y Generación de API Key
  hosts: truenas_vm
  gather_facts: no
  vars_files:
    - ../vars/homelab_vars.yml

  tasks:
    - name: Esperar a que TrueNAS esté completamente arrancado y SSH disponible
      wait_for_connection:
        delay: 30
        timeout: 600

    - name: Instalar la colección TrueNAS (si no está ya)
      ansible.builtin.pip:
        name: "freenas-api-client"
        state: present

    - name: Crear usuario de Ansible en TrueNAS
      community.general.truenas_user:
        username: "ansible"
        password: "{{ truenas_initial_root_password }}" # Usamos la contraseña root para crear el usuario
        full_name: "Ansible Automation User"
        email: "ansible@homelab.local"
        state: present
        truenas_host: "{{ ansible_host }}"
        api_key: "{{ truenas_initial_root_password }}" # Temporalmente usamos la contraseña root como API key

    - name: Generar API Key para el usuario Ansible
      community.general.truenas_api_key:
        username: "ansible"
        state: present
        truenas_host: "{{ ansible_host }}"
        api_key: "{{ truenas_initial_root_password }}" # Temporalmente usamos la contraseña root como API key
      register: truenas_generated_api_key

    - name: Actualizar homelab_vars.yml con la API Key de TrueNAS
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../vars/homelab_vars.yml"
        regexp: "^truenas_api_key: .*"
        line: "truenas_api_key: \"{{ truenas_generated_api_key.api_key }}\"\n        state: present
      delegate_to: localhost
      run_once: yes

    - name: Eliminar la contraseña root inicial de homelab_vars.yml (seguridad)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../vars/homelab_vars.yml"
        regexp: "^truenas_initial_root_password: .*"
        line: "# truenas_initial_root_password: \"REMOVIDA_POR_SEGURIDAD\""
        state: present
      delegate_to: localhost
      run_once: yes
