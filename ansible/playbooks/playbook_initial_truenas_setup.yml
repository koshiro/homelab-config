# ansible/playbooks/playbook_initial_truenas_setup.yml
- name: Configuración Inicial de TrueNAS y Generación de API Key
  hosts: truenas_vm
  gather_facts: no
  vars_files:
    - ../vars/homelab_vars.yml

  tasks:
    - name: Esperar a que TrueNAS esté completamente arrancado y SSH disponible
      wait_for_connection:
        delay: 30
        timeout: 600

    - name: Crear usuario de Ansible en TrueNAS usando API REST
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2.0/user"
        method: POST
        body_format: json
        body:
          username: "ansible"
          password: "{{ truenas_initial_root_password }}"
          full_name: "Ansible Automation User"
          email: "ansible@homelab.local"
          group_create: true
        headers:
          Authorization: "Basic {{ ('root:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200
      register: ansible_user_result

    - name: Generar API Key para el usuario Ansible usando API REST
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2.0/user/{{ ansible_user_result.json.id }}/get_user_obj"
        method: GET
        headers:
          Authorization: "Basic {{ ('root:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200
      register: user_obj_result

    - name: Crear API Key usando API REST
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2.0/auth/api_key"
        method: POST
        body_format: json
        body:
          name: "ansible-automation-key"
          username: "ansible"
        headers:
          Authorization: "Basic {{ ('root:' + truenas_initial_root_password) | b64encode }}"
        validate_certs: false
        status_code: 200
      register: truenas_generated_api_key

    - name: Actualizar homelab_vars.yml con la API Key de TrueNAS
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../vars/homelab_vars.yml"
        regexp: "^truenas_api_key: .*"
        line: "truenas_api_key: \"{{ truenas_generated_api_key.json.key }}\""
        state: present
      delegate_to: localhost
      run_once: yes

    - name: Eliminar la contraseña root inicial de homelab_vars.yml (seguridad)
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../vars/homelab_vars.yml"
        regexp: "^truenas_initial_root_password: .*"
        line: "# truenas_initial_root_password: \"REMOVIDA_POR_SEGURIDAD\""
        state: present
      delegate_to: localhost
      run_once: yes
