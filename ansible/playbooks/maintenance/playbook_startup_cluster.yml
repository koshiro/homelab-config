---
# ENCENDIDO / VUELTA A SERVICIO tras playbook_graceful_shutdown_cluster.yml
#
#   ansible-playbook -i ansible/inventory ansible/playbooks/maintenance/playbook_startup_cluster.yml
#
# Proxmox arranca solo las VMs k3s y el LXC nas (onboot=1). Este playbook:
#   1. Verifica pools ZFS, NFS y que los invitados estén encendidos (los arranca si no)
#   2. Espera a que los workers estén Ready, los desmarca (uncordon) y muestra pods con problemas

- name: 1. Proxmox listo
  hosts: proxmox_host
  become: true
  gather_facts: false
  tasks:
    - name: Pools ZFS
      ansible.builtin.command: zpool list -H -o name,health
      register: pools
      changed_when: false

    - name: Avisar si algún pool no está ONLINE
      ansible.builtin.debug:
        msg: "⚠️ {{ pools.stdout_lines | reject('search', 'ONLINE') | list }}"
      when: pools.stdout_lines | reject('search', 'ONLINE') | list | length > 0

    - name: Exports NFS activos
      ansible.builtin.shell: exportfs -ra && exportfs | grep -c '^/'
      register: nfs
      changed_when: false

    - name: Arrancar invitados con onboot=1 que estén detenidos
      ansible.builtin.shell: |
        for vm in $(qm list | awk 'NR>1 && $3=="stopped" {print $1}'); do
          qm config "$vm" | grep -q '^onboot: 1' && { echo "Arrancando VM $vm"; qm start "$vm"; }
        done
        for ct in $(pct list | awk 'NR>1 && $2=="stopped" {print $1}'); do
          pct config "$ct" | grep -q '^onboot: 1' && { echo "Arrancando CT $ct"; pct start "$ct"; }
        done
        true
      register: arranque
      changed_when: arranque.stdout | length > 0

    - name: Resumen Proxmox
      ansible.builtin.debug:
        msg: "Pools: {{ pools.stdout_lines }} · exports NFS: {{ nfs.stdout }} · {{ arranque.stdout_lines | default([]) }}"

- name: 2. Kubernetes de vuelta
  hosts: k3s_master
  become: true
  gather_facts: false
  vars:
    workers: "{{ groups['k3s_workers'] }}"
  tasks:
    - name: Esperar a que los workers estén Ready (hasta 10 min cada uno)
      ansible.builtin.command: "k3s kubectl wait --for=condition=Ready node/{{ item }} --timeout=600s"
      loop: "{{ workers }}"
      changed_when: false

    - name: Uncordon de los workers
      ansible.builtin.command: "k3s kubectl uncordon {{ item }}"
      loop: "{{ workers }}"
      changed_when: true

    - name: Dar tiempo a que se programen los pods
      ansible.builtin.pause:
        seconds: 60

    - name: Pods que no están Running/Completed
      ansible.builtin.shell: |
        k3s kubectl get pods -A --no-headers | awk '$4 !~ /Running|Completed/' || true
      register: pendientes
      changed_when: false

    - name: Estado final
      ansible.builtin.debug:
        msg: "{{ ['Todo en marcha ✅'] if (pendientes.stdout | trim) == '' else pendientes.stdout_lines }}"
