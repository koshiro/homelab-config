---
# ansible/playbooks/utils/playbook_graceful_shutdown_cluster.yml
# APAGADO ORDENADO DEL CLUSTER COMPLETO - SIGUIENDO MEJORES PRÁCTICAS
# 
# SECUENCIA CORRECTA:
# 1. Drenar nodos Kubernetes (evacuar pods)
# 2. Apagar servicios de TrueNAS de manera ordenada
# 3. Apagar VMs de Kubernetes
# 4. Apagar VM de TrueNAS
# 5. Apagar Proxmox host

- name: 1. APAGADO ORDENADO DEL CLUSTER KUBERNETES
  hosts: k3s_nodes
  become: yes
  gather_facts: yes
  serial: 1  # Procesar un nodo a la vez para evitar interrupciones
  vars:
    drain_timeout: 300  # 5 minutos para drenar cada nodo
    pod_termination_grace_period: 60  # 1 minuto para terminar pods

  tasks:
    - name: ADVERTENCIA - Operación crítica de apagado
      ansible.builtin.debug:
        msg: |
          ⚠️  OPERACIÓN CRÍTICA: APAGADO ORDENADO DEL CLUSTER
          ===================================================
          Este playbook apagará todo el cluster de manera ordenada:
          
          SECUENCIA:
          1. Drenar nodos Kubernetes (evacuar pods)
          2. Apagar servicios de TrueNAS
          3. Apagar VMs de Kubernetes
          4. Apagar VM de TrueNAS
          5. Apagar Proxmox host
          
          NODO ACTUAL: {{ inventory_hostname }}
          IP: {{ ansible_host }}
          
          CONTINÚA SOLO SI ESTÁS SEGURO.

    - name: Verificar que k3s esté funcionando
      ansible.builtin.systemd:
        name: "{{ 'k3s' if inventory_hostname == groups['k3s_nodes'][0] else 'k3s-agent' }}"
        state: started
      register: k3s_status

    - name: Verificar estado del nodo en el cluster
      ansible.builtin.shell: |
        if [ -f /usr/local/bin/k3s ]; then
          /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
        elif [ -f /usr/local/bin/k3s-agent ]; then
          echo "agent"
        else
          echo "not_installed"
        fi
      register: node_status
      changed_when: false

    - name: Mostrar estado del nodo
      ansible.builtin.debug:
        msg: "Nodo {{ inventory_hostname }} - Estado: {{ node_status.stdout }}"

    - name: Drenar nodo del cluster (solo si es worker)
      ansible.builtin.shell: |
        if [ -f /usr/local/bin/k3s ] && [ "{{ inventory_hostname }}" != "{{ groups['k3s_nodes'][0] }}" ]; then
          echo "Drenando nodo worker {{ inventory_hostname }}..."
          /usr/local/bin/k3s kubectl drain {{ inventory_hostname }} \
            --ignore-daemonsets \
            --delete-emptydir-data \
            --force \
            --timeout={{ drain_timeout }}s \
            --grace-period={{ pod_termination_grace_period }}s
        else
          echo "Nodo maestro o no k3s instalado, saltando drenado"
        fi
      register: drain_result
      failed_when: 
        - drain_result.rc != 0 
        - "'already cordoned' not in drain_result.stderr"
        - "'not found' not in drain_result.stderr"
      when: 
        - inventory_hostname != groups['k3s_nodes'][0]
        - k3s_status.status.ActiveState == "active"

    - name: Esperar a que los pods se evacuen completamente
      ansible.builtin.pause:
        seconds: 30
      when: 
        - inventory_hostname != groups['k3s_nodes'][0]
        - k3s_status.status.ActiveState == "active"

    - name: Verificar que no hay pods corriendo en el nodo
      ansible.builtin.shell: |
        if [ -f /usr/local/bin/k3s ]; then
          /usr/local/bin/k3s kubectl get pods --all-namespaces -o wide | grep {{ inventory_hostname }} | grep -v "Completed\|Error" | wc -l
        else
          echo "0"
        fi
      register: running_pods
      changed_when: false

    - name: Mostrar pods restantes
      ansible.builtin.debug:
        msg: "Pods restantes en {{ inventory_hostname }}: {{ running_pods.stdout }}"

    - name: Apagar k3s de manera ordenada
      ansible.builtin.systemd:
        name: "{{ 'k3s' if inventory_hostname == groups['k3s_nodes'][0] else 'k3s-agent' }}"
        state: stopped
      when: k3s_status.status.ActiveState == "active"

    - name: Verificar que k3s se apagó
      ansible.builtin.systemd:
        name: "{{ 'k3s' if inventory_hostname == groups['k3s_nodes'][0] else 'k3s-agent' }}"
        state: stopped
      register: k3s_stopped

    - name: Confirmar apagado de k3s
      ansible.builtin.debug:
        msg: "✅ k3s apagado exitosamente en {{ inventory_hostname }}"

- name: 2. APAGADO ORDENADO DE TRUENAS
  hosts: truenas_vm
  become: yes
  gather_facts: yes
  vars:
    truenas_api_timeout: 120
    truenas_shutdown_timeout: 300

  tasks:
    - name: Verificar conectividad a TrueNAS
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 443
        timeout: 30
        delay: 5

    - name: Obtener API key de TrueNAS desde Proxmox
      ansible.builtin.shell: |
        # Obtener la API key desde el archivo de configuración
        if [ -f /etc/pve/nodes/{{ inventory_hostname }}/qemu-server/{{ truenas_vmid | default('101') }}.conf ]; then
          grep -o 'api_key=[^[:space:]]*' /etc/pve/nodes/{{ inventory_hostname }}/qemu-server/{{ truenas_vmid | default('101') }}.conf | cut -d'=' -f2
        else
          echo ""
        fi
      register: truenas_api_key
      delegate_to: "{{ groups['proxmox_host'][0] }}"
      changed_when: false

    - name: Apagar servicios de TrueNAS de manera ordenada
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2.0/service"
        method: PUT
        body_format: json
        body:
          service: "{{ item }}"
          action: "stop"
        headers:
          Authorization: "Bearer {{ truenas_api_key.stdout }}"
        validate_certs: false
        timeout: "{{ truenas_api_timeout }}"
        status_code: [200, 400, 404]  # 400/404 = servicio ya detenido
      loop:
        - "nfs"      # Detener NFS primero
        - "smb"      # Detener Samba
        - "ssh"      # Detener SSH
        - "http"     # Detener web UI
      register: service_stop_results
      ignore_errors: yes

    - name: Mostrar resultados de detención de servicios
      ansible.builtin.debug:
        msg: "Servicio {{ item.item }} detenido: {{ 'ÉXITO' if item.status == 200 else 'YA DETENIDO' if item.status in [400, 404] else 'ERROR: ' + item.msg }}"
      loop: "{{ service_stop_results.results }}"

    - name: Esperar a que los servicios se detengan completamente
      ansible.builtin.pause:
        seconds: 30

    - name: Verificar que no hay conexiones activas
      ansible.builtin.shell: |
        netstat -an | grep -E ":(80|443|22|2049|139|445)" | grep LISTEN | wc -l
      register: active_connections
      changed_when: false

    - name: Mostrar conexiones activas restantes
      ansible.builtin.debug:
        msg: "Conexiones activas restantes en TrueNAS: {{ active_connections.stdout }}"

    - name: Apagar TrueNAS de manera ordenada
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/api/v2.0/system/shutdown"
        method: POST
        headers:
          Authorization: "Bearer {{ truenas_api_key.stdout }}"
        validate_certs: false
        timeout: "{{ truenas_shutdown_timeout }}"
        status_code: [200, 202]
      register: truenas_shutdown_result
      ignore_errors: yes

    - name: Confirmar apagado de TrueNAS
      ansible.builtin.debug:
        msg: "✅ TrueNAS apagado exitosamente"

- name: 3. APAGADO DE VMs DE KUBERNETES
  hosts: proxmox_host
  become: yes
  gather_facts: yes
  vars:
    vm_shutdown_timeout: 120

  tasks:
    - name: Verificar estado de las VMs de Kubernetes
      ansible.builtin.shell: "qm list | grep k3s"
      register: k3s_vms_status
      changed_when: false

    - name: Mostrar estado de VMs de Kubernetes
      ansible.builtin.debug:
        msg: "{{ k3s_vms_status.stdout_lines }}"

    - name: Apagar VMs de Kubernetes de manera ordenada
      ansible.builtin.shell: |
        for vm in $(qm list | grep k3s | awk '{print $1}'); do
          echo "Apagando VM $vm..."
          qm shutdown $vm --timeout={{ vm_shutdown_timeout }}
          sleep 10
        done
      register: k3s_vms_shutdown
      ignore_errors: yes

    - name: Esperar a que las VMs se apaguen completamente
      ansible.builtin.pause:
        seconds: 60

    - name: Verificar que las VMs están apagadas
      ansible.builtin.shell: "qm list | grep k3s"
      register: k3s_vms_final_status
      changed_when: false

    - name: Mostrar estado final de VMs de Kubernetes
      ansible.builtin.debug:
        msg: "{{ k3s_vms_final_status.stdout_lines }}"

    - name: Forzar apagado de VMs si es necesario
      ansible.builtin.shell: |
        for vm in $(qm list | grep k3s | awk '{print $1}'); do
          if qm status $vm | grep -q "running"; then
            echo "Forzando apagado de VM $vm..."
            qm stop $vm
          fi
        done
      register: force_shutdown_result
      when: "'running' in k3s_vms_final_status.stdout"

- name: 4. APAGADO DE VM DE TRUENAS
  hosts: proxmox_host
  become: yes
  gather_facts: yes

  tasks:
    - name: Verificar estado de la VM de TrueNAS
      ansible.builtin.shell: "qm list | grep truenas"
      register: truenas_vm_status
      changed_when: false

    - name: Mostrar estado de VM de TrueNAS
      ansible.builtin.debug:
        msg: "{{ truenas_vm_status.stdout_lines }}"

    - name: Apagar VM de TrueNAS si está corriendo
      ansible.builtin.shell: |
        truenas_vm=$(qm list | grep truenas | awk '{print $1}')
        if [ ! -z "$truenas_vm" ]; then
          echo "Apagando VM TrueNAS $truenas_vm..."
          qm shutdown $truenas_vm --timeout=120
          sleep 10
          
          # Verificar si se apagó correctamente
          if qm status $truenas_vm | grep -q "running"; then
            echo "Forzando apagado de VM TrueNAS $truenas_vm..."
            qm stop $truenas_vm
          fi
        fi
      register: truenas_vm_shutdown
      ignore_errors: yes

    - name: Esperar a que TrueNAS se apague completamente
      ansible.builtin.pause:
        seconds: 30

    - name: Verificar estado final de VM de TrueNAS
      ansible.builtin.shell: "qm list | grep truenas"
      register: truenas_vm_final_status
      changed_when: false

    - name: Mostrar estado final de VM de TrueNAS
      ansible.builtin.debug:
        msg: "{{ truenas_vm_final_status.stdout_lines }}"

- name: 5. APAGADO FINAL DE PROXMOX
  hosts: proxmox_host
  become: yes
  gather_facts: yes

  tasks:
    - name: Verificar que todas las VMs están apagadas
      ansible.builtin.shell: "qm list | grep -v 'stopped' | grep -v 'TASK' | wc -l"
      register: running_vms_count
      changed_when: false

    - name: Mostrar VMs restantes
      ansible.builtin.debug:
        msg: "VMs corriendo restantes: {{ running_vms_count.stdout }}"

    - name: ADVERTENCIA FINAL antes de apagar Proxmox
      ansible.builtin.debug:
        msg: |
          🚨 APAGADO FINAL DE PROXMOX
          ===========================
          
          Estado del sistema:
          - VMs corriendo: {{ running_vms_count.stdout }}
          - Cluster Kubernetes: APAGADO
          - TrueNAS: APAGADO
          
          Proxmox se apagará en 30 segundos.
          Presiona CTRL+C para cancelar.

    - name: Pausa final para confirmación
      ansible.builtin.pause:
        seconds: 30

    - name: Apagar Proxmox de manera segura
      community.general.shutdown:
        msg: "Apagando Proxmox después de apagado ordenado del cluster completo."
        delay: 10
      when: ansible_system == 'Linux'

    - name: Confirmar apagado de Proxmox
      ansible.builtin.debug:
        msg: "✅ Proxmox apagándose exitosamente"

- name: 6. VERIFICACIÓN FINAL
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Resumen del apagado ordenado
      ansible.builtin.debug:
        msg: |
          🎉 APAGADO ORDENADO COMPLETADO EXITOSAMENTE
          ===========================================
          
          ✅ Cluster Kubernetes: Apagado ordenadamente
          ✅ TrueNAS: Servicios detenidos y VM apagada
          ✅ VMs de Kubernetes: Apagadas
          ✅ Proxmox: Apagándose
          
          📋 PRÓXIMOS PASOS:
          1. Agrega la RAM que necesites
          2. Enciende Proxmox
          3. Espera a que todas las VMs arranquen
          4. Verifica el estado del cluster:
             ansible-playbook -i inventory playbook_homelab.yml --check
          
          🚨 IMPORTANTE: El cluster puede tardar varios minutos en estabilizarse
          después del reinicio debido a la sincronización de servicios.
