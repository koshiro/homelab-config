---
# APAGADO ORDENADO DEL HOMELAB (arquitectura 2026-10: sin TrueNAS, ZFS/NFS en el host Proxmox)
#
#   ansible-playbook -i ansible/inventory ansible/playbooks/maintenance/playbook_graceful_shutdown_cluster.yml
#
# Secuencia:
#   0. Confirmación interactiva (saltar con -e confirmar=si)
#   1. pibot (control-plane): snapshot de etcd, cordon de los workers y drenado con borrado directo
#      de pods (--disable-eviction: las PDB de Postgres no bloquean; cada pod recibe SIGTERM y su
#      grace period, así Postgres/Immich/Minecraft cierran limpio antes de apagar las VMs)
#   2. Proxmox: apaga LXC (nas) y VMs (k3s-node-1/2/3 y cualquier otra encendida), con timeout y
#      apagado forzado solo si no responden
#   3. Proxmox host: apagado (salvo -e apagar_proxmox=false, p. ej. para mantener solo VMs)
#   4. pibot: queda encendido por defecto (control-plane en otra fuente de energía). Con
#      -e apagar_pibot=true también se apaga.
#
# Al volver: Proxmox arranca VMs y LXC solos (onboot=1). Luego ejecutar
#   ansible-playbook -i ansible/inventory ansible/playbooks/maintenance/playbook_startup_cluster.yml
# para desmarcar (uncordon) los workers y verificar el estado.

- name: 0. Confirmación
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    confirmar: "no"
  tasks:
    - name: Pedir confirmación
      ansible.builtin.pause:
        prompt: |
          ⚠️  Se apagará el homelab: workers k3s, LXC nas{{ ', host Proxmox' if (apagar_proxmox | default(true) | bool) else '' }}{{ ' y pibot' if (apagar_pibot | default(false) | bool) else '' }}.
          Escribe 'apagar' para continuar
      register: respuesta
      when: confirmar != "si"

    - name: Abortar si no se confirmó
      ansible.builtin.fail:
        msg: "Apagado cancelado."
      when:
        - confirmar != "si"
        - respuesta.user_input | default('') != "apagar"

- name: 1. Vaciar los workers de Kubernetes (desde el control-plane)
  hosts: k3s_master
  become: true
  gather_facts: false
  vars:
    workers: "{{ groups['k3s_workers'] }}"
    drain_timeout: 300
    grace_period: 90
  tasks:
    - name: Snapshot de etcd previo al apagado
      ansible.builtin.command: k3s etcd-snapshot save --name pre-apagado
      register: etcd_snap
      changed_when: true
      failed_when: false

    - name: Resultado del snapshot de etcd
      ansible.builtin.debug:
        msg: "{{ 'Snapshot de etcd OK' if etcd_snap.rc == 0 else 'No se pudo crear snapshot de etcd: ' ~ etcd_snap.stderr }}"

    - name: Cordon de todos los workers (no se programan pods nuevos)
      ansible.builtin.command: "k3s kubectl cordon {{ item }}"
      loop: "{{ workers }}"
      changed_when: true

    - name: Drenar workers (borrado directo; las PDB no bloquean)
      ansible.builtin.command: >-
        k3s kubectl drain {{ item }}
        --ignore-daemonsets --delete-emptydir-data --force
        --disable-eviction --grace-period={{ grace_period }} --timeout={{ drain_timeout }}s
      loop: "{{ workers }}"
      register: drain
      changed_when: true
      failed_when: false

    - name: Avisar si algún drenado no terminó
      ansible.builtin.debug:
        msg: "⚠️ {{ item.item }}: {{ item.stderr | default('') | trim | truncate(300) }}"
      loop: "{{ drain.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

    - name: Esperar a que no queden pods (salvo DaemonSets) en los workers
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods -A -o json --field-selector=status.phase=Running | python3 -c '
        import json, sys
        workers = set(sys.argv[1].split(","))
        n = 0
        for p in json.load(sys.stdin)["items"]:
            owners = [o["kind"] for o in p["metadata"].get("ownerReferences", [])]
            if p["spec"].get("nodeName") in workers and "DaemonSet" not in owners:
                n += 1
        print(n)' "{{ workers | join(',') }}"
      args:
        executable: /bin/bash
      register: restantes
      until: restantes.stdout | int == 0
      retries: 12
      delay: 10
      changed_when: false
      failed_when: false

    - name: Pods que siguen en los workers
      ansible.builtin.debug:
        msg: "Pods restantes en workers: {{ restantes.stdout }} (se detendrán al apagar las VMs)"

- name: 2. Apagar LXC y VMs en Proxmox
  hosts: proxmox_host
  become: true
  gather_facts: false
  vars:
    guest_timeout: 180
  tasks:
    - name: Apagar LXC encendidos
      ansible.builtin.shell: |
        for ct in $(pct list | awk 'NR>1 && $2=="running" {print $1}'); do
          echo "Apagando CT $ct"; pct shutdown "$ct" --timeout {{ guest_timeout }} || pct stop "$ct"
        done
      register: lxc
      changed_when: lxc.stdout | length > 0

    - name: Apagar VMs encendidas (en paralelo, ACPI)
      ansible.builtin.shell: |
        for vm in $(qm list | awk 'NR>1 && $3=="running" {print $1}'); do
          echo "Apagando VM $vm"; qm shutdown "$vm" --timeout {{ guest_timeout }} &
        done
        wait
      register: vms
      changed_when: vms.stdout | length > 0

    - name: Forzar las VMs que no respondieron
      ansible.builtin.shell: |
        for vm in $(qm list | awk 'NR>1 && $3=="running" {print $1}'); do
          echo "Forzando VM $vm"; qm stop "$vm"
        done
      register: forzadas
      changed_when: forzadas.stdout | length > 0

    - name: Estado de invitados y pools
      ansible.builtin.shell: |
        qm list; pct list; zpool list -H -o name,health,cap
      register: estado
      changed_when: false

    - name: Mostrar estado
      ansible.builtin.debug:
        var: estado.stdout_lines

- name: 3. Apagar el host Proxmox
  hosts: proxmox_host
  become: true
  gather_facts: false
  tasks:
    - name: Apagar Proxmox
      community.general.shutdown:
        msg: "Apagado ordenado del homelab (playbook_graceful_shutdown_cluster)"
        delay: 5
      when: apagar_proxmox | default(true) | bool

- name: 4. pibot (control-plane)
  hosts: k3s_master
  become: true
  gather_facts: false
  tasks:
    - name: Apagar pibot (solo con -e apagar_pibot=true)
      community.general.shutdown:
        msg: "Apagado ordenado del homelab (playbook_graceful_shutdown_cluster)"
        delay: 5
      when: apagar_pibot | default(false) | bool

    - name: Resumen
      ansible.builtin.debug:
        msg: |
          Apagado completado.
          - Workers k3s: vaciados y apagados
          - LXC nas y VMs: apagados
          - Proxmox: {{ 'apagándose' if (apagar_proxmox | default(true) | bool) else 'encendido' }}
          - pibot: {{ 'apagándose' if (apagar_pibot | default(false) | bool) else 'encendido (control-plane)' }}
          Al encender: ansible-playbook -i ansible/inventory ansible/playbooks/maintenance/playbook_startup_cluster.yml
