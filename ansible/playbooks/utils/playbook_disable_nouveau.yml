- name: Deshabilitar driver nouveau en nodos k3s
  hosts: k3s_nodes
  become: yes
  gather_facts: no
  tasks:
    - name: Poner nouveau en lista negra
      copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          blacklist nouveau
          options nouveau modeset=0

    - name: Actualizar initramfs
      command: update-initramfs -u
      register: update_initramfs
      changed_when: update_initramfs.rc == 0

    - name: Reiniciar el nodo
      reboot:

