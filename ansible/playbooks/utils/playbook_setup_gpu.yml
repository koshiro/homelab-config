- name: Preparar GPU NVIDIA en k3s-node-1 (Ubuntu 22.04)
  hosts: k3s_nodes
  become: yes
  gather_facts: no
  vars:
    gpu_node: "192.168.1.131"
  tasks:
    - name: Ejecutar solo en el nodo con GPU
      meta: end_host
      when: ansible_host != gpu_node

    - name: Instalar dependencias base
      apt:
        name:
          - software-properties-common
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Añadir PPA graphics-drivers
      command: add-apt-repository -y ppa:graphics-drivers/ppa
      register: add_ppa
      changed_when: add_ppa.rc == 0

    - name: Instalar driver NVIDIA 570
      apt:
        name: nvidia-driver-570
        state: present
        update_cache: yes

    - name: Instalar nvidia-container-toolkit
      shell: |
        set -e
        distribution=$( . /etc/os-release; echo ${ID}${VERSION_ID} )
        mkdir -p /usr/share/keyrings /etc/apt/sources.list.d
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/${distribution}/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' > /etc/apt/sources.list.d/nvidia-container-toolkit.list
        apt-get update -y
        apt-get install -y nvidia-container-toolkit
        which nvidia-ctk || true
      args:
        warn: false

    - name: Configurar template de containerd con runtime nvidia
      copy:
        dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
        content: |
          version = 3
          root = "/var/lib/rancher/k3s/agent/containerd"
          state = "/run/k3s/containerd"

          [grpc]
            address = "/run/k3s/containerd/containerd.sock"

          [plugins.'io.containerd.internal.v1.opt']
            path = "/var/lib/rancher/k3s/agent/containerd"

          [plugins.'io.containerd.cri.v1.runtime']
            enable_selinux = false
            enable_unprivileged_ports = true
            enable_unprivileged_icmp = true
            device_ownership_from_security_context = false

          [plugins.'io.containerd.cri.v1.images']
            snapshotter = "overlayfs"
            disable_snapshot_annotations = true

          [plugins.'io.containerd.cri.v1.images'.pinned_images]
            sandbox = "rancher/mirrored-pause:3.6"

          [plugins.'io.containerd.cri.v1.runtime'.cni]
            bin_dir = "/var/lib/rancher/k3s/data/cni"
            conf_dir = "/var/lib/rancher/k3s/agent/etc/cni/net.d"

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.'nvidia']
            runtime_type = "io.containerd.runc.v2"

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.'nvidia'.options]
            BinaryName = "/usr/bin/nvidia-container-runtime"
            SystemdCgroup = true

          [plugins.'io.containerd.cri.v1.images'.registry]
            config_path = "/var/lib/rancher/k3s/agent/etc/containerd/certs.d"

    - name: Reiniciar k3s
      systemd:
        name: k3s
        state: restarted

    - name: Verificar nvidia-smi
      shell: nvidia-smi || true
      register: nvsmi
      changed_when: false

    - name: Mostrar nvidia-smi
      debug:
        var: nvsmi.stdout
