- name: Preparar GPU NVIDIA en k3s-node-1 (Ubuntu 22.04)
  hosts: k3s_nodes
  become: yes
  gather_facts: no
  tasks:
    - name: Instalar dependencias base
      apt:
        name:
          - software-properties-common
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Añadir PPA graphics-drivers
      command: add-apt-repository -y ppa:graphics-drivers/ppa
      register: add_ppa
      changed_when: add_ppa.rc == 0

    - name: Instalar driver NVIDIA 570
      apt:
        name: nvidia-driver-570
        state: present
        update_cache: yes

    - name: Determinar la distribución del SO
      shell: . /etc/os-release; echo ${ID}${VERSION_ID}
      register: os_distribution
      changed_when: false

    - name: Crear directorios necesarios
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /usr/share/keyrings
        - /etc/apt/sources.list.d

    - name: Descargar y añadir la clave GPG de NVIDIA
      shell: curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Añadir el repositorio de NVIDIA Container Toolkit
      shell: "curl -fsSL https://nvidia.github.io/libnvidia-container/stable/{{ os_distribution.stdout }}/nvidia-container-toolkit.list | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' > /etc/apt/sources.list.d/nvidia-container-toolkit.list"
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Instalar nvidia-container-toolkit
      apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: yes

    - name: Verificar la instalación de nvidia-ctk
      command: which nvidia-ctk
      register: nvidia_ctk_path
      changed_when: false
      failed_when: nvidia_ctk_path.rc != 0

    - name: Reiniciar k3s
      systemd:
        name: k3s-agent

    - name: Verificar nvidia-smi
      shell: nvidia-smi || true
      register: nvsmi
      changed_when: false

    - name: Mostrar nvidia-smi
      debug:
        var: nvsmi.stdout
