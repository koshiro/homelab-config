# ansible/playbooks/playbook_resize_vm_disks.yml
# REDIMENSIONAR DISCOS DE VMs PARA K3S
- name: Redimensionar Discos de VMs K3s
  hosts: proxmox_host
  vars_files:
    - ../vars/homelab_vars.yml

  tasks:
    - name: ADVERTENCIA - Operación crítica
      ansible.builtin.debug:
        msg: |
          ⚠️  OPERACIÓN CRÍTICA: REDIMENSIONAMIENTO DE DISCOS
          ===============================================
          Esta operación redimensionará los discos de las VMs.
          ASEGÚRATE de tener backups antes de continuar.
          
          VMs afectadas: k3s-node-1, k3s-node-2, k3s-node-3
          Tamaño nuevo: 10GB (requerido mínimo para k3s)
          
          CONTINÚA SOLO SI ESTÁS SEGURO.

    - name: Pausa para confirmación manual
      ansible.builtin.pause:
        prompt: "Presiona ENTER para continuar con el redimensionamiento o CTRL+C para cancelar"

    - name: Apagar VMs antes del redimensionamiento
      ansible.builtin.command: "qm stop {{ item.vmid }}"
      loop: "{{ vms }}"
      when: "'k3s' in item.name"
      register: stop_results
      failed_when: stop_results.rc != 0 and "not running" not in stop_results.stderr

    - name: Esperar a que las VMs se apaguen completamente
      ansible.builtin.pause:
        seconds: 30

    - name: Redimensionar discos a 10GB
      ansible.builtin.command: "qm resize {{ item.vmid }} scsi0 10G"
      loop: "{{ vms }}"
      when: "'k3s' in item.name"
      register: resize_results

    - name: Mostrar resultados del redimensionamiento
      ansible.builtin.debug:
        msg: "Redimensionado {{ item.item.name }} (VM {{ item.item.vmid }}): {{ 'ÉXITO' if item.rc == 0 else 'ERROR: ' + item.stderr }}"
      loop: "{{ resize_results.results }}"

    - name: Reiniciar VMs
      ansible.builtin.command: "qm start {{ item.vmid }}"
      loop: "{{ vms }}"
      when: "'k3s' in item.name"
      register: start_results

    - name: Esperar a que las VMs arranquen
      ansible.builtin.pause:
        seconds: 60

    - name: Verificar que las VMs estén corriendo
      ansible.builtin.command: "qm status {{ item.vmid }}"
      loop: "{{ vms }}"
      when: "'k3s' in item.name"
      register: status_check

    - name: Mostrar estado final
      ansible.builtin.debug:
        msg: "Estado de {{ item.item.name }}: {{ item.stdout }}"
      loop: "{{ status_check.results }}"

- name: Extender particiones dentro de las VMs
  hosts: k3s_nodes
  gather_facts: false

  tasks:
    - name: Esperar conectividad SSH después del reinicio
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10

    - name: Verificar espacio antes de extender
      ansible.builtin.shell: "df -h /"
      register: space_before
      changed_when: false

    - name: Mostrar espacio antes
      ansible.builtin.debug:
        msg: "Espacio ANTES de extender en {{ inventory_hostname }}: {{ space_before.stdout_lines }}"

    - name: Extender partición (método automático)
      ansible.builtin.shell: |
        # Obtener el dispositivo raíz
        root_dev=$(df / | awk 'NR==2 {print $1}' | sed 's/[0-9]*$//')
        part_num=$(df / | awk 'NR==2 {print $1}' | sed 's/.*[^0-9]\([0-9]*\)$/\1/')
        
        # Redimensionar partición
        growpart ${root_dev} ${part_num} || true
        
        # Extender filesystem
        if command -v resize2fs >/dev/null; then
          resize2fs $(df / | awk 'NR==2 {print $1}')
        elif command -v xfs_growfs >/dev/null; then
          xfs_growfs /
        fi
      become: true
      register: extend_result

    - name: Verificar espacio después de extender
      ansible.builtin.shell: "df -h /"
      register: space_after
      changed_when: false

    - name: Mostrar espacio final
      ansible.builtin.debug:
        msg: |
          ✅ REDIMENSIONAMIENTO COMPLETADO
          ================================
          {{ inventory_hostname }}:
          ANTES: {{ space_before.stdout_lines[1] }}
          DESPUÉS: {{ space_after.stdout_lines[1] }}
          
          {{ 'SUFICIENTE PARA K3S' if 'G' in space_after.stdout and space_after.stdout.split()[3].rstrip('GM')|int > 2 else 'AÚN INSUFICIENTE' }}
