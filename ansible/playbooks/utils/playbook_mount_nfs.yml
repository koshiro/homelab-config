- name: Montar NFS en nodos k3s
  hosts: k3s_nodes
  become: yes
  gather_facts: no
  vars_files:
    - ../../vars/homelab_vars.yml
  tasks:
    - name: Instalar cliente NFS
      ansible.builtin.package:
        name: nfs-common
        state: present

    - name: Verificar ping a TrueNAS
      ansible.builtin.command: ping -c1 -W2 {{ truenas_host }}
      register: ping_truenas
      changed_when: false
      failed_when: ping_truenas.rc != 0

    - name: Comprobar exports NFS de TrueNAS
      ansible.builtin.command: showmount -e {{ truenas_host }}
      register: exports
      changed_when: false
      failed_when: exports.rc != 0

    - name: Crear puntos de montaje
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/pool_medios
        - /mnt/pool_downloads

    - name: Montar /mnt/pool_medios (NFS HDD)
      ansible.builtin.mount:
        path: /mnt/pool_medios
        src: "{{ truenas_host }}:/mnt/{{ truenas_media_pool | default(truenas_data_pool) }}/media"
        fstype: nfs
        opts: "nfsvers=4,tcp,_netdev,bg,hard,timeo=600,retrans=2"
        state: mounted

    - name: Montar /mnt/pool_downloads (NFS SSD)
      ansible.builtin.mount:
        path: /mnt/pool_downloads
        src: "{{ truenas_host }}:/mnt/{{ truenas_downloads_pool }}/downloads"
        fstype: nfs
        opts: "nfsvers=4,tcp,_netdev,bg,hard,timeo=600,retrans=2"
        state: mounted
