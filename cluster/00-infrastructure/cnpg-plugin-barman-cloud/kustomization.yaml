# Plugin Barman Cloud de CloudNativePG (respaldos base + WAL a S3 → PITR). Va en cnpg-system, junto al operador
# (CNPG >= 1.26; hoy 1.27.0). Requiere cert-manager (aplicarlo antes). Uso: cluster/apps/postgresql/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
