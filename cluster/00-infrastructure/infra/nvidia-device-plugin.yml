apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: nvidia-device-plugin
  labels:
    app: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-node-1
      containers:
      - args:
        - --fail-on-init-error=false
        - --device-list-strategy=envvar
        - --device-discovery-strategy=nvml
        - --nvidia-driver-root=/driver-root
        - --config-file=/etc/nvidia-device-plugin/config.yaml
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
        imagePullPolicy: IfNotPresent
        name: nvidia-device-plugin-ctr
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nvidia-device-plugin
          name: config-volume
          readOnly: true
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugin
        - mountPath: /dev
          name: dev-directory
        - mountPath: /driver-root/usr
          name: host-usr
          readOnly: true
        - mountPath: /driver-root/lib
          name: host-lib
          readOnly: true
        - mountPath: /driver-root/lib64
          name: host-lib64
          readOnly: true
      dnsPolicy: ClusterFirst
      priorityClassName: system-node-critical
      restartPolicy: Always
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - configMap:
          name: nvidia-device-plugin-config
          items:
            - key: config.yaml
              path: config.yaml
        name: config-volume
      - hostPath:
          path: /var/lib/kubelet/device-plugins
        name: device-plugin
      - hostPath:
          path: /dev
        name: dev-directory
      - hostPath:
          path: /usr
        name: host-usr
      - hostPath:
          path: /lib
        name: host-lib
      - hostPath:
          path: /lib64
        name: host-lib64
