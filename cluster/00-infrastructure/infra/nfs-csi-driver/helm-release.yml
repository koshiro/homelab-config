apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: argocd
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cluster-settings
      valuesKey: TRUENAS_HOST
      targetPath: nfs.server
  values:
    nfs:
      path: /mnt/homelab-storage
      mountOptions:
        - vers=4
        - rsize=262144
        - wsize=262144  
        - hard
        - intr
        - timeo=600
        - retrans=2
        - noatime
        - _netdev
    storageClass:
      name: nfs-csi
      defaultClass: false
      provisionerName: k8s-sigs.io/nfs-subdir-external-provisioner
      mountOptions:
        - vers=4
        - rsize=262144
        - wsize=262144
        - hard
        - intr
        - timeo=600
        - retrans=2
        - noatime
        - _netdev
    # Configurar permisos para evitar errores de "read-only file system"
    securityContext:
      runAsUser: 1000
      fsGroup: 1000
    # Configurar permisos de directorio NFS
    nfsPermissions:
      enabled: true
      uid: 1000
      gid: 1000
      mode: 0755
