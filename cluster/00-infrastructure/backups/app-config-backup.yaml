# WebODM: Postgres 9.x propio (no CNPG); pg_dump 17 sabe leer servidores antiguos.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: config-backup-webodm-db
  namespace: webodm
  labels:
    app.kubernetes.io/component: config-backup
spec:
  schedule: "46 2 * * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGHOST
                  value: db
                - name: PGUSER
                  value: postgres
              command:
                - /bin/sh
                - -ec
                - |
                  d=/backups/apps/webodm-db
                  mkdir -p "$d"
                  pg_dump --format=custom --compress=6 --file="$d/webodm_dev.dump.tmp" webodm_dev
                  pg_restore --list "$d/webodm_dev.dump.tmp" > /dev/null
                  mv "$d/webodm_dev.dump.tmp" "$d/webodm_dev.dump"
                  date -Iseconds > "$d/.last-backup"
                  ls -lh "$d"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.1.100
                path: /nvme/k8s/backups
