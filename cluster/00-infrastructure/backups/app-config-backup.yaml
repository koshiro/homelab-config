# Respaldo de configuración y bases de datos de las apps con PVC local-path (disco de los workers,
# sin vzdump). Copia solo lo que no se regenera ni se vuelve a descargar (sin MediaCover, logs,
# Metadata/Cache de Plex, librerías/jars de Minecraft, modelos de embeddings) a
# Proxmox nvme/k8s/backups/apps/<app>/data: espejo diario; la historia la dan sanoid (nvme),
# syncoid (respaldo/k8s) y restic (R2). check-backups.sh vigila apps/<app>/.last-backup.
# El pod cae en el nodo del PV (nodeAffinity de local-path); RWO permite convivir con la app.
# Restaurar: escalar la app a 0, copiar data/ sobre el PVC (chown 1000:1000) y escalar a 1.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: config-backup-plex
  namespace: plex
  labels:
    app.kubernetes.io/component: config-backup
spec:
  schedule: "40 2 * * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.22
              env:
                - name: APP
                  value: plex
                - name: EXCLUDES
                  value: |
                    /transcoding/
                    /Library/Application Support/Plex Media Server/Metadata/
                    /Library/Application Support/Plex Media Server/Media/
                    /Library/Application Support/Plex Media Server/Cache/
                    /Library/Application Support/Plex Media Server/Logs/
                    /Library/Application Support/Plex Media Server/Codecs/
                    /Library/Application Support/Plex Media Server/Scanners/
                    /Library/Application Support/Plex Media Server/Updates/
                    /Library/Application Support/Plex Media Server/Crash Reports/
                    /Library/Application Support/Plex Media Server/Diagnostics/
                    /Library/Application Support/Plex Media Server/Drivers/
                    *.db-20*
              command:
                - /bin/sh
                - -ec
                - |
                  apk add -q --no-cache rsync sqlite
                  d=/backups/apps/$APP
                  mkdir -p "$d/data"
                  # las DB se copian aparte con la API de backup de SQLite (copia consistente con la app corriendo)
                  { printf '%s\n' "$EXCLUDES"; printf '%s\n' '*-wal' '*-shm' '*-journal'; } | grep . > /tmp/ex
                  # 24 = archivos que desaparecieron durante la copia (temporales de la app): no es error
                  rsync -a --delete --delete-excluded --exclude-from=/tmp/ex /src/ "$d/data/" || [ $? -eq 24 ]
                  cd /src
                  find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) | while read -r f; do
                    [ -f "$d/data/$f" ] || continue
                    sqlite3 "$f" ".backup '$d/data/$f.tmp'" && mv "$d/data/$f.tmp" "$d/data/$f"
                    # si la app estaba detenida, sqlite3 crea -wal/-shm como root: devolverlos al dueño de la DB
                    for x in "$f-wal" "$f-shm"; do
                      if [ -e "$x" ]; then chown "$(stat -c %u:%g "$f")" "$x"; fi
                    done
                  done
                  date -Iseconds > "$d/.last-backup"
                  du -sh "$d/data"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - name: src
                  mountPath: /src
                - name: backups
                  mountPath: /backups
          volumes:
            - name: src
              persistentVolumeClaim:
                claimName: plex-config-pvc
            - name: backups
              nfs:
                server: 192.168.1.100
                path: /nvme/k8s/backups
---
