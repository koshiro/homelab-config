apiVersion: apps/v1
kind: Deployment
metadata:
  name: timemachine-smb
  namespace: timemachine-smb
  labels:
    app: timemachine-smb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timemachine-smb
  template:
    metadata:
      labels:
        app: timemachine-smb
    spec:
      securityContext:
        fsGroup: 1000 # El GID del usuario 'timemachine' en TrueNAS
      containers:
        - name: timemachine-samba
          image: mbentley/timemachine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 445
              name: smb
              protocol: TCP
          envFrom:
            - secretRef:
                name: timemachine-smb-credentials
          env:
            - name: TZ
              value: "America/Santiago"
            - name: VOLUME_SIZE_LIMIT
              value: "3000G" # Limita el volumen virtual a 3TB
            - name: CUSTOM_SMB_CONF
              value: "false" # Usaremos la config por defecto que es excelente
          volumeMounts:
            - name: timemachine-storage
              mountPath: /data
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 45
            periodSeconds: 30
      volumes:
        - name: timemachine-storage
          persistentVolumeClaim:
            claimName: timemachine-smb-storage-pvc


