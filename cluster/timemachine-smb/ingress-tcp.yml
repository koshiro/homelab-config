apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: timemachine-smb-tcp
  namespace: timemachine-smb
spec:
  entryPoints:
    - "smb" # Asumimos que tienes un entrypoint en Traefik para el puerto 445
  routes:
    - match: HostSNI(`*`)
      services:
        - name: timemachine-smb-service
          port: 445
  # El TLS se maneja a nivel del entrypoint de Traefik o se puede dejar sin cifrar
  # para el tráfico local, ya que SMB tiene su propio cifrado.


