# Denegar todo el tráfico por defecto en el namespace 'timemachine-smb'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: timemachine-smb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Permitir la entrada (Ingress) al pod de Time Machine desde Traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-timemachine
  namespace: timemachine-smb
spec:
  podSelector:
    matchLabels:
      app: timemachine-smb
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Asumiendo que Traefik está en el namespace 'traefik'
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 445
---
# Permitir la salida (Egress) desde el pod de Time Machine a TrueNAS para NFS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-timemachine-to-truenas
  namespace: timemachine-smb
spec:
  podSelector:
    matchLabels:
      app: timemachine-smb
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # La IP de tu servidor TrueNAS
            cidr: 192.168.1.20/32
      ports:
        # Puertos para NFS
        - protocol: TCP
          port: 2049
        - protocol: TCP
          port: 111
        - protocol: UDP
          port: 111
    # Permitir DNS para resolución de nombres interna si es necesario
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53


