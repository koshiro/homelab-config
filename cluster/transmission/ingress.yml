apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission-ingress
  namespace: transmission
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: transmission-basicauth@kubernetescrd,transmission-redirect-root@kubernetescrd
    traefik.ingress.kubernetes.io/basicauth-removeheader: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: transmission.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transmission
            port:
              number: 80
