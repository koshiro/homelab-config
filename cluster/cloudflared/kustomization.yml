# /cluster/cloudflared/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - deployment.yml
generators:
  - ./secret-generator.yaml

# Configuración para que ArgoCD sustituya las variables
patches:
  - patch: |-
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: cluster-vars
    target:
      kind: Kustomization
      name: cloudflared
