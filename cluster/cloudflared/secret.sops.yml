# /cluster/cloudflared/secret.sops.yml
# Este archivo será encriptado con SOPS para proteger el token.
# Ansible se encargará de crear el archivo .sops.yaml con la clave de encriptación.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflared
stringData:
  # El token se obtiene del panel de Cloudflare Zero Trust
  # y se corresponde con la variable CLOUDFLARE_TUNNEL_TOKEN del .env
  credentials.json: |
    {
      "AccountTag": "REEMPLAZAR_CON_ACCOUNT_TAG",
      "TunnelID": "REEMPLAZAR_CON_TUNNEL_ID",
      "TunnelSecret": "REEMPLAZAR_CON_TUNNEL_SECRET"
    }
type: Opaque
