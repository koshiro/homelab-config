apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflared
spec:
  interval: 15m
  chart:
    spec:
      chart: cloudflare-tunnel
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: cloudflared
  valuesFrom:
    - kind: Secret
      name: cluster-secrets
      valuesKey: CLOUDFLARE_API_TOKEN
      targetPath: cloudflare.apiToken
  values:
    cloudflare:
      tunnelName: "homelab-tunnel"
      service:
        name: traefik
        namespace: kube-system
        port: 80
