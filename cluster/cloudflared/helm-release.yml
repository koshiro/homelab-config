# /cluster/cloudflared/helm-release.yml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflared
spec:
  interval: 15m
  chart:
    spec:
      chart: cloudflare-tunnel
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: cloudflared
  values:
    cloudflare:
      # Referencia al secreto que contiene el token
      secretName: cloudflare-tunnel-token
      # El túnel reenviará el tráfico al servicio de Traefik
      service:
        name: traefik
        namespace: traefik
        port: 80
