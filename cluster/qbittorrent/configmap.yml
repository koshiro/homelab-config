apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
data:
  qBittorrent.conf: |
    [AutoRun]
    enabled=false
    program=

    [BitTorrent]
    AnonymousModeEnabled=false
    BandwidthSchedulerEnabled=false
    DHTEnabled=true
    Encryption=1
    GlobalDLLimit=-1
    GlobalUPLimit=-1
    Interface=eth0
    InterfaceName=
    MaxConnecs=-1
    MaxConnecsPerTorrent=-1
    MaxUploads=-1
    MaxUploadsPerTorrent=-1
    OutgoingPortsMax=0
    OutgoingPortsMin=0
    PeXEnabled=true
    PreferEncryption=true
    RandomPort=false
    UPnP=false
    UTPSpeedLimitEnabled=false
    uTPRateLimit=0
    uTPTCPMixedMode=0

    [Core]
    AnonymousModeEnabled=false
    AutoDeleteAddedTorrentFile=Never
    AutoTMMDisabled=false
    BittorrentProtocol=Both
    BuiltinTrackerEnabled=true
    CacheSize=64
    CopyTorrentOnCompletion=false
    DisableAutoTMMByDefault=false
    DisableAutoTMMTriggers=DiskSpace
    DisableReannounceWhenAddressChanged=false
    DiskSpaceCheckingEnabled=true
    EnableCoalesceReadWrite=true
    EnableEmbeddedTracker=false
    EnableMultiConnectionsFromSameIP=true
    EnableOSCache=true
    EnablePieceExtentAffinity=true
    EnablePreallocation=false
    EnableQueueing=true
    EnableRecursiveDownload=false
    EnableResumeDataBackup=true
    FileLogAge=1
    FileLogBackupCount=1
    FileLogDeleteOld=true
    FileLogEnabled=false
    FileLogPath=/config/qbittorrent/logs
    FilePoolSize=5000
    FinishedTorrentExportDirectory=
    GlobalAppLimit=2000
    GlobalDLLimit=-1
    GlobalMaxSeedingMinutes=-1
    GlobalUPLimit=-1
    HalfOpenConnectionsLimit=150
    IPFilterEnabled=false
    IPSubnetWhitelistEnabled=false
    IPSubnetWhitelistPath=
    IPv6Enabled=true
    LimitTcpOverhead=false
    LimitUTPOverhead=false
    ListenPort=6881
    MaxConnecs=-1
    MaxConnecsPerTorrent=-1
    MaxRatioAction=0
    MaxRatioEnabled=false
    MaxSeedingTime=-1
    MaxSeedingTimeEnabled=false
    MaxUploads=-1
    MaxUploadsPerTorrent=-1
    ObjectNameLockEnabled=false
    OutgoingPortsMax=0
    OutgoingPortsMin=0
    PreferEncryption=true
    PrefetchEnabled=true
    ProxyConfigurationOnly=false
    QueueingSystemEnabled=true
    RandomPort=false
    ReannounceWhenAddressChanged=false
    RefreshInterval=1500
    ResolvePeerCountries=true
    ResolvePeerCountriesInUI=true
    SaveResumeDataInterval=1
    SendbufferLowmark=10
    SendbufferWatermark=50
    SendbufferWatermarkFactor=50
    SlowTorrentsInactivityTimer=600
    TorrentExportDirectory=
    TrackerEnabled=true
    TrackerPort=9000
    UPnP=false
    UploadChokingAlgorithm=RoundRobin
    UploadSlotsBehavior=FixedSlots
    UseAlternativeGlobalRateLimit=false
    UseGlobalInetSocket=false
    UseOSCache=true
    UseRandomPort=false
    UtpMixedMode=0
    WebUIAddress=*
    WebUIClickjackingProtection=true
    WebUICSRFProtection=true
    WebUIPort=8080
    WebUIUPnP=false
    WebUIUsername=admin

    [DHT]
    BT=0
    LPD=0
    PeX=0

    [Network]
    Cookies=@Variant(\0\0\0\b\0\0\0\0)
    GlobalDLLimit=0
    GlobalUPLimit=0
    Interface=eth0
    InterfaceName=
    OutgoingPortsMax=0
    OutgoingPortsMin=0
    RandomPort=false
    ServerDomains=@Variant(\0\0\0\b\0\0\0\0)
    ServerIPs=@Variant(\0\0\0\b\0\0\0\0)
    UPnP=false
    UseGlobalInetSocket=false
    UtpMixedMode=0

    [Preferences]
    Advanced\RecheckOnCompletion=false
    Advanced\RememberAddedTorrents=true
    Advanced\TrackerEnabled=true
    Advanced\trackerPort=9000
    Advanced\useRandomPort=false
    Advanced\RecheckOnCompletion=false
    Advanced\RememberAddedTorrents=true
    Advanced\TrackerEnabled=true
    Advanced\trackerPort=9000
    Advanced\useRandomPort=false
    Advanced\AnonymousModeEnabled=false
    Advanced\BandwidthSchedulerEnabled=false
    Advanced\BittorrentProtocol=Both
    Advanced\BuiltinTrackerEnabled=true
    Advanced\CacheSize=64
    Advanced\DisableAutoTMMByDefault=false
    Advanced\DisableAutoTMMTriggers=DiskSpace
    Advanced\DisableReannounceWhenAddressChanged=false
    Advanced\DiskSpaceCheckingEnabled=true
    Advanced\EnableCoalesceReadWrite=true
    Advanced\EnableEmbeddedTracker=false
    Advanced\EnableMultiConnectionsFromSameIP=true
    Advanced\EnableOSCache=true
    Advanced\EnablePieceExtentAffinity=true
    Advanced\EnablePreallocation=false
    Advanced\EnableQueueing=true
    Advanced\EnableRecursiveDownload=false
    Advanced\EnableResumeDataBackup=true
    Advanced\FileLogAge=1
    Advanced\FileLogBackupCount=1
    Advanced\FileLogDeleteOld=true
    Advanced\FileLogEnabled=false
    Advanced\FileLogPath=/config/qbittorrent/logs
    Advanced\FilePoolSize=5000
    Advanced\FinishedTorrentExportDirectory=
    Advanced\GlobalAppLimit=2000
    Advanced\GlobalDLLimit=-1
    Advanced\GlobalMaxSeedingMinutes=-1
    Advanced\GlobalUPLimit=-1
    Advanced\HalfOpenConnectionsLimit=150
    Advanced\IPFilterEnabled=false
    Advanced\IPSubnetWhitelistEnabled=false
    Advanced\IPSubnetWhitelistPath=
    Advanced\IPv6Enabled=true
    Advanced\LimitTcpOverhead=false
    Advanced\LimitUTPOverhead=false
    Advanced\ListenPort=6881
    Advanced\MaxConnecs=-1
    Advanced\MaxConnecsPerTorrent=-1
    Advanced\MaxRatioAction=0
    Advanced\MaxRatioEnabled=false
    Advanced\MaxSeedingTime=-1
    Advanced\MaxSeedingTimeEnabled=false
    Advanced\MaxUploads=-1
    Advanced\MaxUploadsPerTorrent=-1
    Advanced\ObjectNameLockEnabled=false
    Advanced\OutgoingPortsMax=0
    Advanced\OutgoingPortsMin=0
    Advanced\PreferEncryption=true
    Advanced\PrefetchEnabled=true
    Advanced\ProxyConfigurationOnly=false
    Advanced\QueueingSystemEnabled=true
    Advanced\RandomPort=false
    Advanced\ReannounceWhenAddressChanged=false
    Advanced\RefreshInterval=1500
    Advanced\ResolvePeerCountries=true
    Advanced\ResolvePeerCountriesInUI=true
    Advanced\SaveResumeDataInterval=1
    Advanced\SendbufferLowmark=10
    Advanced\SendbufferWatermark=50
    Advanced\SendbufferWatermarkFactor=50
    Advanced\SlowTorrentsInactivityTimer=600
    Advanced\TorrentExportDirectory=
    Advanced\TrackerEnabled=true
    Advanced\TrackerPort=9000
    Advanced\UPnP=false
    Advanced\UploadChokingAlgorithm=RoundRobin
    Advanced\UploadSlotsBehavior=FixedSlots
    Advanced\UseAlternativeGlobalRateLimit=false
    Advanced\UseGlobalInetSocket=false
    Advanced\UseOSCache=true
    Advanced\UseRandomPort=false
    Advanced\UtpMixedMode=0
    Advanced\WebUIAddress=*
    Advanced\WebUIClickjackingProtection=true
    Advanced\WebUICSRFProtection=true
    Advanced\WebUIPort=8080
    Advanced\WebUIUPnP=false
    Advanced\WebUIUsername=admin
