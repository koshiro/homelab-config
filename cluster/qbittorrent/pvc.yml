apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  # SOLUCIÓN TEMPORAL: Usar local-path mientras se resuelven permisos NFS
  # TODO: Volver a nfs-ssd cuando se resuelvan los permisos en TrueNAS
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
