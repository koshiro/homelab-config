apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

# NOTA: qbittorrent-downloads ahora usa hostPath directamente en el deployment
# Esto elimina la complejidad de PVCs y StorageClasses
