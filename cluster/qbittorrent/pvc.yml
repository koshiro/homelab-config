apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce  # local-path solo soporta RWO
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
  # Configurar nodeAffinity para asegurar que se cree en el nodo p2p
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: p2p
          operator: In
          values:
          - "true"
