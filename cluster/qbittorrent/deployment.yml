# qBittorrent Deployment - CONFIGURACIÓN FUNCIONANDO
# - Solo /data montado (igual que Sonarr/Radarr para hardlinks)
# - hostPort 6881 TCP/UDP para P2P
# - Nodo dedicado con etiqueta p2p=true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app: qbittorrent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Nodo P2P dedicado
      nodeSelector:
        p2p: "true"
      tolerations:
      - key: "p2p"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # VOLUMEN: Solo NFS compartido - /config será subdirectorio de /data
      volumes:
      - name: shared-storage
        nfs:
          server: 192.168.1.20
          path: /mnt/homelab-storage
      initContainers:
      - name: setup-qbittorrent-unified
        image: alpine:3.20
        command: 
        - sh
        - -c
        - |
          echo "Configurando qBittorrent igual que Sonarr/Radarr..."
          
          # Crear estructura en /data (igual que Sonarr/Radarr)
          mkdir -p /data/downloads/completed /data/downloads/incomplete
          
          # Permisos
          chown -R 1000:1000 /data/downloads
          
          echo "✅ qBittorrent configurado igual que Sonarr/Radarr:"
          echo "   • /data montado (NFS compartido)"
          echo "   • Downloads: /data/downloads/"
          echo "   • Config: qBittorrent lo creará automáticamente en /data"
          echo "   • Hardlinks: /data/downloads/ <-> /data/media/ ✅"
        volumeMounts:
        - name: shared-storage
          mountPath: /data
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        ports:
          - containerPort: 8080
            name: webui
          - containerPort: 6881
            name: bt-tcp
            protocol: TCP
            hostPort: 6881
          - containerPort: 6881
            name: bt-udp
            protocol: UDP
            hostPort: 6881
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: WEBUI_PORT
          value: "8080"
        volumeMounts:
        - name: shared-storage
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15