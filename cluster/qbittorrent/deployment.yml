apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app: qbittorrent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # ESTRATEGIA DOCUMENTADA: Nodo P2P dedicado
      # qBittorrent se ejecuta en k3s-node-2 (nodo p2p)
      nodeSelector:
        p2p: "true"
      # Tolerations para permitir fallback si es necesario
      tolerations:
      - key: "p2p"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # Anti-affinity para evitar que múltiples instancias P2P se ejecuten en el mismo nodo
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - qbittorrent
              topologyKey: kubernetes.io/hostname
      # SOLUCIÓN DOCUMENTADA: NFS SSD TrueNAS para datos y config
      volumes:
      - name: qbittorrent-data
        nfs:
          server: 192.168.1.20
          path: /mnt/homelab-ssd/downloads
      - name: qbittorrent-init-scripts
        configMap:
          name: qbittorrent-init
          defaultMode: 0755
      # InitContainer: fija rutas de descargas en qBittorrent.conf y prepara /downloads/config
      initContainers:
      - name: init-qbittorrent-config
        image: alpine:3.20
        command: ["sh", "/init/init-config.sh"]
        volumeMounts:
        - name: qbittorrent-data
          mountPath: /downloads
        - name: qbittorrent-init-scripts
          mountPath: /init
      # volúmenes unificados arriba
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        ports:
          - containerPort: 8080
            name: webui
          - containerPort: 6881
            name: bt-tcp
            protocol: TCP
            hostPort: 6881
          - containerPort: 6881
            name: bt-udp
            protocol: UDP
            hostPort: 6881
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: WEBUI_PORT
          value: "8080"
        - name: QB_BITTORRENT_PORT
          value: "6881"
        - name: QB_WEBUI_PORT
          value: "8080"
        # SOLUCIÓN DOCUMENTADA: Variables que reconoce linuxserver/qbittorrent
        - name: QB_USERNAME
          value: "admin"
        - name: QB_PASSWORD
          value: "adminadmin"
        - name: QB_DHT_ENABLED
          value: "true"
        - name: QB_PEX_ENABLED
          value: "true"
        - name: QB_LSD_ENABLED
          value: "true"
        - name: QB_ENCRYPTION
          value: "1"
        - name: QB_MAX_CONNECTIONS
          value: "500"
        - name: QB_MAX_CONNECTIONS_PER_TORRENT
          value: "100"
        volumeMounts:
        - name: qbittorrent-data
          mountPath: /downloads
        - name: qbittorrent-data
          mountPath: /config
          subPath: config

        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15

