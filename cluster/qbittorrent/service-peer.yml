apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  namespace: qbittorrent
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: qbittorrent
  # Forzar que se ejecute en el mismo nodo que qBittorrent
  nodeSelector:
    p2p: "true"
  ports:
    - name: bittorrent-tcp
      protocol: TCP
      port: 6881
      targetPort: 6881
      nodePort: 31681
    - name: bittorrent-udp
      protocol: UDP
      port: 6881
      targetPort: 6881
      nodePort: 31682
