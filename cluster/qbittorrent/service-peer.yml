apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  namespace: qbittorrent
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: qbittorrent
  ports:
    - name: bittorrent-tcp
      protocol: TCP
      port: 6881
      targetPort: 6881
    - name: bittorrent-udp
      protocol: UDP
      port: 6881
      targetPort: 6881
