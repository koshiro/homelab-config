# Kustomization para Flux en modo observación - SUSPENDIDA
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  # MODO OBSERVACIÓN: Suspendido para evitar cambios automáticos
  suspend: true
  
  interval: 10m0s
  path: ./cluster
  
  # SEGURIDAD: Prune deshabilitado inicialmente
  prune: false
  
  sourceRef:
    kind: GitRepository
    name: homelab-config
  
  # Validación del lado del cliente solamente
  validation: client
  
  # Configuración para sustituir variables
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: ConfigMap  
        name: cluster-settings
