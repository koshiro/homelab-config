# Kustomization para Flux en modo observación - SUSPENDIDA
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  # MODO OBSERVACIÓN: Activado pero sin forzar cambios
  suspend: false
  
  # No forzar aplicación de cambios
  force: false
  
  interval: 10m0s
  path: ./cluster
  
  # SEGURIDAD: Prune deshabilitado inicialmente
  prune: false
  
  sourceRef:
    kind: GitRepository
    name: homelab-config
  
  # Configuración para sustituir variables
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: ConfigMap  
        name: cluster-settings
