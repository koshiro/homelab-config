---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-https-auth
  url: https://gitea.danielriquelme.cl/daniel/homelab-config.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster
  prune: false
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
