apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: "25.0.0" # Usar una versión específica por estabilidad
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      kind: Deployment
      replicas: 2
    service:
      spec:
        type: LoadBalancer
        ports:
        - name: web
          port: 80
          targetPort: web
        - name: websecure
          port: 443
          targetPort: websecure
    # Configuración del dashboard
    api:
      dashboard: true
      insecure: false
    # Configuración de logs
    logs:
      general:
        level: INFO
      access:
        enabled: true
    # Configuración de entrypoints para Cloudflare Tunnel
    ports:
      web:
        port: 80
        expose: true
        exposedPort: 80
        protocol: TCP
      websecure:
        port: 443
        expose: true
        exposedPort: 443
        protocol: TCP
        tls:
          enabled: true
    # Configuración de certificados automáticos
    certificatesResolvers:
      letsencrypt:
        acme:
          email: daniel.pradov@gmail.com
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    # Configuración de seguridad para Cloudflare Tunnel
    providers:
      kubernetesIngress:
        allowCrossNamespace: true
        allowExternalNameServices: true
    # Configuración de middlewares de seguridad
    middlewares:
      security-headers:
        headers:
          frameDeny: true
          sslRedirect: true
          browserXssFilter: true
          contentTypeNosniff: true
          referrerPolicy: "strict-origin-when-cross-origin"
          contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
    # Configuración de rate limiting
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"
        http:
          tls:
            certResolver: letsencrypt
