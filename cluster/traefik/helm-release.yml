apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: "25.0.0" # Usar una versión específica por estabilidad
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      kind: Deployment
      replicas: 2
    service:
      spec:
        type: LoadBalancer
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      ssh:
        port: 2222
        expose: true
        exposedPort: 22
        protocol: TCP
