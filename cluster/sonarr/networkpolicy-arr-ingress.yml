---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-ingress
  namespace: sonarr
spec:
  podSelector:
    matchLabels:
      app: sonarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: radarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prowlarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: bazarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: overseerr
    ports:
    - protocol: TCP
      port: 8989
