---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonarr-egress
  namespace: sonarr
spec:
  podSelector:
    matchLabels:
      app: sonarr
  policyTypes:
  - Egress
  egress:
  # DNS (temporalmente permitir a cualquier destino)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permitir conexión a qBittorrent
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: qbittorrent
    ports:
    - protocol: TCP
      port: 8080
  # Permitir conexión a Prowlarr (9696)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prowlarr
    ports:
    - protocol: TCP
      port: 9696
  # Permitir conexiones HTTP/HTTPS externas (para indexers, updates, etc.)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
