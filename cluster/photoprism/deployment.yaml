apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: photoprism
  labels:
    app: photoprism
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      containers:
        - name: photoprism
          image: photoprism/photoprism:latest
          ports:
            - containerPort: 2342
              name: http
          env:
            - name: PHOTOPRISM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secret
                  key: PHOTOPRISM_ADMIN_PASSWORD
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secret
                  key: PHOTOPRISM_DATABASE_PASSWORD
            - name: PHOTOPRISM_ADMIN_USER
              value: "admin"
            - name: PHOTOPRISM_AUTH_MODE
              value: "password"
            - name: PHOTOPRISM_SITE_URL
              value: "https://photoprism.danielriquelme.cl/"
            - name: PHOTOPRISM_ORIGINALS_PATH
              value: "/photoprism/originals"
            - name: PHOTOPRISM_IMPORT_PATH
              value: "/photoprism/import"
            - name: PHOTOPRISM_STORAGE_PATH
              value: "/photoprism/storage"
            - name: PHOTOPRISM_DATABASE_DRIVER
              value: "mysql"
            - name: PHOTOPRISM_DATABASE_SERVER
              value: "photoprism-mariadb:3306"
            - name: PHOTOPRISM_DATABASE_NAME
              value: "photoprism"
            - name: PHOTOPRISM_DATABASE_USER
              value: "photoprism"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
            - name: PHOTOPRISM_DISABLE_WEBDAV
              value: "false"
            - name: PHOTOPRISM_DISABLE_SETTINGS
              value: "false"
            - name: PHOTOPRISM_DISABLE_BACKUPS
              value: "false"
            - name: PHOTOPRISM_DISABLE_TENSORFLOW
              value: "false"
            - name: PHOTOPRISM_DETECT_NSFW
              value: "false"
            - name: PHOTOPRISM_UPLOAD_NSFW
              value: "true"
            - name: PHOTOPRISM_DEFAULT_LOCALE
              value: "es"
            - name: PHOTOPRISM_DEFAULT_THEME
              value: "default"
            - name: PHOTOPRISM_READONLY
              value: "false"
            - name: PHOTOPRISM_EXPERIMENTAL
              value: "false"
            - name: PHOTOPRISM_DEBUG
              value: "false"
            - name: PHOTOPRISM_PUBLIC
              value: "false"
          volumeMounts:
            - name: originals
              mountPath: /photoprism/originals
            - name: storage
              mountPath: /photoprism/storage
            - name: import
              mountPath: /photoprism/import
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: originals
          persistentVolumeClaim:
            claimName: photoprism-originals-pvc
        - name: storage
          persistentVolumeClaim:
            claimName: photoprism-storage-pvc
        - name: import
          persistentVolumeClaim:
            claimName: photoprism-import-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism-mariadb
  namespace: photoprism
  labels:
    app: photoprism-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photoprism-mariadb
  template:
    metadata:
      labels:
        app: photoprism-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.8
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secret
                  key: PHOTOPRISM_DATABASE_PASSWORD
            - name: MYSQL_DATABASE
              value: "photoprism"
            - name: MYSQL_USER
              value: "photoprism"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-secret
                  key: PHOTOPRISM_DATABASE_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: photoprism-db-pvc
