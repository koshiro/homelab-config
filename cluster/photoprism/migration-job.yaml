apiVersion: batch/v1
kind: Job
metadata:
  name: photoprism-migration
  namespace: photoprism
spec:
  template:
    spec:
      containers:
      - name: rsync
        image: instrumentisto/rsync-ssh:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Configurar SSH
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          
          # Generar un par de claves SSH temporal
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          echo "Clave pública generada:"
          cat ~/.ssh/id_rsa.pub
          
          echo "Esperando a que el usuario agregue la clave pública a 192.168.1.15..."
          echo "Por favor, ejecuta en tu máquina local: ssh daniel@192.168.1.15 \"mkdir -p ~/.ssh && echo 'CLAVE_PUBLICA' >> ~/.ssh/authorized_keys\""
          echo "Reemplaza CLAVE_PUBLICA con la clave pública mostrada arriba."
          
          # Esperar a que la clave sea agregada
          sleep 30
          
          # Verificar conectividad SSH
          echo "Verificando conectividad SSH a 192.168.1.15..."
          ssh -o BatchMode=yes -o ConnectTimeout=5 daniel@192.168.1.15 exit
          if [ $? -ne 0 ]; then
            echo "Error: No se pudo establecer conexión SSH con 192.168.1.15. Revisa la clave SSH y la conectividad de red."
            exit 1
          fi
          
          # Migrar las imágenes de Immich a PhotoPrism
          echo "Migrando imágenes de Immich a PhotoPrism..."
          rsync -avz --progress daniel@192.168.1.15:/DATA/Gallery/immich/library/ /photoprism/originals/
          
          echo "Migración de imágenes completada."
        volumeMounts:
        - name: originals
          mountPath: /photoprism/originals
      volumes:
      - name: originals
        persistentVolumeClaim:
          claimName: photoprism-originals-pvc
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-ssh
  namespace: photoprism
spec:
  podSelector:
    matchLabels:
      job-name: photoprism-migration
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.15/32
      ports:
        - protocol: TCP
          port: 22
