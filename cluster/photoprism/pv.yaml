apiVersion: v1
kind: PersistentVolume
metadata:
  name: photoprism-originals-pv
  labels:
    type: nfs
    app: photoprism
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions:
    - hard
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: photoprism-originals-pv
    volumeAttributes:
      server: 192.168.1.10
      share: /mnt/tank/photoprism/originals

