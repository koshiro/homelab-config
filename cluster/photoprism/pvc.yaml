apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-originals-pvc
  namespace: photoprism
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs-csi
  volumeName: photoprism-originals-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage-pvc
  namespace: photoprism
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs-csi
  volumeName: photoprism-storage-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-import-pvc
  namespace: photoprism
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs-csi
  volumeName: photoprism-import-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-db-pvc
  namespace: photoprism
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
