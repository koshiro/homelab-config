# IMPORTANTE: Rellena los datos y encripta este archivo con sops antes de confirmar.
# Comando: sops --encrypt --in-place cluster/monitoring/secret-proxmox.sops.yml
# Debes crear un usuario dedicado (ej: 'monitoring@pve') y un token de API en Proxmox con el rol 'PVE.Auditor'.
apiVersion: v1
kind: Secret
metadata:
  name: proxmox-credentials
  namespace: monitoring
stringData:
  PVE_USER: "monitoring@pve" # El usuario que creaste en Proxmox
  PVE_TOKEN_ID: "monitoring-token" # El nombre del token de API
  PVE_TOKEN_SECRET: "154b0123-5130-4b32-9f9b-860ecd7e2947" # El valor secreto del token de API
