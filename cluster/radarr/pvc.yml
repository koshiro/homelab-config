apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-downloads-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-ssd
  nfs:
    server: 192.168.1.20
    path: /mnt/homelab-ssd/downloads

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-shared-pvc
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-ssd
  volumeName: radarr-downloads-pv
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-media-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.20
    path: /mnt/homelab-storage/media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-media-pvc
  namespace: radarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  volumeName: radarr-media-pv
  resources:
    requests:
      storage: 1Ti
