apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "61.1.0" # Una versión estable y reciente del chart
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 15m
  values:
    # Deshabilitamos componentes que no necesitamos para una configuración inicial simple
    alertmanager:
      enabled: false

    # Configuración de Grafana
    grafana:
      # Usamos el secreto existente para la contraseña del administrador
      admin:
        existingSecret: "grafana-admin-credentials"
        userKey: "admin-user"
        passwordKey: "admin-password"
      
      # Usamos persistencia para los dashboards y la configuración
      persistence:
        enabled: true
        type: pvc
        storageClassName: "local-path"
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      
      # Deshabilitamos el ingress por defecto, usaremos nuestra propia IngressRoute de Traefik
      ingress:
        enabled: false
      
      # Precargamos la fuente de datos de Prometheus
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
              access: proxy
              isDefault: true

    # Configuración de Prometheus
    prometheus:
      prometheusSpec:
        # Usamos persistencia para los datos de las métricas
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "local-path"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Permitimos que Prometheus descubra ServiceMonitors en cualquier namespace para mayor flexibilidad
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

    # k3s: habilitar scraping de controller-manager y scheduler vía endpoints directos
    kubeProxy:
      enabled: false

    kubeControllerManager:
      enabled: true
      endpoints:
        - 192.168.1.131
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        scheme: https
        insecureSkipVerify: true
        serverName: k3s-node-1

    kubeScheduler:
      enabled: true
      endpoints:
        - 192.168.1.131
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        scheme: https
        insecureSkipVerify: true
        serverName: k3s-node-1
