# truenas-node-exporter.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-node-exporter
  namespace: monitoring
  labels:
    app: truenas-node-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenas-node-exporter
  template:
    metadata:
      labels:
        app: truenas-node-exporter
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.6.1
          ports:
            - name: http
              containerPort: 9100
          args:
            - --web.listen-address=:9100
            - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
            - --collector.filesystem.ignored-fs-types=^(sys|proc|auto)fs$$
            - --collector.processes
            - --collector.systemd
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /rootfs
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-node-exporter
  namespace: monitoring
  labels:
    app: truenas-node-exporter
spec:
  ports:
    - name: http
      port: 9100
      targetPort: http
      protocol: TCP
  selector:
    app: truenas-node-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-node-exporter-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: truenas-node-exporter
  endpoints:
    - port: http
      interval: 30s
      scrapeTimeout: 10s
