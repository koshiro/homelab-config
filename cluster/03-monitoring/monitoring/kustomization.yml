# cluster/03-monitoring/monitoring/kustomization.yml
# VictoriaMetrics + Grafana + exporters. Lo aplica Flux (Kustomization monitoring) al mergear.
# Secretos (secret-grafana, secret-proxmox, secret-alertmanager-telegram .sops.yaml): entran por solo-flux/ y
# los descifra Flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - victoria-metrics.yml
  - node-exporter.yml
  - kube-state-metrics.yml
  - pve-exporter.yml
  - speedtest-exporter.yml
  - alerting.yml
  - grafana.yml
  - ingress.yml

configMapGenerator:
  - name: victoria-metrics-scrape
    namespace: monitoring
    files:
      - scrape.yml
  - name: kube-state-metrics-flux
    namespace: monitoring
    files:
      - kube-state-metrics-flux.yml
  - name: vmalert-rules
    namespace: monitoring
    files:
      - alert-rules.yml
  - name: alertmanager-config
    namespace: monitoring
    files:
      - alertmanager.yml
  - name: grafana-provisioning
    namespace: monitoring
    files:
      - grafana-provisioning/datasources.yml
      - grafana-provisioning/dashboards.yml
  # un ConfigMap por dashboard (límite de 256 KiB de la anotación de kubectl apply)
  - name: grafana-dashboard-resumen
    namespace: monitoring
    files: [dashboards/cluster/resumen.json]
  - name: grafana-dashboard-node-exporter-full
    namespace: monitoring
    files: [dashboards/cluster/node-exporter-full.json]
  - name: grafana-dashboard-k8s-global
    namespace: monitoring
    files: [dashboards/cluster/k8s-global.json]
  - name: grafana-dashboard-k8s-namespaces
    namespace: monitoring
    files: [dashboards/cluster/k8s-namespaces.json]
  - name: grafana-dashboard-k8s-nodes
    namespace: monitoring
    files: [dashboards/cluster/k8s-nodes.json]
  - name: grafana-dashboard-k8s-pods
    namespace: monitoring
    files: [dashboards/cluster/k8s-pods.json]
  - name: grafana-dashboard-proxmox
    namespace: monitoring
    files: [dashboards/infra/proxmox.json]
  - name: grafana-dashboard-speedtest
    namespace: monitoring
    files: [dashboards/infra/speedtest.json]
  - name: grafana-dashboard-victoriametrics
    namespace: monitoring
    files: [dashboards/infra/victoriametrics.json]
components:
  - ../../components/proteger-datos
