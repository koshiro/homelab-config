# Métricas del host Proxmox (192.168.1.100) vía API, con el token monitoring@pve (rol PVEAuditor).
# Credenciales: secret-proxmox.sops.yaml (lo aplica Flux por solo-flux/). El exporter lee
# PVE_USER/PVE_TOKEN_NAME/PVE_TOKEN_VALUE del entorno; no expande variables dentro de pve.yml.
# VictoriaMetrics lo consulta en /pve?target=192.168.1.100 (scrape.yml, job pve).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:3.10.1
          ports:
            - name: http
              containerPort: 9221
          env:
            - name: PVE_USER
              valueFrom:
                secretKeyRef:
                  name: proxmox-credentials
                  key: PVE_USER
            - name: PVE_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: proxmox-credentials
                  key: PVE_TOKEN_ID
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: proxmox-credentials
                  key: PVE_TOKEN_SECRET
            - name: PVE_VERIFY_SSL
              value: "false"
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  selector:
    app: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: http
