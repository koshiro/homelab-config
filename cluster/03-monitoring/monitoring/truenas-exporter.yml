# truenas-exporter.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-exporter
  namespace: monitoring
  labels:
    app: truenas-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenas-exporter
  template:
    metadata:
      labels:
        app: truenas-exporter
    spec:
      containers:
        - name: truenas-exporter
          image: ghcr.io/ixsystems/truenas_exporter:latest
          ports:
            - name: http
              containerPort: 9121
          env:
            - name: TRUENAS_HOST
              value: "192.168.1.20"
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenas-api-credentials
                  key: apiKey
            - name: TRUENAS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: truenas-api-credentials
                  key: username
            - name: TRUENAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: truenas-api-credentials
                  key: password
          args:
            - --web.listen-address=:9121
            - --truenas.host=${TRUENAS_HOST}
            - --truenas.api-key=${TRUENAS_API_KEY}
            - --truenas.username=${TRUENAS_USERNAME}
            - --truenas.password=${TRUENAS_PASSWORD}
            - --truenas.insecure-skip-verify=true
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-exporter
  namespace: monitoring
  labels:
    app: truenas-exporter
spec:
  selector:
    app: truenas-exporter
  ports:
    - name: http
      port: 9121
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-exporter-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: truenas-exporter
  endpoints:
    - port: http
      interval: 30s
      scrapeTimeout: 10s
