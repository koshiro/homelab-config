apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-repo-server-cm
  namespace: argocd
data:
  # Configuración para plugins de configuración
  configManagementPlugins: |
    - name: sops
      init:
        command: [sh, -c]
        args: ["echo 'SOPS plugin initialized'"]
      generate:
        command: [sh, -c]
        args: ["sops -d $MANIFEST_DIR/*.yaml | kubectl apply -f - || echo 'No SOPS files found'"]
  
  # Habilitar plugins
  plugins.enabled: "true"
