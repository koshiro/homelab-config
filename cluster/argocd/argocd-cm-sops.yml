apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Configuración para SOPS
  configManagementPlugins: |
    - name: sops
      init:
        command: [sh, -c]
        args: ["echo 'SOPS plugin initialized'"]
      generate:
        command: [sh, -c]
        args: ["sops -d $MANIFEST_DIR/*.yaml | kubectl apply -f - || echo 'No SOPS files found'"]
  
  # Habilitar plugins de configuración
  configManagementPlugins.enabled: "true"
  
  # Configuración específica para SOPS
  sops.enabled: "true"
  sops.ageKeySecret: "sops-age"
  sops.ageKeySecretNamespace: "argocd"
