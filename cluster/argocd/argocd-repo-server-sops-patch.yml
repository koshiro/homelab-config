apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        # Volumen para compartir los binarios del initContainer al contenedor principal
        - name: custom-tools
          emptyDir: {}
        # Volumen para montar la clave age desde el Secret de Kubernetes
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        # initContainer para copiar KSOPS, Kustomize y clave age
        - name: install-ksops
          image: viaductoss/ksops:v4.2.5
          command:
            - /bin/sh
            - '-c'
          args:
            - |
              echo "Copying KSOPS and Kustomize..."
              cp /usr/local/bin/ksops /custom-tools/
              cp /usr/local/bin/kustomize /custom-tools/
              chmod +x /custom-tools/ksops /custom-tools/kustomize
              echo "Creating SOPS age directory..."
              mkdir -p /custom-tools/.config/sops/age
              echo "Copying age key..."
              # Buscar y copiar la clave real desde el secret montado
              find /sops-age-mount -name "keys.txt" -type f -exec cp {} /custom-tools/.config/sops/age/keys.txt \;
              chmod 600 /custom-tools/.config/sops/age/keys.txt
              echo "Done. Age key copied to /custom-tools/.config/sops/age/keys.txt"
              ls -la /custom-tools/.config/sops/age/
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: sops-age
              mountPath: /sops-age-mount
              readOnly: true
        # initContainer para descargar SOPS
        - name: install-sops
          image: alpine:3.18
          command:
            - /bin/sh
            - '-c'
          args:
            - |
              echo "Installing curl..."
              apk add --no-cache curl
              echo "Downloading SOPS binary..."
              curl -L -o /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
              chmod +x /custom-tools/sops
              echo "SOPS installed successfully."
              ls -la /custom-tools/
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      containers:
        - name: argocd-repo-server
          env:
            # Variable para que kustomize busque plugins en el directorio correcto
            - name: XDG_CONFIG_HOME
              value: /.config
            # Variable para que SOPS sepa dónde encontrar el archivo de clave
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
            # Variable para habilitar plugins de Kustomize
            - name: KUSTOMIZE_PLUGIN_HOME
              value: /.config/kustomize/plugin
          volumeMounts:
            # Montaje de Kustomize personalizado
            - name: custom-tools
              mountPath: /usr/local/bin/kustomize
              subPath: kustomize
            # Montaje del binario de SOPS
            - name: custom-tools
              mountPath: /usr/local/bin/sops
              subPath: sops
            # Montaje del binario de KSOPS en la ruta de plugins de Kustomize
            - name: custom-tools
              mountPath: /.config/kustomize/plugin/viaduct.ai/v1/ksops/ksops
              subPath: ksops
            # Montaje del directorio completo de configuración SOPS
            - name: custom-tools
              mountPath: /.config/sops
              subPath: .config/sops
              readOnly: true
