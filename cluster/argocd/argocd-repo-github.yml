apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: http://argocd.danielriquelme.cl
  admin.enabled: "true"
  users.anonymous.enabled: "false"
  # Configuración para GitHub - repositorio privado
  # Las credenciales SSH se configuran en el secret argocd-repo-credentials
  repositories: |
    - url: git@github.com:koshiro/homelab-config.git
      type: git
      name: homelab-config
