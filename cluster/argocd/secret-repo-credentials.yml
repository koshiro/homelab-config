apiVersion: v1
kind: Secret
metadata:
  name: argocd-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: github.com
  sshPrivateKey: |
    # Aquí debes colocar tu clave SSH privada para GitHub
    # Puedes generarla con: ssh-keygen -t ed25519 -C "tu-email@ejemplo.com"
    # Y luego agregarla a tu cuenta de GitHub en Settings > SSH and GPG keys
