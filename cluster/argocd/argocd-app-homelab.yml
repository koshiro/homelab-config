apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:koshiro/homelab-config.git
    targetRevision: HEAD
    path: cluster
    kustomize:
      decryption:
        provider: sops
        secretRef:
          name: sops-age
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 10
