  wait: true
  prune: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  path: ./cluster/01-networking/traefik
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  path: ./cluster/03-monitoring/monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
  components:
    - solo-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  path: ./cluster/06-external/cloudflared
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  components:
    - solo-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Avisos de Flux (Provider/Alert de Telegram y GitHub). Aparte de la raíz flux-system porque lleva tokens SOPS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-avisos
  namespace: flux-system
spec:
  path: ./cluster/flux/avisos
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  components:
    - solo-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Prueba 4 de la fase 6 (docs/PLAN-FLUX.md): prune en una Kustomization desechable. Temporal.
# wait: false porque el PVC de prueba queda Pending (local-path espera un pod que lo use).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-prueba-prune
  namespace: flux-system
spec:
  path: ./cluster/flux/prueba-prune
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: false
  prune: true
---
# Escribe CronJobs en el namespace de cada app: sin dependsOn para que una app caída no frene los respaldos;
# si falta un namespace (cluster nuevo), falla y reintenta cada retryInterval hasta que exista.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  path: ./cluster/00-infrastructure/backups
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
