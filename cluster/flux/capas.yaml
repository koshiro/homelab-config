# Capas: CRD, operadores, Postgres compartido y plataforma.
# Una Kustomization de Flux por carpeta hoja de cluster/ (si una falla, no bloquea a las demás). Convenciones del
# plan (docs/PLAN-FLUX.md § Decisiones):
# - Sin `suspend` en git (adopción cerrada el 2026-10-16). Para probar en caliente: `flux suspend ks <ks>` y
#   `flux resume ks <ks>` al terminar; no se versiona.
# - wait: true y timeout 5m (10m en comfyui): verde = el rollout terminó.
# - prune: false hasta la fase 7; deletionPolicy: Orphan donde hay datos (PV/PVC, CRD, Cluster de Postgres).
# - components: [solo-flux] suma los *.sops.* (y el HelmRelease de cnpg) que kubectl apply -k no debe ver;
#   decryption con sops-age solo donde hay secretos.
---
# CRD y operadores. Orden: cert-manager y cnpg → plugin Barman Cloud → Cluster de Postgres → Immich.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  path: ./cluster/00-infrastructure/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  path: ./cluster/00-infrastructure/cnpg
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
  components:
    - solo-flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-plugin-barman-cloud
  namespace: flux-system
spec:
  path: ./cluster/00-infrastructure/cnpg-plugin-barman-cloud
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
  dependsOn:
    - name: cert-manager
    - name: cnpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
  namespace: flux-system
spec:
  path: ./cluster/apps/postgresql
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
  dependsOn:
    - name: cnpg
    - name: cnpg-plugin-barman-cloud
  components:
    - solo-flux
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Plataforma: GPU, red, monitoreo, túneles y respaldos.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
