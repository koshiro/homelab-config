# Apps: una Kustomization por app.
# Una Kustomization de Flux por carpeta hoja de cluster/ (si una falla, no bloquea a las demás). Convenciones del
# plan (docs/PLAN-FLUX.md § Decisiones):
# - suspend: true hasta que su lote se adopte en la fase 4; esta lista es la que manda.
# - wait: true y timeout 5m (10m en comfyui): verde = el rollout terminó.
# - prune: false durante la adopción; deletionPolicy: Orphan donde hay datos (PV/PVC, CRD, Cluster de Postgres).
# - components: [solo-flux] suma los *.sops.* (y el HelmRelease de cnpg) que kubectl apply -k no debe ver;
#   decryption con sops-age solo donde hay secretos.
---
# Suite multimedia.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
  namespace: flux-system
spec:
  suspend: true
  path: ./cluster/04-media-stack/bazarr
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: false
  deletionPolicy: Orphan
---
