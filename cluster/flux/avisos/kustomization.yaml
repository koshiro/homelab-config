# Avisos de Flux (fase 5 de docs/PLAN-FLUX.md). Lo aplica la Kustomization flux-avisos (capas.yaml), no la raíz
# flux-system: necesita decryption para los tokens, que entran por solo-flux/.
# - telegram.yaml: errores de cualquier objeto de Flux al mismo chat que Alertmanager.
# - github.yaml: estado de cada Kustomization en el commit de main que aplicó (checks del commit en GitHub).
# El Ready=False sostenido lo vigila además vmalert (FluxSinReconciliar en 03-monitoring/monitoring/alert-rules.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - telegram.yaml
  - github.yaml
