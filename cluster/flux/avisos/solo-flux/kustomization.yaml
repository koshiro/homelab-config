# Lo que solo aplica Flux: la Kustomization flux-avisos (cluster/flux/capas.yaml) lo suma con
# `spec.components: [solo-flux]` y kustomize-controller descifra los *.sops.* con el secret sops-age.
# No va en ../kustomization: `kubectl apply -k` aplicaría el texto cifrado.
# Las rutas ../ funcionan porque Flux construye sin restricción de carga dentro del repo; `kubectl kustomize` no
# las acepta, por eso los scripts de validación saltan los Component (docs/PLAN-FLUX.md, fase 2).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../secret-flux-telegram.sops.yaml
  - ../secret-flux-github.sops.yaml
