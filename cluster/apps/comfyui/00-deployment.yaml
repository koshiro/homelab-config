# ComfyUI en la RTX 3070 (k3s-node-1). Todo el estado vive en el volumen NFS (homelab-storage/comfyui):
# código (git, última release v*), venv de Python 3.12 + intérprete uv (/app/venv, /app/.python),
# extensiones, modelos, workflows y salidas. El entorno lo construye/actualiza 06-job-build-env.yaml;
# este deployment solo arranca. Modelos: 07-job-download-models.yaml (inventario en models/MODELOS-COMFYUI.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
  labels:
    app: comfyui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media-worker
                    operator: In
                    values: ["true"]
      initContainers:
        - name: check-env
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              test -x /app/venv/bin/python && test -f /app/main.py && exit 0
              echo "Falta el entorno: ejecutar cluster/apps/comfyui/06-job-build-env.yaml"; exit 1
          volumeMounts:
            - name: workspace
              mountPath: /app
      containers:
        - name: comfyui
          # Misma imagen que el Job de build: trae gcc/nvcc para Triton y extensiones que compilan al vuelo
          image: nvidia/cuda:12.8.1-devel-ubuntu24.04
          env:
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["/bin/bash", "-c"]
          args:
            # git: lo necesita ComfyUI-Manager para instalar/actualizar extensiones
            # --use-sage-attention: SageAttention 2 (int8 QK, fp16 PV) ~2x en atención en Ampere
            # --fast fp16_accumulation: acumulación fp16 en matmul (más rápido en Ampere, diferencia visual mínima)
            # --enable-triton-backend: kernels INT8 de comfy-kitchen vía Triton. Con PyTorch cu128 ComfyUI apaga el
            #   backend CUDA (exige cu130 = driver >= 580) y sin esto INT8 ConvRot corre en modo eager (lento)
            # Sin --lowvram: ComfyUI decide la descarga a RAM según la VRAM libre (la GPU se comparte con Ollama)
            - |
              command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null; }
              git config --global --add safe.directory '*'
              exec /app/venv/bin/python -u /app/main.py --listen 0.0.0.0 --port 8188 --base-directory /app \
                --use-sage-attention --fast fp16_accumulation --enable-triton-backend
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          ports:
            - containerPort: 8188
              name: http
          volumeMounts:
            - name: workspace
              mountPath: /app
          startupProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: comfyui-workspace-pvc
