apiVersion: v1
kind: Secret
metadata:
  name: comfyui-basic-auth
  namespace: comfyui
type: Opaque
data:
  # htpasswd -nb comfyui <password> | base64 -w0
  # Cambiar password antes de desplegar en producción
  # user: comfyui | PASSWORD: ver README para guardarla de forma segura
  users: Y29tZnl1aTokYXByMSQzTzJzdHVzdiRCbk95MEUud3FDL1JMaUl1YkJqUmou
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: comfyui-basic-auth
  namespace: comfyui
spec:
  basicAuth:
    secret: comfyui-basic-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui-ingress
  namespace: comfyui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: comfyui-comfyui-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: comfyui.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: comfyui
            port:
              number: 8188
