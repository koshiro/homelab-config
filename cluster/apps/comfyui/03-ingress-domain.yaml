# Acceso protegido por Cloudflare Access (app "Homelab admin", política BlockAllbyMe):
# login con código por correo antes de llegar a Traefik. Reemplaza el basic auth anterior.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui-ingress
  namespace: comfyui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: comfyui.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: comfyui
            port:
              number: 8188
