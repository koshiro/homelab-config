# SwarmUI: interfaz de generación cómoda (prompt, parámetros, galería, lotes) sobre el ComfyUI existente.
# No usa GPU ni carga modelos: le manda los trabajos a ComfyUI (backend "ComfyUI API By URL" →
# http://comfyui.comfyui.svc:8188), así que rinde igual que ComfyUI con SageAttention y fp16_accumulation.
# Todo vive en el volumen NFS de ComfyUI:
#   swarmui/        código (git), src/bin/ compilado y Data/ (ajustes, backends, usuarios)
#   models/         los mismos modelos de ComfyUI (misma ruta relativa = mismos nombres). En Server → Server
#                   Configuration → Paths: SDModelFolder "checkpoints;diffusion_models", SDLoraFolder "loras",
#                   SDVAEFolder "vae", SDClipFolder "text_encoders;clip" (nombres de carpeta de ComfyUI)
#   output/swarmui/ salidas, para que SmartGallery también las indexe
# Nodos extra: SwarmComfyCommon y SwarmComfyExtra (vienen en el repo de SwarmUI) los copia el initContainer a
# custom_nodes/ de ComfyUI; 06-job-build-env.yaml los conserva (LOCAL_NODES). ComfyUI los carga al reiniciar.
# Configuración inicial (ya hecha; vive en swarmui/Data/, reconstruir solo si se pierde el volumen):
#   - Data/Backends.fds: backend 0, type comfyui_api, Address http://comfyui.comfyui.svc:8188
#   - Data/Settings.fds: IsInstalled true, LaunchMode none y las carpetas de modelos de arriba
#   - models/text_encoders/qwen_3_4b.safetensors → cyberrealisticZImage_v90_txt.safetensors (enlace simbólico):
#     SwarmUI usa ese nombre para Z-Image y, si no existe, intenta bajarlo de Hugging Face (5,6 GB; con 3 GB de
#     límite la descarga muere por falta de memoria y deja la generación colgada)
# Rendimiento medido: 1024×1024, 8 pasos, modelo ya cargado ≈ 21 s; en frío (modelo desde NFS) ≈ 2,5 min.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmui
  namespace: comfyui
  labels:
    app: swarmui
spec:
  replicas: 1
  strategy:
    type: Recreate # Data/ en NFS: un solo escritor
  selector:
    matchLabels:
      app: swarmui
  template:
    metadata:
      labels:
        app: swarmui
    spec:
      # Mismo nodo que ComfyUI y SmartGallery (k3s-node-2/3 no tienen x86-64-v2)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media-worker
                    operator: In
                    values: ["true"]
      initContainers:
        # Clona SwarmUI la primera vez (init + fetch: Models/ y Output/ ya existen como puntos de montaje) y copia
        # sus nodos a ComfyUI en cada arranque, por si se actualizó
        - name: setup
          image: mcr.microsoft.com/dotnet/sdk:11.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              git config --global --add safe.directory '*'
              cd /swarm
              if [ ! -d .git ]; then
                git init -q -b master && git remote add origin https://github.com/mcmonkeyprojects/SwarmUI.git
                git fetch -q origin master && git checkout -q -f -t origin/master
              fi
              echo "SwarmUI $(git log -1 --format='%h %cs')"
              for n in SwarmComfyCommon SwarmComfyExtra; do
                rm -rf "/comfy-nodes/$n.tmp" && cp -r "src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/$n" "/comfy-nodes/$n.tmp"
                rm -rf "/comfy-nodes/$n" && mv "/comfy-nodes/$n.tmp" "/comfy-nodes/$n"
              done
          volumeMounts:
            - name: workspace
              mountPath: /swarm
              subPath: swarmui
            - name: workspace
              mountPath: /comfy-nodes
              subPath: custom_nodes
      containers:
        - name: swarmui
          # SDK y no runtime: launch-linux.sh compila cuando cambia el commit (primer arranque, Server → Update) y
          # relanza solo al salir con código 42 (reinicio pedido desde la UI). El proyecto es net8.0 con
          # RollForward Major y el lanzador ya pide .NET 10. La imagen trae git, que usa Server → Update.
          image: mcr.microsoft.com/dotnet/sdk:11.0
          workingDir: /swarm
          command: ["/bin/bash", "-c"]
          args:
            - |
              git config --global --add safe.directory '*'
              exec ./launch-linux.sh --launch_mode none --host 0.0.0.0 --port 7801
          env:
            - name: TZ
              value: America/Santiago
          ports:
            - containerPort: 7801
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 3Gi # compilar ronda 1,5 GB; en marcha usa unos cientos de MB
          volumeMounts:
            - name: workspace
              mountPath: /swarm
              subPath: swarmui
            # Lectura/escritura: SwarmUI guarda junto a los modelos su caché de metadatos y miniaturas
            - name: workspace
              mountPath: /swarm/Models
              subPath: models
            - name: workspace
              mountPath: /swarm/Output
              subPath: output/swarmui
          startupProbe: # el primer arranque compila (varios minutos sobre NFS)
            tcpSocket:
              port: 7801
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            tcpSocket:
              port: 7801
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: comfyui-workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: swarmui
  namespace: comfyui
  labels:
    app: swarmui
spec:
  type: ClusterIP
  ports:
    - port: 7801
      targetPort: 7801
      protocol: TCP
      name: http
  selector:
    app: swarmui
---
# Protegido por Cloudflare Access (app "Homelab admin", política BlockAllbyMe): SwarmUI no tiene login, así que
# el hostname tiene que seguir en esa app mientras exista esta regla (el túnel enruta *.danielriquelme.cl).
# swarmui.lan: acceso LAN directo a Traefik vía /etc/hosts (192.168.1.131), sin login como el NodePort.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarmui
  namespace: comfyui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: swarmui.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarmui
                port:
                  number: 7801
    - host: swarmui.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarmui
                port:
                  number: 7801
---
# Acceso directo por LAN/tailnet, sin pasar por Cloudflare (como comfyui-nodeport):
#   LAN:       http://192.168.1.131:30190  (k3s-node-1, donde corre el pod)
#   Tailscale: http://k3s-node-1-k3s:30190
# Sin login: solo alcanzable desde la red de la casa y el tailnet (el router no expone NodePorts).
apiVersion: v1
kind: Service
metadata:
  name: swarmui-nodeport
  namespace: comfyui
  labels:
    app: swarmui
spec:
  type: NodePort
  ports:
    - port: 7801
      targetPort: 7801
      protocol: TCP
      name: http
      nodePort: 30190
  selector:
    app: swarmui
