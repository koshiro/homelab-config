apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - 02-pv-pvc.yaml
  - 00-deployment.yaml
  - 01-service.yaml
  - 03-ingress-domain.yaml
  - 04-service-nodeport.yaml
  - 08-smartgallery.yaml
  - 09-swarmui.yaml
# Parches propios como custom nodes de solo lectura (ver custom-nodes/*/__init__.py). El hash del nombre
# reinicia el deployment al cambiar el código; lo aplica Flux al mergear.
configMapGenerator:
  - name: comfyui-homelab-asset-subfolder
    namespace: comfyui
    files:
      - custom-nodes/homelab_asset_subfolder/__init__.py
components:
  - ../../components/proteger-datos
