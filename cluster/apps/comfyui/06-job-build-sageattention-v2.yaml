# Job one-shot: compila e instala SageAttention 2.x (tag v2.2.0) en /app/venv del PVC.
# Contexto: PyPI solo publica sageattention 1.0.6 (API antigua); KJNodes importa símbolos 2.x
# (p. ej. sageattn_qk_int8_pv_fp8_cuda). Ver thu-ml/SageAttention README y kijai/ComfyUI-KJNodes#353.
#
# Uso:
#   kubectl scale deployment/comfyui -n comfyui --replicas=0
#   kubectl apply -f cluster/apps/comfyui/06-job-build-sageattention-v2.yaml
#   kubectl wait --for=condition=complete job/comfyui-build-sageattention-v2 -n comfyui --timeout=3600s
#   kubectl logs job/comfyui-build-sageattention-v2 -n comfyui
#   kubectl scale deployment/comfyui -n comfyui --replicas=1
#
# El modo "sageattn3" del nodo KJNodes importa sageattn3_blackwell (GPUs Blackwell); en RTX 3070 usar
# auto / sageattn_qk_int8_pv_fp16_cuda, no sageattn3. Ver notas en woct0rdho/SageAttention releases.
apiVersion: batch/v1
kind: Job
metadata:
  name: comfyui-build-sageattention-v2
  namespace: comfyui
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/media-worker: "true"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: comfyui-workspace-pvc
      containers:
        - name: build
          image: nvidia/cuda:12.4.1-devel-ubuntu22.04
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-dev python3-venv \
                git ninja-build ca-certificates build-essential
              export CUDA_HOME=/usr/local/cuda
              export PATH="${CUDA_HOME}/bin:${PATH}"
              nvcc --version
              # Python del venv persistente (Debian/jemeyer); debe ejecutar en esta imagen (glibc compatible).
              /app/venv/bin/python -V
              /app/venv/bin/python -m pip install --upgrade pip setuptools wheel packaging
              /app/venv/bin/python -m pip uninstall -y sageattention || true
              rm -rf /tmp/SageAttention
              git clone --depth 1 --branch v2.2.0 https://github.com/thu-ml/SageAttention.git /tmp/SageAttention
              cd /tmp/SageAttention
              # Compilar e instalar contra el torch ya presente en /app/venv (2.6+cu124).
              MAX_JOBS=8 EXT_PARALLEL=4 NVCC_APPEND_FLAGS="--threads 8" \
                /app/venv/bin/python -m pip install -v . --no-build-isolation
              /app/venv/bin/python -c "from sageattention import sageattn_qk_int8_pv_fp8_cuda; print('import_ok', sageattn_qk_int8_pv_fp8_cuda)"
              echo "SageAttention v2 instalado en /app/venv (PVC)."
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
