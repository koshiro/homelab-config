apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-workspace-pv
  labels:
    pv-name: comfyui-workspace-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.100
    path: "/mnt/homelab-storage/comfyui"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=4
    - hard
    - rsize=262144
    - wsize=262144
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-workspace-pvc
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      pv-name: comfyui-workspace-pv
