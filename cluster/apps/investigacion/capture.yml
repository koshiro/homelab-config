# Capturas: atiende capture_job (lo pide web), descarga SOLO por egress-proxy con el usuario `capture` y guarda en la
# evidencia (única con escritura). Sin Ingress ni Service: nadie le habla, solo lee la cola en Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: capture
  template:
    metadata:
      labels:
        app: capture
        investigacion/db: cliente
        investigacion/proxy: cliente
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: capture
          image: ghcr.io/koshiro/investigacion:sha-9fa3ac3
          args: [capture]
          env:
            - name: INVESTIGACION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pg-usr-capture, key: uri}
            - name: INVESTIGACION_PROXY_URL
              valueFrom:
                secretKeyRef: {name: proxy-capture, key: HTTPS_PROXY}
            - {name: INVESTIGACION_EVIDENCIA_DIR, value: /evidencia}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: evidencia, mountPath: /evidencia}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: evidencia
          persistentVolumeClaim: {claimName: evidencia}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
