# Interfaz web (login argon2 + TOTP, investigaciones, visor). NodePort 30960 (serie 3096x de la plataforma), solo LAN o
# tailnet: NO hay Ingress, porque el túnel comodín de Cloudflare publicaría cualquier *.danielriquelme.cl.
# El initContainer aplica las migraciones SQL con el rol dueño; el contenedor web usa solo usr_web (inv_web).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        investigacion/db: cliente
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrar
          image: ghcr.io/koshiro/investigacion:sha-b61844a
          args: [migrar]
          env:
            - name: INVESTIGACION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: investigacion-pg-app, key: uri}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      containers:
        - name: web
          image: ghcr.io/koshiro/investigacion:sha-b61844a
          args: [web]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: INVESTIGACION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pg-usr-web, key: uri}
            - {name: INVESTIGACION_EVIDENCIA_DIR, value: /evidencia}
          envFrom:
            - secretRef: {name: web-secreto}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: evidencia, mountPath: /evidencia, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: evidencia
          persistentVolumeClaim: {claimName: evidencia, readOnly: true}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30960}
