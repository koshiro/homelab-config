# Búsqueda web del investigador (fase 2). SearXNG sale SOLO por egress-proxy (usuario searxng, lista searxng.txt) y
# solo lo consulta el worker. El worker usa título y URL; el resto de la respuesta se descarta en el código.
# Imagen fijada con al menos dos semanas publicada. Sin limiter ni valkey: no es una instancia pública.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        # Medido el 2026-10-29: brave responde 429 con captcha y duckduckgo pide CAPTCHA tras ~6 consultas seguidas;
        # startpage y mojeek vienen inactivos (captcha de prueba de trabajo). Se reparten las consultas entre cuatro.
        keep_only: [duckduckgo, bing, google, qwant]
    engines:
      - name: bing
        disabled: false
      - name: google
        disabled: false
      - name: qwant
        disabled: false
    general:
      instance_name: investigacion
      enable_metrics: false
    search:
      # Una IP doméstica choca pronto con los CAPTCHA: suspender el motor minutos, no horas (por defecto 1 h a 15 días).
      suspended_times:
        SearxEngineAccessDenied: 300
        SearxEngineCaptcha: 600
        SearxEngineTooManyRequests: 300
        cf_SearxEngineCaptcha: 3600
        cf_SearxEngineAccessDenied: 3600
        recaptcha_SearxEngineCaptcha: 3600
      safe_search: 1
      formats: [json]
      default_lang: es-CL
    server:
      limiter: false
      public_instance: false
      image_proxy: false
      method: GET
    outgoing:
      request_timeout: 8.0
      max_request_timeout: 20.0
      enable_http2: false
      # El proxy y su contraseña llegan por la variable SEARXNG_PROXY (ver entrypoint del contenedor).
    valkey:
      url: false
    # Plugins que descargan listas de terceros al arrancar (ClearURLs, Ahmia): apagados; su salida no está en la lista.
    plugins:
      searx.plugins.tracker_url_remover.SXNGPlugin:
        active: false
      searx.plugins.ahmia_filter.SXNGPlugin:
        active: false
    ui:
      static_use_hash: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
        investigacion/proxy: cliente
      annotations:
        # settings.yml se copia al arrancar: cambiar este valor al editar el ConfigMap reinicia SearXNG.
        investigacion/config: "2026-10-29-motores"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Escribe settings.yml con el proxy (la contraseña viene del Secret; no queda en el ConfigMap).
        - name: config
          image: docker.io/searxng/searxng:2026.10.13-22c64b8d3
          command: [/bin/sh, -c]
          args:
            - |
              cp /plantilla/settings.yml /config/settings.yml
              printf '  proxies:\n    all://:\n      - %s\n' "$PROXY_URL" > /tmp/proxies
              sed -i '/^outgoing:/r /tmp/proxies' /config/settings.yml
          env:
            - name: PROXY_URL
              valueFrom:
                secretKeyRef: {name: proxy-searxng, key: PROXY_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: plantilla, mountPath: /plantilla, readOnly: true}
            - {name: config, mountPath: /config}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.10.13-22c64b8d3
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SEARXNG_SETTINGS_PATH, value: /config/settings.yml}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef: {name: searxng-secreto, key: SEARXNG_SECRET}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: config, mountPath: /etc/searxng}
            - {name: cache, mountPath: /var/cache/searxng}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: plantilla
          configMap: {name: searxng}
        - name: config
          emptyDir: {sizeLimit: 16Mi}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector:
    app: searxng
  ports:
    - {name: http, port: 8080, targetPort: http}
