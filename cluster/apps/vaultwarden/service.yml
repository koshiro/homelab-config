# NodePort fijo (siguiente libre de la serie 3089x). Acceso por LAN/tailnet: http://192.168.1.15:30892
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  type: NodePort
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30892
