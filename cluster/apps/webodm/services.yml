apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  labels:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  labels:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: webapp
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: webapp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 31808
---
apiVersion: v1
kind: Service
metadata:
  name: node-odx-1
  labels:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: nodeodm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webodm
    app.kubernetes.io/component: nodeodm
  ports:
    - name: api
      port: 3000
      targetPort: 3000
