# Immich Configuration Values
# This file contains the configuration values for Immich deployment

# Application Configuration
app:
  name: immich
  version: v1.140.1
  namespace: immich

# Database Configuration
database:
  host: homelab-postgres-rw.postgresql.svc.cluster.local
  port: 5432
  name: immich
  user: immich
  # Password is stored in secret: homelab-postgres-app
  vectorExtension: pgvector

# Redis Configuration
redis:
  host: immich-redis-master
  port: 6379

# Machine Learning Configuration
machineLearning:
  enabled: true
  url: http://immich-machine-learning.immich.svc.cluster.local:3003

# Web Configuration
web:
  url: https://immich.danielriquelme.cl
  serverUrl: http://immich-server.immich.svc.cluster.local:2283
  publicServerUrl: https://immich.danielriquelme.cl/api

# Media Configuration
media:
  location: /usr/src/app/upload

# Ingress Configuration
ingress:
  enabled: true
  host: immich.danielriquelme.cl
  tls: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod

# Resources
resources:
  server:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  machineLearning:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi