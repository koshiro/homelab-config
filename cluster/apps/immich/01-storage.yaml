# Biblioteca de fotos. Desde 2026-09-30 en Proxmox (dataset ZFS nvme/k8s/immich, export NFS).
# Copia original (solo lectura) en TrueNAS: carpeta immich-library del dataset raíz de homelab-storage.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-proxmox
  nfs:
    server: 192.168.1.100
    path: /nvme/k8s/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-proxmox
  volumeName: immich-library-pv
  resources:
    requests:
      storage: 200Gi
