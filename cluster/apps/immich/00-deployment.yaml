apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/instance: immich
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v1.140.1
          imagePullPolicy: IfNotPresent
          env:
            - name: IMMICH_MEDIA_LOCATION
              value: /usr/src/app/upload
            - name: DB_URL
              value: postgresql://immich:OC3A3kD7Q0yaTogfuWpIpsvUFwZ1DLgQHFLoAFAOu9mij9Sb33XeauMKuCl6Xbcw@homelab-postgres-rw.postgresql.svc.cluster.local:5432/immich
            - name: DB_VECTOR_EXTENSION
              value: pgvector
            - name: REDIS_HOSTNAME
              value: immich-redis-master
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning.immich.svc.cluster.local:3003
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: warn
            - name: IMMICH_WEB_URL
              value: "http://immich.danielriquelme.cl"
            - name: IMMICH_SERVER_URL
              value: "http://immich-server.immich.svc.cluster.local:2283"
            - name: PUBLIC_IMMICH_SERVER_URL
              value: "http://immich.danielriquelme.cl/api"
          ports:
            - name: http
              containerPort: 2283 # Puerto del servidor Immich
              protocol: TCP
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: machine-learning
        app.kubernetes.io/instance: immich
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v1.140.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: postgresql://immich:OC3A3kD7Q0yaTogfuWpIpsvUFwZ1DLgQHFLoAFAOu9mij9Sb33XeauMKuCl6Xbcw@homelab-postgres-rw.postgresql.svc.cluster.local:5432/immich
            - name: DB_VECTOR_EXTENSION
              value: pgvector
            - name: REDIS_HOSTNAME
              value: immich-redis-master
            - name: REDIS_PORT
              value: "6379"
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: MPLCONFIGDIR
              value: /cache/matplotlib
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
spec:
  type: ClusterIP
  ports:
    - port: 2283
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich