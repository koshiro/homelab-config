apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/instance: immich
    spec:
      # Fuera de pibot (4 GB, reservado a sitios estáticos); preferir k3s-node-3, donde vive immich-redis.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [pibot]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k3s-node-3]
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: IMMICH_MEDIA_LOCATION
              value: /usr/src/app/upload
            # Credenciales desde el secret (antes: contraseña en texto plano en DB_URL)
            - name: DB_HOSTNAME
              value: homelab-postgres-rw.postgresql.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homelab-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-postgres-app
                  key: password
            - name: DB_VECTOR_EXTENSION
              value: pgvector
            - name: REDIS_HOSTNAME
              value: immich-redis-master
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning.immich.svc.cluster.local:3003
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: warn
            - name: IMMICH_WEB_URL
              value: "http://immich.danielriquelme.cl"
            - name: IMMICH_SERVER_URL
              value: "http://immich-server.immich.svc.cluster.local:2283"
            - name: PUBLIC_IMMICH_SERVER_URL
              value: "http://immich.danielriquelme.cl/api"
          ports:
            - name: http
              containerPort: 2283 # Puerto del servidor Immich
              protocol: TCP
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: machine-learning
        app.kubernetes.io/instance: immich
    spec:
      # Immich ML v3 requiere x86-64-v2: todos los workers lo tienen desde 2026-10-10 (cpu: host).
      # Fuera de pibot (4 GB, reservado a sitios estáticos); preferir k3s-node-3, donde vive immich-redis.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [pibot]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k3s-node-3]
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: TRANSFORMERS_CACHE
              value: /cache
            - name: MPLCONFIGDIR
              value: /cache/matplotlib
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          # En reposo ~170 MB; al indexar (CLIP + caras) sube a 2–3 GB.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        # Modelos descargados en el disco del nodo. Los repos por defecto pesan ~3,4 GB (CLIP ViT-B-32 2,6 GB +
        # buffalo_l 0,8 GB, con variantes de otros runtimes): con 2Gi el kubelet desalojó el pod el 2026-10-16.
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
spec:
  type: ClusterIP
  ports:
    - port: 2283
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/instance: immich