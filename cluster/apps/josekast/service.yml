# NodePort fijo: origen del túnel pibot-webs (http://192.168.1.15:30890), que así no depende de
# CoreDNS ni de Traefik (corren en los workers de Proxmox).
apiVersion: v1
kind: Service
metadata:
  name: josekast
  namespace: josekast
  labels:
    app: josekast
spec:
  type: NodePort
  selector:
    app: josekast
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30890
