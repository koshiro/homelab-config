# Requiere en el túnel de Cloudflare (gestión remota) los hostnames josekast.cl y www.josekast.cl
# -> http://traefik.kube-system.svc.cluster.local:80 (el comodín solo cubre *.danielriquelme.cl).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: josekast
  namespace: josekast
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: josekast.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: josekast
                port:
                  number: 80
    - host: www.josekast.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: josekast
                port:
                  number: 80
