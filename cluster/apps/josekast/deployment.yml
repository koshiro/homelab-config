# Sitio estático josekast.cl. Corre en pibot con el contenido en su disco (/var/lib/homelab-josekast),
# sin depender de Proxmox: el túnel pibot-webs lo sirve aunque caigan los workers y el NAS
# (ver «Sitios estáticos» en README.md). Respaldo diario al NAS: config-backup-josekast.
# El contenido lo genera ~/git/twscrap/web/build.py y se publica con ~/git/twscrap/web/publicar.sh
# (rsync a daniel@k3s-node-0:/var/lib/homelab-josekast/; nginx lo sirve al instante, sin reiniciar).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: josekast
  namespace: josekast
  labels:
    app: josekast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: josekast
  template:
    metadata:
      labels:
        app: josekast
    spec:
      # k3s-node-0 / MagicDNS: Raspberry Pi (hostname de cluster: pibot)
      nodeName: pibot
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: web
          hostPath:
            path: /var/lib/homelab-josekast
            type: Directory
        - name: nginx-conf
          configMap:
            name: josekast-nginx
