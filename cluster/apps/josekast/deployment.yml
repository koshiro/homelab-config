# Sitio estático josekast.cl. Contenido en Proxmox: /nvme/k8s/webs/josekast (dataset nvme/k8s/webs,
# export NFS de solo lectura; snapshots sanoid + réplica + R2). Para actualizar el sitio:
#   scp sitio.html root@192.168.1.100:/nvme/k8s/webs/josekast/index.html
apiVersion: apps/v1
kind: Deployment
metadata:
  name: josekast
  namespace: josekast
  labels:
    app: josekast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: josekast
  template:
    metadata:
      labels:
        app: josekast
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: web
          nfs:
            server: 192.168.1.100
            path: /nvme/k8s/webs/josekast
            readOnly: true
        - name: nginx-conf
          configMap:
            name: josekast-nginx
