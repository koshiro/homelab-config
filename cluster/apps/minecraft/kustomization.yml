apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - service.yml
  - deployment.yml
  - networkpolicy.yml
  - whitelist-bot/deployment.yml
  - restart-cronjob.yml
  - proxy/
  - spirals/
configMapGenerator:
  # Parche de Paper para aceptar solo conexiones del proxy Velocity (principal y mapas)
  - name: minecraft-velocity-patch
    namespace: minecraft
    files:
      - velocity-patch.json
    options:
      disableNameSuffixHash: true
  - name: minecraft-whitelist-bot
    namespace: minecraft
    files:
      - whitelist-bot/bot.py
# Secrets (secret-ddns, whitelist-bot/secret, proxy/secret-velocity .sops.yaml): entran por solo-flux/ y los
# descifra Flux.
components:
  - ../../components/proteger-datos
