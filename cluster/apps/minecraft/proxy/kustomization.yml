apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft
resources:
  - deployment.yml
configMapGenerator:
  - name: minecraft-proxy-config
    files:
      - velocity.toml
      - geyser-config.yml
      - floodgate-config.yml
  - name: minecraft-proxy-plugin-src
    files:
      - plugin/LobbyPlugin.java
      - plugin/BedrockSkins.java
      - plugin/velocity-plugin.json
# Secreto (aplicar aparte): sops -d secret-velocity.sops.yaml | kubectl apply -f -
