apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft
resources:
  - deployment.yml
configMapGenerator:
  - name: minecraft-proxy-config
    files:
      - velocity.toml
      - geyser-config.yml
      - floodgate-config.yml
  - name: minecraft-proxy-plugin-src
    files:
      - plugin/LobbyPlugin.java
      - plugin/BedrockSkins.java
      - plugin/HostnameFilter.java
      - plugin/velocity-plugin.json
# Secreto: secret-velocity.sops.yaml entra por ../solo-flux/ (lo descifra Flux).
components:
  - ../../../components/proteger-datos
