apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
      # Ruta de datos: no cambiar sin backup; respaldos = snapshots TrueNAS en este dataset
      annotations:
        data/nfs-path: "192.168.1.20:/mnt/homelab-storage/minecraft-server"
    spec:
      # Tiempo para guardado graceful: save-all + /stop antes de SIGKILL (evita pérdida de datos)
      terminationGracePeriodSeconds: 90
      # Afinidad no estricta, pero preferiblemente en media-worker por cercanía de red
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values: ["true"]
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java21
          imagePullPolicy: Always
          ports:
            - containerPort: 25565
              name: java
              protocol: TCP
            - containerPort: 19132
              name: bedrock
              protocol: UDP
            - containerPort: 24454
              name: voice-chat
              protocol: UDP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21.1"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENABLE_WHITELIST
              value: "FALSE"
            # Forzar whitelist off al arranque (server.properties puede quedar true en mundos existentes)
            - name: RCON_CMDS_STARTUP
              value: "whitelist off"
            - name: VIEW_DISTANCE
              value: "10"
            - name: MOTD
              value: "Minecraft Daniel Riquelme"
            - name: DIFFICULTY
              value: "hard"
            - name: MODE
              value: "survival"
            - name: SEED
              value: "5134907312929138905"
            - name: MEMORY
              value: "4G"
            - name: JVM_OPTS
              value: "-Xms2G -Xmx4G -Dpaper.experimental.bundle=true"
            # Habilitar datapacks experimentales al crear mundo (Bundles)
            - name: INITIAL_ENABLED_PACKS
              value: "bundle"
            # Plugins: Geyser (Bedrock), Floodgate, Simple Voice Chat, SkinsRestorer — URLs "latest" para Geyser/Floodgate
            - name: PLUGINS
              value: |
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
                https://cdn.modrinth.com/data/9eGKb6K1/versions/FeJRj2X0/voicechat-bukkit-2.6.12.jar
                https://github.com/SkinsRestorer/SkinsRestorer/releases/download/15.10.0/SkinsRestorer.jar
            - name: SPIGET_RESOURCES
              value: "19254,27231" # ViaVersion, ViaBackwards
          resources:
            requests:
              memory: 4Gi
              cpu: 2000m
            limits:
              memory: 6Gi
              cpu: 4000m
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
          # Guardar mundo explícitamente antes de que el contenedor reciba SIGTERM (evita pérdida de datos)
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rcon-cli save-all 2>/dev/null || true; sleep 3"]
        # Sidecar DDNS
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:latest
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minecraft-ddns-secret
                  key: CF_API_TOKEN
            - name: DOMAINS
              value: "minecraft.danielriquelme.cl"
            - name: PROXIED
              value: "false"
            - name: DELETE_ON_STOP
              value: "false"
      volumes:
        # CRÍTICO - ÚNICA FUENTE DE DATOS: no cambiar path ni borrar en TrueNAS sin backup.
        # Los datos viven en 192.168.1.20:/mnt/homelab-storage/minecraft-server (snapshots en TrueNAS).
        - name: minecraft-data
          nfs:
            server: 192.168.1.20
            path: /mnt/homelab-storage/minecraft-server
