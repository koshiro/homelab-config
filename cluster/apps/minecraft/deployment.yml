apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
      # Ruta de datos: no cambiar sin backup; respaldos = sanoid en Proxmox (nvme/k8s/minecraft) + syncoid + restic
      annotations:
        data/nfs-path: "192.168.1.100:/nvme/k8s/minecraft"
    spec:
      # Tiempo para guardado graceful: save-all + /stop antes de SIGKILL (evita pérdida de datos)
      terminationGracePeriodSeconds: 90
      # Afinidad no estricta, pero preferiblemente en media-worker por cercanía de red
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values: ["true"]
      initContainers:
        # Addon OneBlock de BentoBox: no es un plugin de Modrinth, va en plugins/BentoBox/addons/.
        # Versión fijada; para actualizar cambiar AONEBLOCK_VERSION (releases en GitHub BentoBoxWorld/AOneBlock).
        - name: aoneblock-addon
          image: curlimages/curl:8.16.0
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: AONEBLOCK_VERSION
              value: "1.28.0"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              dir=/data/plugins/BentoBox/addons
              jar="$dir/AOneBlock-$AONEBLOCK_VERSION.jar"
              mkdir -p "$dir"
              if [ ! -s "$jar" ]; then
                rm -f "$dir"/AOneBlock-*.jar
                curl -fsSL -o "$jar.tmp" "https://github.com/BentoBoxWorld/AOneBlock/releases/download/$AONEBLOCK_VERSION/AOneBlock-$AONEBLOCK_VERSION.jar"
                mv "$jar.tmp" "$jar"
              fi
              ls -l "$dir"
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.9.2-java25  # Paper 26.x requiere Java 25
          imagePullPolicy: Always
          ports:
            - containerPort: 25565
              name: java
              protocol: TCP
            - containerPort: 24454
              name: voice-chat
              protocol: UDP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "26.2"  # No subir a 26.3 hasta que Geyser soporte Java 26.3 (ver docs/PENDIENTES.md)
            - name: ONLINE_MODE
              value: "FALSE"
            # Whitelist activa; la lista vive en /data/whitelist.json y se gestiona por RCON o el bot de
            # Telegram (Java: whitelist add, Bedrock: fwhitelist add). No usar WHITELIST: calcularía UUIDs
            # offline para los jugadores Bedrock (Floodgate usa UUIDs derivados del XUID).
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            # Forzar whitelist off al arranque (server.properties puede quedar true en mundos existentes)
            - name: VIEW_DISTANCE
              value: "10"
            # Sin datos personales: los escáneres públicos (mcscans, etc.) guardan el MOTD
            - name: MOTD
              value: "Servidor familiar"
            # La lista de servidores muestra solo la cantidad, no los nombres (evita filtrar la whitelist)
            - name: HIDE_ONLINE_PLAYERS
              value: "TRUE"
            - name: DIFFICULTY
              value: "hard"
            - name: MODE
              value: "survival"
            - name: SEED
              value: "5134907312929138905"
            - name: MEMORY
              value: "4G"
            - name: USE_AIKAR_FLAGS
              value: "true"
            # Detrás del proxy Velocity (proxy/): Geyser vive en el proxy; aquí queda Floodgate (misma
            # key.pem) para la whitelist de Bedrock (fwhitelist). Solo acepta conexiones del proxy.
            - name: PLUGINS
              value: |
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
            - name: PATCH_DEFINITIONS
              value: /patches/velocity-patch.json
            - name: CFG_VELOCITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: minecraft-velocity
                  key: forwarding-secret
            # Resto desde Modrinth: última versión release compatible con VERSION
            # Lobby de juegos (docs: cluster/apps/minecraft/LOBBY.md): Multiverse (mundos, inventarios
            # separados y portales), BentoBox (OneBlock; el addon AOneBlock lo instala el initContainer),
            # minijuegos y WorldEdit para construir.
            - name: MODRINTH_PROJECTS
              value: |
                viaversion
                viabackwards
                simple-voice-chat
                skinsrestorer
                multiverse-core
                multiverse-inventories
                multiverse-portals
                multiverse-commanddestination
                bentobox
                minigames-with-friends
                worldedit
                fancynpcs
            - name: MODRINTH_ALLOWED_VERSION_TYPE
              value: "release"
            # Borra los .jar de plugins/ antes de descargar (evita versiones acumuladas)
            - name: REMOVE_OLD_MODS
              value: "TRUE"
            - name: REMOVE_OLD_MODS_INCLUDE
              value: "*.jar"
            - name: REMOVE_OLD_MODS_DEPTH
              value: "1"
          resources:
            requests:
              memory: 4Gi
              cpu: 2000m
            limits:
              memory: 6Gi
              cpu: 4000m
          volumeMounts:
            - name: minecraft-data
              mountPath: /data
            - name: velocity-patch
              mountPath: /patches
          # Guardar mundo explícitamente antes de que el contenedor reciba SIGTERM (evita pérdida de datos)
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rcon-cli save-all 2>/dev/null || true; sleep 3"]
        # Sidecar DDNS
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:latest
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minecraft-ddns-secret
                  key: CF_API_TOKEN
            - name: DOMAINS
              value: "minecraft.danielriquelme.cl"
            - name: PROXIED
              value: "false"
            - name: DELETE_ON_STOP
              value: "false"
      volumes:
        - name: velocity-patch
          configMap:
            name: minecraft-velocity-patch
        # CRÍTICO - ÚNICA FUENTE DE DATOS: no cambiar path ni borrar sin backup.
        # Desde 2026-09-30 los datos viven en Proxmox (dataset ZFS nvme/k8s/minecraft, export NFS).
        # Copia original (solo lectura) en TrueNAS: carpeta minecraft-server del dataset raíz de homelab-storage.
        - name: minecraft-data
          nfs:
            server: 192.168.1.100
            path: /nvme/k8s/minecraft
