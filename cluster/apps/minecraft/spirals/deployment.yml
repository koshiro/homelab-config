# Servidores de mapas detrás del proxy Velocity (ver ../LOBBY.md, sección Proxy):
# Parkour Spiral 2 y 3 de Hielke (https://hielkemaps.com), mapas 26.2 con datapacks propios, que
# por eso necesitan ser el mundo principal de su propio Paper. No se exponen fuera del cluster:
# solo se llega a ellos desde el proxy (NPC del lobby). El mundo se descarga en el primer arranque
# (WORLD); el progreso (ranking, cronómetros) queda en el PVC. Para reiniciar un mapa: vaciar el dataset.
# Datos en NFS de Proxmox (datasets nvme/k8s/minecraft-spiral2|3, export en proxmox/etc/k8s.exports;
# sanoid + syncoid heredados de nvme/k8s) para que los pods no queden atados a un nodo (antes local-path
# en node-3, que se quedaba sin RAM al juntar los tres servidores; 2026-10-10).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-spiral2-data-pv
spec:
  capacity:
    storage: 3Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-proxmox
  nfs:
    server: 192.168.1.100
    path: /nvme/k8s/minecraft-spiral2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-spiral2-data
  namespace: minecraft
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-proxmox
  volumeName: minecraft-spiral2-data-pv
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-spiral3-data-pv
spec:
  capacity:
    storage: 3Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-proxmox
  nfs:
    server: 192.168.1.100
    path: /nvme/k8s/minecraft-spiral3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-spiral3-data
  namespace: minecraft
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-proxmox
  volumeName: minecraft-spiral3-data-pv
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-spiral2
  namespace: minecraft
  labels:
    app: minecraft-spiral2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-spiral2
  template:
    metadata:
      labels:
        app: minecraft-spiral2
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.9.2-java25
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.2"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENABLE_WHITELIST
              value: "FALSE"
            - name: MODE
              value: adventure
            - name: SPAWN_PROTECTION
              value: "0"
            - name: VIEW_DISTANCE
              value: "10"
            - name: MEMORY
              value: 2G
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: PLUGINS
              value: https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
            - name: PATCH_DEFINITIONS
              value: /patches/velocity-patch.json
            - name: CFG_VELOCITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: minecraft-velocity
                  key: forwarding-secret
            - name: MOTD
              value: "Parkour Spiral 2"
            - name: DIFFICULTY
              value: normal
            - name: WORLD
              value: "https://hielkemaps.com/downloads/Parkour%20Spiral%202.zip"
          ports:
            - containerPort: 25565
              name: java
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: "2"
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rcon-cli save-all 2>/dev/null || true; sleep 3"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: patches
              mountPath: /patches
            - name: floodgate-key
              mountPath: /data/plugins/floodgate/key.pem
              subPath: floodgate-key.pem
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-spiral2-data
        - name: patches
          configMap:
            name: minecraft-velocity-patch
        - name: floodgate-key
          secret:
            secretName: minecraft-velocity
            items:
              - key: floodgate-key.pem
                path: floodgate-key.pem
---
