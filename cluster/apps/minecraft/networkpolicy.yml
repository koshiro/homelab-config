apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-policy
  namespace: minecraft
spec:
  podSelector:
    matchLabels:
      app: minecraft
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permitir tráfico de juego
    - from: []
      ports:
        - protocol: TCP
          port: 25565
        - protocol: UDP
          port: 19132
        - protocol: UDP
          port: 24454 # Puerto Voice Chat
    # Permitir monitoreo/rcon interno
    - from:
      - ipBlock:
          cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 25575
  egress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
