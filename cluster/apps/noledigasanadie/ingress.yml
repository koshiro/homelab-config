apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noledigasanadie
  namespace: noledigasanadie
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: noledigasanadie.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noledigasanadie
                port:
                  number: 80
