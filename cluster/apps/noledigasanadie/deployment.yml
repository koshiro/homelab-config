# Sitio estático en pibot con el contenido en su disco (/var/lib/homelab-noledigasanadie), sin
# depender de Proxmox (ver «Sitios estáticos» en README.md). Respaldo diario al NAS:
# config-backup-noledigasanadie. Publicar: rsync -a --delete <carpeta>/ daniel@k3s-node-0:/var/lib/homelab-noledigasanadie/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noledigasanadie
  namespace: noledigasanadie
  labels:
    app: noledigasanadie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: noledigasanadie
  template:
    metadata:
      labels:
        app: noledigasanadie
    spec:
      # k3s-node-0 / MagicDNS: Raspberry Pi (hostname de cluster: pibot)
      nodeName: pibot
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: web
          hostPath:
            path: /var/lib/homelab-noledigasanadie
            type: DirectoryOrCreate
