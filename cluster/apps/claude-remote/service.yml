# Puerto de sincronización de Syncthing por NodePort: el Mac se conecta a tcp://k3s-node-0:30894 (tailnet) o a la IP
# LAN de cualquier nodo. La GUI no se publica: kubectl -n claude-remote port-forward deploy/claude-remote 8384.
apiVersion: v1
kind: Service
metadata:
  name: claude-remote-sync
  namespace: claude-remote
spec:
  type: NodePort
  selector:
    app: claude-remote
  ports:
    - name: sync
      port: 22000
      targetPort: sync
      protocol: TCP
      nodePort: 30894
