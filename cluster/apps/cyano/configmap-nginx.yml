# SPA de SvelteKit con service worker. add_header dentro de un location anula los del server, por eso
# las cabeceras de seguridad viven en security-headers.inc y cada location las incluye (extensión .inc:
# nginx solo carga *.conf de conf.d a nivel http).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cyano-nginx
  namespace: cyano
data:
  security-headers.inc: |
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' en script-src: script de arranque inline de SvelteKit en index.html.
    # data: vistas previas de escaneos y fotos; blob: descargas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      charset utf-8;

      gzip on;
      gzip_comp_level 6;
      gzip_min_length 1024;
      gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

      # Archivos con hash: inmutables.
      location /_app/immutable/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }

      # Deben revalidarse siempre para que las versiones nuevas lleguen.
      location = /service-worker.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
      }
      location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
      }

      # SPA: rutas como /p/<id> caen a index.html.
      location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
      }
    }
