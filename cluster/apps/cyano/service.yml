# NodePort fijo: origen del túnel pibot-webs (http://192.168.1.15:30892), que así no depende de
# CoreDNS ni de Traefik (corren en los workers de Proxmox).
apiVersion: v1
kind: Service
metadata:
  name: cyano
  namespace: cyano
  labels:
    app: cyano
spec:
  type: NodePort
  selector:
    app: cyano
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30892
