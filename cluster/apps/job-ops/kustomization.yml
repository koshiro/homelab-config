# JobOps: búsqueda de empleo remota (Job Hunter). Sin secretos en el repo: proveedor LLM, cuentas y CV se configuran
# en la UI y viven en la SQLite del PVC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: job-ops
resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ingress.yml
  - networkpolicy.yml
components:
  - ../../components/proteger-datos
