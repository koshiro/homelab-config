# Público por el comodín del túnel; protegido por la app de Cloudflare Access «Homelab admin» (OTP) además del login
# propio de JobOps. Agregar el host a esa app ANTES del merge.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-ops
  namespace: job-ops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: jobops.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-ops
                port:
                  number: 3001
