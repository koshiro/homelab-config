# PV/PVC para workspace de Unsloth (datasets, checkpoints, modelos exportados).
# El mismo path NFS puede ser montado por qwen-coder para servir el modelo exportado.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llm-unsloth-pv
  labels:
    pv-name: llm-unsloth-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.20
    path: "/mnt/homelab-storage/llm"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=4
    - hard
    - rsize=262144
    - wsize=262144
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unsloth-workspace-pvc
  namespace: unsloth
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      pv-name: llm-unsloth-pv
