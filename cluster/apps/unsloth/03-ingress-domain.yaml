---
apiVersion: v1
kind: Secret
metadata:
  name: unsloth-basic-auth
  namespace: unsloth
type: Opaque
data:
  # htpasswd -nb unsloth <password> | base64 -w0
  users: dW5zbG90aDokYXByMSRKOHN4VHZ2Li9VZ0s0Lm1LZzRTRi9QekpXWWJMMS4K
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unsloth-basic-auth
  namespace: unsloth
spec:
  basicAuth:
    secret: unsloth-basic-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unsloth-ingress
  namespace: unsloth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: unsloth-unsloth-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: unsloth.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unsloth
                port:
                  number: 8888
