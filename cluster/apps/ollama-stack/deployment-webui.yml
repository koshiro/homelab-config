apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.4.3
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama-stack.svc.cluster.local:11434"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: WEBUI_URL
              value: "http://192.168.1.15:30080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama-stack
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
