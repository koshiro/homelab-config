# ServiceLB (klipper) publica 8883 en la IP de cada nodo. El router reenvía WAN 8883/TCP → 192.168.1.15:8883 (pibot).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mqtt
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: mqtts
      protocol: TCP
