---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-ingress
  namespace: prowlarr
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarr
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: radarr
    ports:
    - protocol: TCP
      port: 9696
    - protocol: TCP
      port: 80
