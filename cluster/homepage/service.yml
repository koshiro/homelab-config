apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
    part-of: homelab-dashboard
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "homepage"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: homepage
