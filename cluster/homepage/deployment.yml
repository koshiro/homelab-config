apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
    part-of: homelab-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
        part-of: homelab-dashboard
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.tail*.ts.net,192.168.1.*,10.0.0.*,172.16.0.*"
            - name: HOMEPAGE_TITLE
              value: "Homelab Dashboard"
            - name: HOMEPAGE_THEME
              value: "dark"
            - name: HOMEPAGE_LANGUAGE
              value: "es"
            - name: HOMEPAGE_DISABLE_ANALYTICS
              value: "true"
            - name: HOMEPAGE_DISABLE_FRAME_SAMEORIGIN
              value: "false"
            - name: HOMEPAGE_DISABLE_ANONYMOUS_TELEMETRY
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homepage-config
      # Permitir que se despliegue en cualquier nodo
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/worker"
          operator: "Exists"
          effect: "NoSchedule"
      
      # Distribuir en diferentes nodos
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - homepage
              topologyKey: kubernetes.io/hostname
      
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
