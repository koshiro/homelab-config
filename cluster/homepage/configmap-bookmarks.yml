apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-bookmarks
  namespace: homepage
  labels:
    app: homepage
    part-of: homelab-dashboard
data:
  bookmarks.yaml: |
    # Enlaces rápidos del Homelab
    - name: "📚 Documentación"
      description: "Docs del homelab"
      icon: "book.png"
      url: "https://github.com/koshiro/homelab-config"
      target: _blank
      group: "Recursos"
    
    - name: "🔧 Ansible"
      description: "Automatización"
      icon: "ansible.png"
      url: "https://docs.ansible.com"
      target: _blank
      group: "Recursos"
    
    - name: "☸️ Kubernetes Docs"
      description: "Documentación oficial"
      icon: "kubernetes.png"
      url: "https://kubernetes.io/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🐳 Docker Hub"
      description: "Imágenes de contenedores"
      icon: "docker.png"
      url: "https://hub.docker.com"
      target: _blank
      group: "Recursos"
    
    - name: "📊 Prometheus"
      description: "Monitoreo"
      icon: "prometheus.png"
      url: "https://prometheus.io/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🎨 Grafana"
      description: "Dashboards"
      icon: "grafana.png"
      url: "https://grafana.com/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🔗 Tailscale"
      description: "VPN privada"
      icon: "tailscale.png"
      url: "https://tailscale.com/kb"
      target: _blank
      group: "Recursos"
    
    - name: "☁️ Cloudflare"
      description: "Túnel y DNS"
      icon: "cloudflare.png"
      url: "https://developers.cloudflare.com/cloudflare-one"
      target: _blank
      group: "Recursos"
    
    - name: "🏠 Proxmox"
      description: "Virtualización"
      icon: "proxmox.png"
      url: "https://pve.proxmox.com/wiki"
      target: _blank
      group: "Recursos"
    
    - name: "💾 TrueNAS"
      description: "Almacenamiento"
      icon: "truenas.png"
      url: "https://www.truenas.com/docs"
      target: _blank
      group: "Recursos"
