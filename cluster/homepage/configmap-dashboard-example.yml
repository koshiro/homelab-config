apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-dashboard-example
  namespace: homepage
  labels:
    app: homepage
    part-of: homelab-dashboard
data:
  # Este es un ejemplo de configuración completa del dashboard
  # Copia este contenido a los archivos correspondientes
  
  # settings.yaml - Configuración principal
  settings.yaml: |
    title: "🏠 Homelab Dashboard"
    theme: dark
    language: es
    color: slate
    headerStyle: clean
    layout: auto
    columns: 3
    
    # Widgets habilitados
    widgets:
      - search
      - weather
      - system-stats
      - docker
      - kubernetes
      - kubernetes-pods
    
    # Configuración de Docker
    docker:
      enabled: true
      socket: /var/run/docker.sock
      containers: true
      stats: true
      labels: true
    
    # Configuración de Kubernetes
    kubernetes:
      enabled: true
      inCluster: true
      namespace: all
    
    # Configuración de búsqueda
    search:
      provider: duckduckgo
      target: _blank
    
    # Configuración de weather
    weather:
      provider: openweathermap
      apiKey: ${OPENWEATHER_API_KEY}
      latitude: -33.4489
      longitude: -70.6693
      units: metric
      language: es
    
    # Configuración de sistema
    system:
      enabled: true
      cpu: true
      memory: true
      disk: true
      network: true
  
  # services.yaml - Servicios del homelab
  services.yaml: |
    # Grupo: Infraestructura
    - name: "🏠 Proxmox"
      description: "Servidor de virtualización"
      icon: "proxmox.png"
      url: "https://192.168.1.100:8006"
      target: _blank
      group: "Infraestructura"
      widget:
        type: proxmox
        url: "https://192.168.1.100:8006"
        username: "root@pam"
        apiTokenId: "ansible"
        apiTokenSecret: "${PROXMOX_API_TOKEN_SECRET}"
    
    - name: "💾 TrueNAS"
      description: "Almacenamiento NAS"
      icon: "truenas.png"
      url: "https://192.168.1.20"
      target: _blank
      group: "Infraestructura"
      widget:
        type: truenas
        url: "https://192.168.1.20"
        apiKey: "${TRUENAS_API_KEY}"
    
    - name: "☸️ Kubernetes"
      description: "Dashboard del clúster"
      icon: "kubernetes.png"
      url: "https://192.168.1.131:32634"
      target: _blank
      group: "Infraestructura"
    
    # Grupo: Monitoreo
    - name: "📊 Grafana"
      description: "Monitoreo y métricas"
      icon: "grafana.png"
      url: "https://grafana.danielriquelme.cl"
      target: _blank
      group: "Monitoreo"
    
    # Grupo: Medios
    - name: "🎬 Plex"
      description: "Servidor de medios"
      icon: "plex.png"
      url: "https://plex.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: plex
        url: "https://plex.danielriquelme.cl"
        token: "${PLEX_TOKEN}"
    
    - name: "📺 Sonarr"
      description: "Gestión de series de TV"
      icon: "sonarr.png"
      url: "https://sonarr.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: sonarr
        url: "https://sonarr.danielriquelme.cl"
        apiKey: "${SONARR_API_KEY}"
    
    - name: "🎬 Radarr"
      description: "Gestión de películas"
      icon: "radarr.png"
      url: "https://radarr.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: radarr
        url: "https://radarr.danielriquelme.cl"
        apiKey: "${RADARR_API_KEY}"
    
    - name: "🔍 Prowlarr"
      description: "Buscador de indexadores"
      icon: "prowlarr.png"
      url: "https://prowlarr.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: prowlarr
        url: "https://prowlarr.danielriquelme.cl"
        apiKey: "${PROWLARR_API_KEY}"
    
    - name: "📚 Bazarr"
      description: "Subtítulos automáticos"
      icon: "bazarr.png"
      url: "https://bazarr.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: bazarr
        url: "https://bazarr.danielriquelme.cl"
        apiKey: "${BAZARR_API_KEY}"
    
    - name: "🎯 Overseerr"
      description: "Solicitudes de contenido"
      icon: "overseerr.png"
      url: "https://overseerr.danielriquelme.cl"
      target: _blank
      group: "Medios"
      widget:
        type: overseerr
        url: "https://overseerr.danielriquelme.cl"
        apiKey: "${OVERSEERR_API_KEY}"
    
    # Grupo: Descargas
    - name: "📥 qBittorrent"
      description: "Cliente de torrents"
      icon: "qbittorrent.png"
      url: "https://qbittorrent.danielriquelme.cl"
      target: _blank
      group: "Descargas"
      widget:
        type: qbittorrent
        url: "https://qbittorrent.danielriquelme.cl"
        username: "admin"
        password: "${QBITTORRENT_PASSWORD}"
    
    # Grupo: Desarrollo
    - name: "🔄 Gitea"
      description: "Repositorio Git"
      icon: "gitea.png"
      url: "https://gitea.danielriquelme.cl"
      target: _blank
      group: "Desarrollo"
    
    - name: "🚀 ArgoCD"
      description: "GitOps y despliegues"
      icon: "argocd.png"
      url: "https://argocd.danielriquelme.cl"
      target: _blank
      group: "Desarrollo"
    
    # Grupo: Backup
    - name: "🕰️ Time Machine"
      description: "Backup de Mac"
      icon: "timemachine.png"
      url: "smb://192.168.1.131/timemachine"
      target: _blank
      group: "Backup"
    
    # Grupo: Red
    - name: "🔗 Tailscale"
      description: "VPN privada"
      icon: "tailscale.png"
      url: "https://login.tailscale.com"
      target: _blank
      group: "Red"
  
  # widgets.yaml - Widgets de monitoreo
  widgets.yaml: |
    # Widget de estado del sistema
    - name: "💻 Estado del Sistema"
      type: system-stats
      options:
        cpu: true
        memory: true
        disk: true
        network: true
        uptime: true
        os: true
    
    # Widget de contenedores Docker
    - name: "🐳 Contenedores Docker"
      type: docker
      options:
        url: "unix:///var/run/docker.sock"
        containers: true
        stats: true
        labels: true
    
    # Widget de pods de Kubernetes
    - name: "☸️ Pods Kubernetes"
      type: kubernetes-pods
      options:
        namespace: all
        showStatus: true
        showRestarts: true
        showAge: true
    
    # Widget de métricas del clúster
    - name: "📊 Métricas del Clúster"
      type: kubernetes
      options:
        namespace: all
        showNodes: true
        showPods: true
        showServices: true
    
    # Widget de estado de TrueNAS
    - name: "💾 Estado TrueNAS"
      type: truenas
      options:
        url: "https://192.168.1.20"
        apiKey: "${TRUENAS_API_KEY}"
        showPools: true
        showDatasets: true
        showSystem: true
    
    # Widget de estado de Proxmox
    - name: "🏠 Estado Proxmox"
      type: proxmox
      options:
        url: "https://192.168.1.100:8006"
        username: "root@pam"
        apiTokenId: "ansible"
        apiTokenSecret: "${PROXMOX_API_TOKEN_SECRET}"
        showVMs: true
        showNodes: true
        showStorage: true
    
    # Widget de estado de Plex
    - name: "🎬 Estado Plex"
      type: plex
      options:
        url: "https://plex.danielriquelme.cl"
        token: "${PLEX_TOKEN}"
        showLibraries: true
        showSessions: true
        showStats: true
    
    # Widget de estado de Sonarr
    - name: "📺 Estado Sonarr"
      type: sonarr
      options:
        url: "https://sonarr.danielriquelme.cl"
        apiKey: "${SONARR_API_KEY}"
        showSeries: true
        showQueue: true
        showCalendar: true
    
    # Widget de estado de Radarr
    - name: "🎬 Estado Radarr"
      type: radarr
      options:
        url: "https://radarr.danielriquelme.cl"
        apiKey: "${RADARR_API_KEY}"
        showMovies: true
        showQueue: true
        showCalendar: true
    
    # Widget de estado de qBittorrent
    - name: "📥 Estado qBittorrent"
      type: qbittorrent
      options:
        url: "https://qbittorrent.danielriquelme.cl"
        username: "admin"
        password: "${QBITTORRENT_PASSWORD}"
        showTorrents: true
        showStats: true
        showSpeed: true
    
    # Widget de estado de Grafana
    - name: "📊 Estado Grafana"
      type: grafana
      options:
        url: "https://grafana.danielriquelme.cl"
        apiKey: "${GRAFANA_API_KEY}"
        showDashboards: true
        showAlerts: true
        showMetrics: true
  
  # bookmarks.yaml - Enlaces rápidos
  bookmarks.yaml: |
    # Enlaces rápidos del Homelab
    - name: "📚 Documentación"
      description: "Docs del homelab"
      icon: "book.png"
      url: "https://github.com/koshiro/homelab-config"
      target: _blank
      group: "Recursos"
    
    - name: "🔧 Ansible"
      description: "Automatización"
      icon: "ansible.png"
      url: "https://docs.ansible.com"
      target: _blank
      group: "Recursos"
    
    - name: "☸️ Kubernetes Docs"
      description: "Documentación oficial"
      icon: "kubernetes.png"
      url: "https://kubernetes.io/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🐳 Docker Hub"
      description: "Imágenes de contenedores"
      icon: "docker.png"
      url: "https://hub.docker.com"
      target: _blank
      group: "Recursos"
    
    - name: "📊 Prometheus"
      description: "Monitoreo"
      icon: "prometheus.png"
      url: "https://prometheus.io/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🎨 Grafana"
      description: "Dashboards"
      icon: "grafana.png"
      url: "https://grafana.com/docs"
      target: _blank
      group: "Recursos"
    
    - name: "🔗 Tailscale"
      description: "VPN privada"
      icon: "tailscale.png"
      url: "https://tailscale.com/kb"
      target: _blank
      group: "Recursos"
    
    - name: "☁️ Cloudflare"
      description: "Túnel y DNS"
      icon: "cloudflare.png"
      url: "https://developers.cloudflare.com/cloudflare-one"
      target: _blank
      group: "Recursos"
    
    - name: "🏠 Proxmox"
      description: "Virtualización"
      icon: "proxmox.png"
      url: "https://pve.proxmox.com/wiki"
      target: _blank
      group: "Recursos"
    
    - name: "💾 TrueNAS"
      description: "Almacenamiento"
      icon: "truenas.png"
      url: "https://www.truenas.com/docs"
      target: _blank
      group: "Recursos"
