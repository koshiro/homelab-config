---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prowlarr-egress
  namespace: prowlarr
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes:
  - Egress
  egress:
  # DNS (temporalmente permitir a cualquier destino)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permitir conexión a Sonarr (Service 80 y puerto nativo 8989)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarr
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8989
  # Permitir conexión a Radarr (Service 80 y puerto nativo 7878)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: radarr
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 7878
  # Permitir conexión a qBittorrent
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: qbittorrent
    ports:
    - protocol: TCP
      port: 8080
  # FlareSolverr (bypass protección Cloudflare en indexers)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: flaresolverr
    ports:
    - protocol: TCP
      port: 8191
  # Permitir conexiones HTTP/HTTPS externas
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
