apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library-prowlarr-pv
  labels:
    pv-name: media-library-prowlarr-pv
    app.kubernetes.io/component: storage
    app.kubernetes.io/name: media-library
spec:
  capacity:
    storage: 9Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.100
    path: "/mnt/homelab-storage/k8s-media-library"
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.2
    - noatime
    - nodiratime
    - rsize=1048576
    - wsize=1048576
    - tcp
    - nconnect=8



