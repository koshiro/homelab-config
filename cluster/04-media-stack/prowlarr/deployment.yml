apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
  labels:
    app: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values:
                - "true"
      containers:
      - name: prowlarr
        image: linuxserver/prowlarr
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 9696
        volumeMounts:
        - name: config
          mountPath: /config
        - name: shared-storage
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: shared-storage
        hostPath:
          path: /mnt/homelab-storage
          type: DirectoryOrCreate
