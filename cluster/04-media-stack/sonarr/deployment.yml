apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: sonarr
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values:
                - "true"
      initContainers:
      - name: setup-hardlinks
        image: alpine:3.20
        command: ["sh", "/init/setup-hardlinks.sh"]
        volumeMounts:
        - name: shared-storage
          mountPath: /data
        - name: hardlink-init
          mountPath: /init
      containers:
      - name: sonarr
        image: linuxserver/sonarr
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8989
        volumeMounts:
        - name: config
          mountPath: /config
        - name: shared-storage
          mountPath: /data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config-pvc
      - name: shared-storage
        hostPath:
          path: /mnt/homelab-storage
          type: DirectoryOrCreate
      - name: hardlink-init
        configMap:
          name: sonarr-hardlink-init
          defaultMode: 0755
