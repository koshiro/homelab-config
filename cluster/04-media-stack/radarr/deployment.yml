apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values:
                - "true"
      initContainers:
      - name: setup-hardlinks
        image: alpine:3.20
        command: ["sh", "/init/init-storage.sh"]
        volumeMounts:
        - name: shared-storage
          mountPath: /data
        - name: init-scripts
          mountPath: /init
      containers:
      - name: radarr
        image: linuxserver/radarr
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 7878
        volumeMounts:
        - name: config
          mountPath: /config
        - name: shared-storage
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /
            port: 7878
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 7878
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      - name: shared-storage
        hostPath:
          path: /mnt/homelab-storage
          type: DirectoryOrCreate
      - name: init-scripts
        configMap:
          name: radarr-init
          defaultMode: 0755
