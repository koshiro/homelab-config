# WebUI por LAN/tailnet: http://k3s-node-0:30808
# Público: https://qbittorrent.danielriquelme.cl (Cloudflare Access, app «Homelab admin»)
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-webui
  namespace: qbittorrent
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: webui
    nodePort: 30808
  selector:
    app: qbittorrent
