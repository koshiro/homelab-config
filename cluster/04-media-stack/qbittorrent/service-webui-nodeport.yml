# WebUI solo por LAN/tailnet (sin Ingress público): http://k3s-node-0:30808
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-webui
  namespace: qbittorrent
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: webui
    nodePort: 30808
  selector:
    app: qbittorrent
