apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values:
                - "true"
      initContainers:
      - name: setup-qbittorrent-unified
        image: alpine:3.20
        command:
        - sh
        - -c
        - |
          echo "Creando directorios para qBittorrent..."
          mkdir -p /data/downloads/completed /data/downloads/incomplete
          mkdir -p /config/qBittorrent
          # Límite de seeding: ratio 2, 2 días seedeando o 2 días inactivo (lo primero).
          # El de inactividad cubre los completos en queuedUP, que nunca acumulan
          # tiempo de seeding. Al detenerse, Radarr/Sonarr (removeCompletedDownloads)
          # borran el torrent y su hardlink en downloads/, así borrar de la biblioteca
          # libera el espacio de verdad. Stop y no Remove: si el *arr no importó, se
          # queda detenido en vez de perder los archivos.
          CFG=/config/qBittorrent/qBittorrent.conf
          touch "$CFG"
          grep -q '^\[BitTorrent\]' "$CFG" || printf '[BitTorrent]\n' >> "$CFG"
          set_session() {
            if grep -q "^Session.$1=" "$CFG"; then
              sed -i "s|^Session.$1=.*|Session\\\\$1=$2|" "$CFG"
            else
              sed -i "/^\[BitTorrent\]/a Session\\\\$1=$2" "$CFG"
            fi
          }
          set_session GlobalMaxRatio 2
          set_session GlobalMaxSeedingMinutes 2880
          set_session GlobalMaxInactiveSeedingMinutes 2880
          set_session ShareLimitAction Stop
          # Cola: MaxActiveTorrents es el active_limit de libtorrent, un tope duro que
          # también cuenta los torrents lentos/stalled. Con 10, unos pocos torrents sin
          # seeds tapaban la cola entera; IgnoreSlowTorrentsForQueueing solo libera los
          # cupos por tipo (descargas/subidas), no este.
          set_session MaxActiveTorrents 50
          set_session MaxActiveDownloads 10
          set_session MaxActiveUploads 5
          # Escucha BT en 6881 (hostPort en el nodo media-worker). Sin puerto
          # aleatorio para que el reenvío del router coincida con lo anunciado.
          set_session Port 6881
          # Incompletos en /incomplete (pool scratch de pve, stripe de 2 HDD): las
          # escrituras aleatorias de piezas no pegan al HDD de la biblioteca. Al
          # terminar, qBittorrent copia el archivo a /data/downloads (otro pool,
          # escritura secuencial) y *arr hace hardlink desde ahí. Solo afecta a
          # torrents nuevos: los existentes conservan su ruta.
          set_session TempPathEnabled true
          set_session TempPath /incomplete/
          # No bajar ejecutables ni accesos directos (malware disfrazado de episodio o
          # película): quedan con prioridad 0. El CronJob arr-filtro-archivos además
          # saca esos torrents de Sonarr/Radarr con blocklist para que busquen otro.
          # ExcludedFileNamesEnabled va sin el prefijo Session\ en qBittorrent 5.x.
          set_session ExcludedFileNames '*.exe, *.scr, *.bat, *.cmd, *.com, *.pif, *.lnk, *.msi, *.vbs, *.vbe, *.js, *.jse, *.wsf, *.wsh, *.hta, *.ps1, *.cpl, *.jar, *.dll, *.apk, *.url'
          if grep -q '^ExcludedFileNamesEnabled=' "$CFG"; then
            sed -i 's|^ExcludedFileNamesEnabled=.*|ExcludedFileNamesEnabled=true|' "$CFG"
          else
            sed -i '/^\[BitTorrent\]/a ExcludedFileNamesEnabled=true' "$CFG"
          fi
          # WebUI sin login para la red de pods: el público llega vía Traefik
          # (ya filtrado por Cloudflare Access) y los *arr hablan directo.
          # Ojo: networkpolicy.yml no está aplicado; en el cluster rige
          # allow-arr-suite-communication (namespaces arr-suite + kube-system).
          grep -q '^\[Preferences\]' "$CFG" || printf '[Preferences]\n' >> "$CFG"
          set_webui() {
            if grep -q "^WebUI.$1=" "$CFG"; then
              sed -i "s|^WebUI.$1=.*|WebUI\\\\$1=$2|" "$CFG"
            else
              sed -i "/^\[Preferences\]/a WebUI\\\\$1=$2" "$CFG"
            fi
          }
          set_webui AuthSubnetWhitelistEnabled true
          set_webui AuthSubnetWhitelist 10.42.0.0/16
          echo "Asegurando permisos..."
          # No chown -R en downloads/: en NFS recorre cientos de GB y el init no termina.
          chown 1000:1000 /data/downloads /data/downloads/completed /data/downloads/incomplete
          chown -R 1000:1000 /config/qBittorrent
        volumeMounts:
        - name: media-library
          mountPath: /data
        - name: media-library
          mountPath: /config
          subPath: config/qbittorrent
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: WEBUI_PORT
          value: "8080"
        - name: XDG_CONFIG_HOME
          value: "/data/config/qbittorrent"
        # Cola y datos de reanudación (BT_backup): sin esto quedaban dentro del contenedor y se perdían al reiniciar
        - name: XDG_DATA_HOME
          value: "/data/config/qbittorrent/data"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          hostPort: 6881
          name: bt-tcp
          protocol: TCP
        - containerPort: 6881
          hostPort: 6881
          name: bt-udp
          protocol: UDP
        volumeMounts:
        - name: media-library
          mountPath: /data
        - name: scratch
          mountPath: /incomplete
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
      volumes:
      - name: media-library
        persistentVolumeClaim:
          claimName: media-library-pvc
      - name: scratch
        persistentVolumeClaim:
          claimName: qbittorrent-scratch-pvc
      tolerations:
      - key: p2p
        operator: Equal
        value: "true"
        effect: NoSchedule

