# BitTorrent en LAN/WAN: el pod publica 6881 con hostPort en k3s-node-1
# (192.168.1.131). Este NodePort queda de respaldo si el router aún reenvía
# 31681/31682; el reenvío correcto es WAN 6881/tcp+udp → 192.168.1.131:6881.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  namespace: qbittorrent
spec:
  type: NodePort
  ports:
  - port: 6881
    targetPort: 6881
    protocol: TCP
    name: bt-tcp
    nodePort: 31681
  - port: 6881
    targetPort: 6881
    protocol: UDP
    name: bt-udp
    nodePort: 31682
  selector:
    app: qbittorrent

