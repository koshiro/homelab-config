apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  namespace: qbittorrent
spec:
  type: NodePort
  ports:
  - port: 6881
    targetPort: 6881
    protocol: TCP
    name: bt-tcp
    nodePort: 31681
  - port: 6881
    targetPort: 6881
    protocol: UDP
    name: bt-udp
    nodePort: 31682
  selector:
    app: qbittorrent

