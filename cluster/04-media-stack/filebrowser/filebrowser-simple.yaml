apiVersion: v1
kind: Pod
metadata:
  name: filebrowser-admin
  namespace: media-stack
  labels:
    app: filebrowser
spec:
  restartPolicy: Always
  containers:
  - name: filebrowser
    image: filebrowser/filebrowser:latest
    env:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: "Etc/UTC"
    - name: FB_ROOT
      value: "/data"
    - name: FB_PORT
      value: "8080"
    - name: FB_ADDRESS
      value: "0.0.0.0"
    - name: FB_DATABASE
      value: "/data/.filebrowser.db"
    - name: FB_LOG
      value: "/data/.filebrowser.log"
    ports:
    - containerPort: 8080
      name: webui
    volumeMounts:
    - name: media-library
      mountPath: /data
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  volumes:
  - name: media-library
    nfs:
      server: 192.168.1.20
      path: "/mnt/homelab-storage/k8s-media-library"
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: media-stack
  labels:
    app: filebrowser
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: webui
  selector:
    app: filebrowser
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser
  namespace: media-stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: filebrowser.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: filebrowser
            port:
              number: 8080
