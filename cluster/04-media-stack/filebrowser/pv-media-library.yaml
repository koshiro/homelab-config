apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library-filebrowser-pv
  labels:
    pv-name: media-library-filebrowser-pv
spec:
  capacity:
    storage: 9Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.20
    path: "/mnt/homelab-storage/k8s-media-library"
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.2
    - noatime
    - nodiratime
    - rsize=1048576
    - wsize=1048576
    - tcp
    - nconnect=8
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library-pvc
  namespace: media-stack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 9Ti
  volumeName: media-library-pv
