apiVersion: v1
kind: Pod
metadata:
  name: filebrowser-truenas-root
  namespace: media-stack
  labels:
    app: filebrowser-truenas
spec:
  restartPolicy: Always
  containers:
  - name: filebrowser
    image: filebrowser/filebrowser:latest
    env:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: TZ
      value: "Etc/UTC"
    - name: FB_ROOT
      value: "/data"
    - name: FB_PORT
      value: "8081"
    - name: FB_ADDRESS
      value: "0.0.0.0"
    - name: FB_DATABASE
      value: "/data/.filebrowser-truenas.db"
    - name: FB_LOG
      value: "/data/.filebrowser-truenas.log"
    ports:
    - containerPort: 8081
      name: webui
    volumeMounts:
    - name: truenas-root
      mountPath: /data
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  volumes:
  - name: truenas-root
    nfs:
      server: 192.168.1.20
      path: "/mnt/homelab-storage"
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser-truenas
  namespace: media-stack
  labels:
    app: filebrowser-truenas
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: webui
  selector:
    app: filebrowser-truenas
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser-truenas
  namespace: media-stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: truenas.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: filebrowser-truenas
            port:
              number: 8081

