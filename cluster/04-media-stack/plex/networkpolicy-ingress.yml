apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plex-ingress
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
  - Ingress
  ingress:
  # Allow ingress from cloudflared for external access
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudflared
  # Allow ingress from the *arr suite and Overseerr for internal management
  - from:
    - namespaceSelector:
        matchLabels:
          arr-suite: "true"
  # Allow ingress from default namespace for testing
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
