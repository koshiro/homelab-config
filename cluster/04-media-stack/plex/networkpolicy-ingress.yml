apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plex-ingress
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
  - Ingress
  ingress:
  # Allow ingress from cloudflared for external access
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudflared
  # Allow ingress from the *arr suite and Overseerr for internal management
  - from:
    - namespaceSelector:
        matchLabels:
          arr-suite: "true"
  # Allow ingress from default namespace for testing
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
  # Allow ingress from local network (NodePort access)
  - from:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 32400
  # Allow ingress from cluster nodes (required for NodePort)
  - from:
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - protocol: TCP
      port: 32400
  - from:
    - ipBlock:
        cidr: 10.43.0.0/16
    ports:
    - protocol: TCP
      port: 32400
