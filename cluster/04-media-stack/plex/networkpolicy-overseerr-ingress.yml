---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-overseerr-ingress
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: overseerr
    ports:
    - protocol: TCP
      port: 32400
