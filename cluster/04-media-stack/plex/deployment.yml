apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/media-worker
                operator: In
                values:
                - "true"
      containers:
      - name: plex
        image: lscr.io/linuxserver/plex:latest
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Santiago"
        - name: VERSION
          value: "docker"
        - name: PLEX_CLAIM
          value: ""
        - name: ADVERTISE_IP
          value: "https://plex.danielriquelme.cl"
        - name: PLEX_ANNOUNCE_SERVER
          value: "https://plex.danielriquelme.cl"
        - name: PLEX_ANNOUNCE_SERVER_ENABLED
          value: "true"
        - name: PLEX_ANNOUNCE_SERVER_DISCOVERY
          value: "true"
        - name: PLEX_ANNOUNCE_SERVER_ANNOUNCE
          value: "true"
        - name: PLEX_ANNOUNCE_SERVER_ANNOUNCE_IP
          value: "https://plex.danielriquelme.cl"
        - name: PLEX_ANNOUNCE_SERVER_ANNOUNCE_PORT
          value: "443"
        - name: PLEX_ANNOUNCE_SERVER_ANNOUNCE_HTTPS
          value: "true"
        ports:
        - containerPort: 32400
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        - name: shared-storage
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: plex-config-pvc
      - name: shared-storage
        hostPath:
          path: /mnt/homelab-storage
          type: DirectoryOrCreate
