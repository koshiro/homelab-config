---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-plex-egress
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
  - Egress
  egress:
  # DNS a cualquier servidor DNS
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # HTTP/HTTPS a internet (incluyendo plex.tv); 9001 = API HTTP de AniDB (api.anidb.net), que usa el agente HAMA
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 9001
  # Permitir comunicación con otros servicios en cluster (sin "to": cualquier destino; "to: []" da drift en k3s 1.35)
  - ports:
    - protocol: TCP
      port: 32400
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8989
    - protocol: TCP
      port: 7878
