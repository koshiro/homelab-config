apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dlna-discovery
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 239.0.0.0/8
      ports:
        - protocol: UDP
          port: 1900
