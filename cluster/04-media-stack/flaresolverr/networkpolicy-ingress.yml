apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prowlarr-ingress
  namespace: flaresolverr
spec:
  podSelector:
    matchLabels:
      app: flaresolverr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
      ports:
        - protocol: TCP
          port: 8191
