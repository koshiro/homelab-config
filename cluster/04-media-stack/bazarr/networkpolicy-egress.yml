---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bazarr-egress
  namespace: bazarr
spec:
  podSelector:
    matchLabels:
      app: bazarr
  policyTypes:
  - Egress
  egress:
  # DNS (temporalmente permitir a cualquier destino)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permitir conexión a Sonarr
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sonarr
    ports:
    - protocol: TCP
      port: 8989
  # Permitir conexión a Radarr
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: radarr
    ports:
    - protocol: TCP
      port: 7878
  # Permitir conexiones HTTP/HTTPS externas
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
