apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr-ingress
  namespace: bazarr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: bazarr.danielriquelme.cl
    http:
      paths:
      - backend:
          service:
            name: bazarr
            port:
              number: 80
        path: /
        pathType: Prefix
