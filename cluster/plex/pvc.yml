# /cluster/plex/pvc.yml
# Solicita almacenamiento persistente para la configuración de Plex.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi # Plex puede generar muchos metadatos
  storageClassName: local-path

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.20
    path: /mnt/homelab-storage/media

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  volumeName: plex-media-pv
  resources:
    requests:
      storage: 1Ti
