---
# NetworkPolicy de Ingress para Plex - Permitir tráfico desde todos los servicios *arr
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-ingress
  namespace: plex
spec:
  podSelector:
    matchLabels:
      app: plex
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: sonarr
    - namespaceSelector:
        matchLabels:
          name: radarr
    - namespaceSelector:
        matchLabels:
          name: prowlarr
    - namespaceSelector:
        matchLabels:
          name: bazarr
    - namespaceSelector:
        matchLabels:
          name: overseerr
    ports:
    - protocol: TCP
      port: 32400
