apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plex
resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ingress.yml
  - networkpolicy-deny.yml
  - networkpolicy-ingress.yml
  - networkpolicy-dlna.yml
  - networkpolicy-overseerr-ingress.yml
  - networkpolicy-egress.yml

# Configuración para la sustitución de variables
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        postBuild:
          substitute:
            DOMAIN_NAME: ${DOMAIN_NAME}
          substituteFrom:
            - kind: ConfigMap
              name: cluster-vars
    target:
      kind: Kustomization
      name: plex