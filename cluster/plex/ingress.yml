# /cluster/plex/ingress.yml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex
  namespace: plex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/custom-request-headers: |
      X-Forwarded-Proto:https
      X-Forwarded-Host: plex.danielriquelme.cl
      X-Forwarded-Port: "443"
spec:
  ingressClassName: traefik
  rules:
    - host: plex.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plex
                port:
                  number: 32400
  # sin TLS; Cloudflare termina HTTPS
