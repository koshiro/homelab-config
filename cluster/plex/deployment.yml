apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: Recreate # Plex no soporta múltiples instancias corriendo simultáneamente
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      # runtimeClassName: nvidia # Habilita el uso de la GPU NVIDIA
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:latest
          ports:
            - containerPort: 32400
              name: http
            - containerPort: 1900
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Santiago"
            - name: VERSION
              value: "docker"
            # - name: NVIDIA_VISIBLE_DEVICES # Se activa con el runtimeClassName
            #   value: all
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        # Este volumen asume que el recurso compartido NFS de TrueNAS
        # está montado en todos los nodos de k3s en /mnt/pool_medios
        - name: media
          hostPath:
            path: /mnt/pool_medios
            type: Directory
