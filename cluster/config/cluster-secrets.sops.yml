# cluster/config/cluster-secrets.sops.yml
# Este fichero está cifrado con SOPS.
# Para editarlo: sops cluster/config/cluster-secrets.sops.yml
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
stringData:
  # Cloudflare
  CLOUDFLARE_API_TOKEN: "{{ cloudflare_api_token }}"
  # Gitea Postgres (inyectado por Ansible/SOPS)
  GITEA_POSTGRES_PASSWORD: "{{ gitea_postgres_password }}"
  GITEA_POSTGRES_USER: "{{ gitea_postgres_user | default('gitea') }}"
  GITEA_POSTGRES_DB: "{{ gitea_postgres_db | default('gitea') }}"
