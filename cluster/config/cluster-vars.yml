# /cluster/config/cluster-vars.yml
# Fuente única de la verdad para las variables de configuración del clúster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system # Disponible globalmente para Flux
data:
  # === Dominios y URLs ===
  DOMAIN_NAME: "homelab.lan" # Reemplazar con tu dominio real
  GITEA_DOMAIN: "gitea.homelab.lan"
  GITEA_REPO_URL: "ssh://git@gitea.gitea.svc.cluster.local:22/daniel/homelab-config.git"

  # === Cloudflare ===
  CLOUDFLARE_ACCOUNT_TAG: "REEMPLAZAR_CON_ACCOUNT_TAG"
  CLOUDFLARE_TUNNEL_ID: "REEMPLAZAR_CON_TUNNEL_ID"
  CLOUDFLARE_TUNNEL_SECRET: "REEMPLAZAR_CON_TUNNEL_SECRET"
  CLOUDFLARE_API_EMAIL: "daniel.pradov@gmail.com"
