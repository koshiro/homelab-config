# cluster/config/cluster-settings.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system # Disponible para todo el clúster
data:
  # Red
  NETWORK_GATEWAY: "{{ network_gateway }}"
  NETWORK_CIDR: "{{ network_cidr }}"

  # TrueNAS
  TRUENAS_HOST: "{{ truenas_host }}"
  TRUENAS_DATA_POOL: "{{ truenas_data_pool }}"

  # GitOps
  GITOPS_REPO_URL: "{{ gitops_repo_url }}"
  GITOPS_REPO_BRANCH: "{{ gitops_repo_branch }}"
