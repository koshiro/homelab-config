apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-migrate-to-nvme
  namespace: gitea
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rsync
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          args:
            - |
              apk add --no-cache rsync && \
              rsync -aHAX --delete /olddata/ /newdata/
          volumeMounts:
            - name: old
              mountPath: /olddata
            - name: new
              mountPath: /newdata
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: gitea-data-pvc
        - name: new
          persistentVolumeClaim:
            claimName: gitea-data-nvme-pvc
