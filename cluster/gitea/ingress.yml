apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    # Configuración para Cloudflare Tunnel vía HTTP
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Configuración de seguridad
    traefik.ingress.kubernetes.io/headers-frame-deny: "true"
    traefik.ingress.kubernetes.io/headers-browser-xss-filter: "true"
    traefik.ingress.kubernetes.io/headers-content-type-nosniff: "true"
    traefik.ingress.kubernetes.io/headers-referrer-policy: "strict-origin-when-cross-origin"
    # Configuración de rate limiting
    traefik.ingress.kubernetes.io/rate-limit-average: "100"
    traefik.ingress.kubernetes.io/rate-limit-burst: "200"
spec:
  ingressClassName: traefik
  rules:
  - host: gitea.danielriquelme.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitea
            port:
              number: 80
