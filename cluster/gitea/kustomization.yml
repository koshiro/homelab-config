# /cluster/gitea/kustomization.yml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea
resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ingress.yml

# Configuración para que FluxCD sustituya las variables
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        postBuild:
          substitute:
            GITEA_DOMAIN: ${GITEA_DOMAIN}
          substituteFrom:
            - kind: ConfigMap
              name: cluster-vars
    target:
      kind: Kustomization
      name: gitea
