apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.22.3
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secret
                  key: POSTGRES_USER
            - name: GITEA__database__NAME
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/gitea/app.ini
              subPath: app.ini
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data-nvme-pvc
        - name: config
          configMap:
            name: gitea-app-ini
