apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingvin-ingress
  namespace: pingvin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: pingvin.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pingvin
                port:
                  number: 3000
