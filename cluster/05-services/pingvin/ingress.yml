# pingvin.lan: acceso LAN directo a Traefik vía /etc/hosts (192.168.1.131), igual que comfyui.lan;
# el túnel solo recibe *.danielriquelme.cl, así que no es alcanzable desde internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingvin-ingress
  namespace: pingvin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: pingvin.danielriquelme.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pingvin
                port:
                  number: 3000
    - host: pingvin.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pingvin
                port:
                  number: 3000
