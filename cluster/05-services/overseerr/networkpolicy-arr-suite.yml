apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-suite-communication
  namespace: overseerr
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          arr-suite: 'true'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-egress
  namespace: overseerr
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
  podSelector: {}
  policyTypes:
  - Egress
