apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: overseerr-ingress
  namespace: overseerr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: '10'
spec:
  # Seerr (ex Overseerr): dominio nuevo y el antiguo
  ingressClassName: traefik
  rules:
  - host: overseerr.danielriquelme.cl
    http:
      paths:
      - backend:
          service:
            name: overseerr
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: seerr.danielriquelme.cl
    http:
      paths:
      - backend:
          service:
            name: overseerr
            port:
              number: 80
        path: /
        pathType: Prefix
