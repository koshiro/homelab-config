# Seerr (sucesor de Overseerr, archivado en 2026-02; migrado el 2026-10-03). Se conservan los nombres
# de Kubernetes y el dominio overseerr.danielriquelme.cl. Seerr migra solo la BD y settings.json de
# Overseerr en el primer arranque. Respaldo previo: nvme/k8s/backups/overseerr/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: overseerr
  labels:
    app: overseerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: overseerr
  strategy:
    type: Recreate  # PVC local-path RWO y BD SQLite: nunca dos instancias a la vez
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      # La imagen oficial corre como el usuario node (UID 1000) y no trae init
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - env:
        - name: TZ
          value: America/Santiago
        - name: LOG_LEVEL
          value: info
        image: ghcr.io/seerr-team/seerr:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          initialDelaySeconds: 120
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 5055
          timeoutSeconds: 5
        name: overseerr
        ports:
        - containerPort: 5055
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          httpGet:
            path: /api/v1/settings/public
            port: 5055
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /app/config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: overseerr-config
