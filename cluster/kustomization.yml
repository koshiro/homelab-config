# SERVICIOS ACTIVOS: plex, sonarr, radarr, prowlarr, bazarr, overseerr, qbittorrent, traefik, cloudflared
# PENDIENTES: transmission (no desplegado), arr-networkpolicies (aplicadas manualmente)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config
  # --- INFRA ---
  - infra/nfs-csi-driver
  # - infra/nvidia-device-plugin.yml  # Archivo no existe
  - infra/nvidia-runtimeclass.yml
  # - traefik # Gestionado fuera de ArgoCD por ahora
  - cloudflared
  - truenas
  - tailscale
  # --- AUTH ---
  - authelia
  # --- APPS ---
  - plex
  - sonarr
  - radarr
  - prowlarr
  - bazarr
  - overseerr
  - qbittorrent
  - timemachine-smb # Desplegando Time Machine con Samba
  # - timemachine # Eliminado - Reemplazado por la versión Samba
  # - transmission  # NO DESPLEGADO - Comentado para evitar errores
  - pingvin
  # - palmr  # eliminado
  - forge  # Forge - Generador de imágenes con IA
  - immich # Immich - Servidor de fotos