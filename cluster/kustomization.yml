# /cluster/kustomization.yml
# Este es el plano maestro para todo el clúster.
# FluxCD leerá este archivo para desplegar todo lo demás.
# 
# ESTADO ACTUAL: Cluster funcionando manualmente, migrando a GitOps
# SERVICIOS ACTIVOS: gitea, plex, sonarr, radarr, prowlarr, bazarr, overseerr, qbittorrent, traefik, cloudflared
# PENDIENTES: transmission (no desplegado), arr-networkpolicies (aplicadas manualmente)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config
  - flux-system
  # --- INFRA ---
  - infra/nvidia-device-plugin
  - infra/nfs-csi-driver # Gestionado fuera de Flux por ahora
  # - traefik # Gestionado fuera de Flux por ahora
  - cloudflared
  # --- APPS ---
  - gitea
  - plex
  - sonarr
  - radarr
  - prowlarr
  - bazarr
  - overseerr
  # - transmission  # NO DESPLEGADO - Comentado para evitar errores
