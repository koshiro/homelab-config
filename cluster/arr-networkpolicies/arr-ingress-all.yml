---
# NetworkPolicy de Ingress para Sonarr - Permitir tráfico desde todos los servicios *arr
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-ingress
  namespace: sonarr
spec:
  podSelector:
    matchLabels:
      app: sonarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: radarr
    - namespaceSelector:
        matchLabels:
          name: prowlarr
    - namespaceSelector:
        matchLabels:
          name: bazarr
    - namespaceSelector:
        matchLabels:
          name: overseerr
    ports:
    - protocol: TCP
      port: 8989

