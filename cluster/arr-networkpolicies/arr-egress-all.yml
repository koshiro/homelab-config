---
# NetworkPolicy para Sonarr - Permitir comunicación con todos los servicios *arr
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-communication
  namespace: sonarr
spec:
  podSelector:
    matchLabels:
      app: sonarr
  policyTypes:
  - Egress
  egress:
  # Permitir DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permitir comunicación con todos los servicios *arr
  - to:
    - namespaceSelector:
        matchLabels:
          name: radarr
    ports:
    - protocol: TCP
      port: 7878
  - to:
    - namespaceSelector:
        matchLabels:
          name: prowlarr
    ports:
    - protocol: TCP
      port: 9696
  - to:
    - namespaceSelector:
        matchLabels:
          name: bazarr
    ports:
    - protocol: TCP
      port: 6767
  - to:
    - namespaceSelector:
        matchLabels:
          name: overseerr
    ports:
    - protocol: TCP
      port: 5055
  # Permitir conexión a qBittorrent
  - to:
    - namespaceSelector:
        matchLabels:
          name: qbittorrent
    ports:
    - protocol: TCP
      port: 8080
  # Permitir conexiones HTTP/HTTPS externas
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443

