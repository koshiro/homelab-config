apiVersion: batch/v1
kind: Job
metadata:
  name: mount-qbittorrent-nfs-node2
  namespace: qbittorrent
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-node-2
      restartPolicy: OnFailure
      containers:
        - name: mounter
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["sh", "-lc"]
          args:
            - |
              set -e
              apk add --no-cache nfs-utils
              mkdir -p /host/mnt/qbittorrent-downloads
              mount -t nfs4 -o vers=4.2,noatime 192.168.1.20:/mnt/homelab-ssd/qbittorrent /host/mnt/qbittorrent-downloads || true
              chown -R 1000:1000 /host/mnt/qbittorrent-downloads || true
              echo OK
          volumeMounts:
            - name: host-mnt
              mountPath: /host/mnt
      volumes:
        - name: host-mnt
          hostPath:
            path: /mnt
            type: Directory
