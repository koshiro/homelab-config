      share: /mnt/tank/immich/upload
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs-csi
  volumeName: immich-library-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
