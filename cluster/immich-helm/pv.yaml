apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
  labels:
    type: nfs
    app: immich
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions:
    - hard
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: immich-library-pv
    volumeAttributes:
      server: 192.168.1.10
      share: /mnt/tank/immich/library
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-upload-pv
  labels:
    type: nfs
    app: immich
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions:
    - hard
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    volumeHandle: immich-upload-pv
    volumeAttributes:
