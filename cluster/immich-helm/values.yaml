# Valores personalizados para el Helm Chart de Immich

# Configuración de Immich
immich:
  persistence:
    library:
      existingClaim: "immich-library-pvc"
    upload:
      existingClaim: "immich-upload-pvc"
  database:
    type: "postgresql"
    hostname: "immich-db"
    port: 5432
    username: "postgres"
    password: "immich-postgres-password"
    database: "immich"

# Configuración global
global:
  # Habilitar o deshabilitar componentes
  enableMachineLearning: true
  # Configuración de almacenamiento
  storageClass: "nfs-csi" # StorageClass para volúmenes persistentes
  # Configuración de red
  ingress:
    enabled: false # Deshabilitamos el ingress del chart, usamos el nuestro

# Configuración del servidor
server:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: release
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    REDIS_HOSTNAME: "immich-redis"
    DB_HOSTNAME: "immich-db"
    DB_USERNAME: "postgres"
    DB_PASSWORD: "immich-postgres-password"
    DB_DATABASE_NAME: "immich"

# Configuración del microservicio
microservices:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: release
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    REDIS_HOSTNAME: "immich-redis"
    DB_HOSTNAME: "immich-db"
    DB_USERNAME: "postgres"
    DB_PASSWORD: "immich-postgres-password"
    DB_DATABASE_NAME: "immich"

# Configuración del componente web
web:
  enabled: false # Deshabilitamos el componente web del chart, usamos el nuestro

# Configuración de la base de datos
postgresql:
  enabled: false # Desactivamos el subchart de PostgreSQL ya que está deprecado

# Configuración de Redis
redis:
  enabled: false # Usamos el Redis existente

# Configuración de Machine Learning
machinelearning:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: release
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  env:
    REDIS_HOSTNAME: "immich-redis"

# Configuración de NetworkPolicy
networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP