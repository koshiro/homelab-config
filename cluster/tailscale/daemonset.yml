apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale-nodes
  namespace: tailscale
spec:
  selector:
    matchLabels:
      app: tailscale-nodes
  template:
    metadata:
      labels:
        app: tailscale-nodes
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tailscale
          image: tailscale/tailscale:stable
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tailscale-run
              mountPath: /var/run/tailscale
          args:
            - /bin/sh
            - -c
            - >-
              tailscaled --state=/var/lib/tailscale/tailscaled.state &
              sleep 2 &&
              tailscale up --auth-key="${TS_AUTHKEY}" --ssh=true --accept-dns=false --hostname="${NODE_NAME}-k3s" --reset &&
              tail -f /dev/null
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscale-state
          hostPath:
            path: /var/lib/tailscale
            type: DirectoryOrCreate
        - name: tailscale-run
          hostPath:
            path: /var/run/tailscale
            type: DirectoryOrCreate

