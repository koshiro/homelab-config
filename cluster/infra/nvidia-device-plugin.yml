apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: nvidia-device-plugin
  labels:
    app: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.16.2
          name: nvidia-device-plugin-ctr
          imagePullPolicy: IfNotPresent
          args: ["--fail-on-init-error=false", "--device-list-strategy=envvar", "--device-discovery-strategy=nvml", "--nvidia-driver-root=/driver-root"]
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev-directory
              mountPath: /dev
            - name: host-usr
              mountPath: /driver-root/usr
              readOnly: true
            - name: host-lib
              mountPath: /driver-root/lib
              readOnly: true
            - name: host-lib64
              mountPath: /driver-root/lib64
              readOnly: true
      priorityClassName: "system-node-critical"
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev-directory
          hostPath:
            path: /dev
        - name: host-usr
          hostPath:
            path: /usr
        - name: host-lib
          hostPath:
            path: /lib
        - name: host-lib64
          hostPath:
            path: /lib64
