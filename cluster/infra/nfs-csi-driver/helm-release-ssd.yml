apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner-ssd
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.0.18"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cluster-settings
      valuesKey: TRUENAS_HOST
      targetPath: nfs.server
  values:
    nfs:
      path: /mnt/homelab-ssd  # Ruta absoluta para el almacenamiento SSD
    storageClass:
      name: nfs-ssd
      defaultClass: false
      provisionerName: k8s-sigs.io/nfs-subdir-external-provisioner-ssd

