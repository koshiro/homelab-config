apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command: ['sh', '-c', 'until pg_isready -h immich-db -U postgres; do sleep 2; done;']
        - name: wait-for-redis
          image: redis:7-alpine
          command: ['sh', '-c', 'until redis-cli -h immich-redis ping; do sleep 2; done;']
        - name: init-folders
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /usr/src/app/upload/encoded-video
              mkdir -p /usr/src/app/upload/profile
              mkdir -p /usr/src/app/upload/library
              mkdir -p /usr/src/app/upload/thumbs
              mkdir -p /usr/src/app/upload/backups
              mkdir -p /usr/src/app/upload/upload
              
              mkdir -p /usr/src/app/library
              mkdir -p /usr/src/app/config
              
              # Crear archivos .immich para verificación de integridad
              touch /usr/src/app/upload/encoded-video/.immich
              touch /usr/src/app/upload/profile/.immich
              touch /usr/src/app/upload/library/.immich
              touch /usr/src/app/upload/thumbs/.immich
              touch /usr/src/app/upload/backups/.immich
              touch /usr/src/app/upload/upload/.immich
              touch /usr/src/app/library/.immich
              
              echo "Directorios y archivos .immich creados correctamente"
              ls -la /usr/src/app/upload
              ls -la /usr/src/app/upload/encoded-video
              ls -la /usr/src/app/upload/upload
              ls -la /usr/src/app/library
              
              # Asegurar permisos adecuados
              chown -R 1000:1000 /usr/src/app/upload
              chown -R 1000:1000 /usr/src/app/library
              chown -R 1000:1000 /usr/src/app/config
              chmod -R 755 /usr/src/app/upload
              chmod -R 755 /usr/src/app/library
              chmod -R 755 /usr/src/app/config
          volumeMounts:
            - name: immich-upload
              mountPath: /usr/src/app/upload
            - name: immich-library
              mountPath: /usr/src/app/library
            - name: immich-config
              mountPath: /usr/src/app/config
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: IMMICH_NODE_ENV
              value: "production"
            - name: DB_HOSTNAME
              value: "immich-db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PASSWORD
              value: ""
            - name: UPLOAD_LOCATION
              value: "/usr/src/app/upload"
            - name: LIBRARY_LOCATION
              value: "/usr/src/app/library"
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: immich-config
              mountPath: /usr/src/app/config
            - name: immich-library
              mountPath: /usr/src/app/library
            - name: immich-upload
              mountPath: /usr/src/app/upload
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /server-info/ping
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /server-info/ping
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: immich-config
          emptyDir: {}
        - name: immich-library
          emptyDir: {}
        - name: immich-upload
          emptyDir: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-microservices
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-microservices
  template:
    metadata:
      labels:
        app: immich-microservices
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.9.1
          command: ['sh', '-c', 'until curl -s http://immich-server:3001/server-info/ping; do sleep 5; echo "Waiting for server..."; done;']
      containers:
        - name: immich-microservices
          image: ghcr.io/immich-app/immich-server:release
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          args: ["start.sh", "microservices"]
          env:
            - name: IMMICH_NODE_ENV
              value: "production"
            - name: DB_HOSTNAME
              value: "immich-db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PASSWORD
              value: ""
            - name: UPLOAD_LOCATION
              value: "/usr/src/app/upload"
            - name: LIBRARY_LOCATION
              value: "/usr/src/app/library"
          volumeMounts:
            - name: immich-config
              mountPath: /usr/src/app/config
            - name: immich-library
              mountPath: /usr/src/app/library
            - name: immich-upload
              mountPath: /usr/src/app/upload
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 1Gi
      volumes:
        - name: immich-config
          emptyDir: {}
        - name: immich-library
          emptyDir: {}
        - name: immich-upload
          emptyDir: {}
