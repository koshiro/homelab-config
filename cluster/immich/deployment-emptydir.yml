apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command: ['sh', '-c', 'until pg_isready -h immich-db -U postgres; do sleep 2; done;']
        - name: wait-for-redis
          image: redis:7-alpine
          command: ['sh', '-c', 'until redis-cli -h immich-redis ping; do sleep 2; done;']
        - name: init-folders
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /mnt/upload/encoded-video
              mkdir -p /mnt/upload/profile
              mkdir -p /mnt/upload/library
              mkdir -p /mnt/upload/thumbs
              mkdir -p /mnt/upload/backups
              
              mkdir -p /mnt/library
              
              echo "Directorios creados correctamente"
              ls -la /mnt/upload
              ls -la /mnt/library
          volumeMounts:
            - name: immich-upload
              mountPath: /mnt/upload
            - name: immich-library
              mountPath: /mnt/library
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          env:
            - name: IMMICH_NODE_ENV
              value: "production"
            - name: DB_HOSTNAME
              value: "immich-db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PASSWORD
              value: ""
            - name: UPLOAD_LOCATION
              value: "/usr/src/app/upload"
            - name: LIBRARY_LOCATION
              value: "/usr/src/app/library"
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: immich-config
              mountPath: /usr/src/app/config
            - name: immich-library
              mountPath: /usr/src/app/library
            - name: immich-upload
              mountPath: /usr/src/app/upload
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /server-info/ping
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /server-info/ping
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: immich-config
          emptyDir: {}
        - name: immich-library
          emptyDir: {}
        - name: immich-upload
          emptyDir: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-microservices
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-microservices
  template:
    metadata:
      labels:
        app: immich-microservices
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.9.1
          command: ['sh', '-c', 'until curl -s http://immich-server:3001/server-info/ping; do sleep 2; done;']
        - name: init-folders
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /mnt/upload/encoded-video
              mkdir -p /mnt/upload/profile
              mkdir -p /mnt/upload/library
              mkdir -p /mnt/upload/thumbs
              mkdir -p /mnt/upload/backups
              
              mkdir -p /mnt/library
              
              echo "Directorios creados correctamente"
              ls -la /mnt/upload
              ls -la /mnt/library
          volumeMounts:
            - name: immich-upload
              mountPath: /mnt/upload
            - name: immich-library
              mountPath: /mnt/library
      containers:
        - name: immich-microservices
          image: ghcr.io/immich-app/immich-server:release
          args: ["start.sh", "microservices"]
          env:
            - name: IMMICH_NODE_ENV
              value: "production"
            - name: DB_HOSTNAME
              value: "immich-db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PASSWORD
              value: ""
            - name: UPLOAD_LOCATION
              value: "/usr/src/app/upload"
            - name: LIBRARY_LOCATION
              value: "/usr/src/app/library"
          volumeMounts:
            - name: immich-config
              mountPath: /usr/src/app/config
            - name: immich-library
              mountPath: /usr/src/app/library
            - name: immich-upload
              mountPath: /usr/src/app/upload
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 1Gi
      volumes:
        - name: immich-config
          emptyDir: {}
        - name: immich-library
          emptyDir: {}
        - name: immich-upload
          emptyDir: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-web
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-web
  template:
    metadata:
      labels:
        app: immich-web
    spec:
      containers:
        - name: immich-web
          image: ghcr.io/immich-app/immich-web:release
          env:
            - name: IMMICH_SERVER_URL
              value: "http://immich-server:3001"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
