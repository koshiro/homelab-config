apiVersion: batch/v1
kind: Job
metadata:
  name: immich-init-volumes
  namespace: immich
spec:
  ttlSecondsAfterFinished: 86400  # El job se eliminará automáticamente después de 1 día
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: immich-library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        - name: immich-upload
          persistentVolumeClaim:
            claimName: immich-upload-pvc
      containers:
        - name: init-volumes
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Crear estructura de directorios en upload
              echo "Creando estructura de directorios en upload..."
              mkdir -p /mnt/upload/encoded-video
              mkdir -p /mnt/upload/profile
              mkdir -p /mnt/upload/library
              mkdir -p /mnt/upload/thumbs
              mkdir -p /mnt/upload/backups
              
              # Crear archivos de prueba
              echo "Creando archivos de prueba..."
              touch /mnt/upload/test.txt
              touch /mnt/library/test.txt
              
              # Verificar la estructura creada
              echo "Verificando estructura en upload:"
              ls -la /mnt/upload
              
              echo "Verificando estructura en library:"
              ls -la /mnt/library
              
              echo "Inicialización de volúmenes completada."
          volumeMounts:
            - name: immich-library
              mountPath: /mnt/library
            - name: immich-upload
              mountPath: /mnt/upload
