apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-server
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: immich-server
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: immich-web
    ports:
    - protocol: TCP
      port: 3001
  policyTypes:
  - Ingress
