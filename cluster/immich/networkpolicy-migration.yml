apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-ssh
  namespace: immich
spec:
  podSelector:
    matchLabels:
      job-name: immich-migration-images
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.15/32
      ports:
        - protocol: TCP
          port: 22
