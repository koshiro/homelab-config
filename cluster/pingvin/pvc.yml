apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pingvin-config
  namespace: pingvin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pingvin-data-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  nfs:
    server: 192.168.1.20
    path: /mnt/homelab-storage/pingvin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pingvin-data-pvc
  namespace: pingvin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  volumeName: pingvin-data-pv
  resources:
    requests:
      storage: 1Ti
