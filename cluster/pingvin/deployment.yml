apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingvin
  namespace: pingvin
  labels:
    app: pingvin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingvin
  template:
    metadata:
      labels:
        app: pingvin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: pingvin-share
        image: stonith404/pingvin-share:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TRUST_PROXY
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /opt/app/backend/data
        - name: config
          mountPath: /config
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pingvin-data-pvc
      - name: config
        persistentVolumeClaim:
          claimName: pingvin-config
