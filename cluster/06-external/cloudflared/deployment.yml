# Dos réplicas del conector en los workers x86 con menos carga (k3s-node-1 va saturado con ComfyUI/Minecraft).
# Fuera de pibot: cifrar el túnel en la Pi cuesta ~90m de CPU por MB/s (con 8 descargas en paralelo llegó a
# 610m con throttling y no pasó de 6,9 MB/s). Cloudflare no reparte carga entre réplicas: manda el tráfico a
# una y la otra queda de respaldo, así que ambas deben estar en nodos capaces de llevarlo solas.
# CPU: con 200m el túnel se quedaba en el techo al servir las imágenes de ComfyUI (PNG de ~4 MB); con 1 núcleo
# aún había throttling por ráfagas (media 272m, 8 % de periodos frenados). 2 núcleos en workers de 6.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  # Solo hay dos nodos permitidos y una réplica por nodo: sin surge, si no el pod nuevo no tiene dónde ir
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      # Valor vivo de un `kubectl rollout restart` anterior: escrito tal cual para que adoptar con Flux no cambie la
      # plantilla (reiniciar cloudflared corta los sitios públicos). Cambiarlo a propósito reinicia los pods.
      annotations:
        kubectl.kubernetes.io/restartedAt: "2025-10-04T11:42:06-03:00"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k3s-node-2", "k3s-node-3"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.1
          # Always es el valor vivo (por defecto cuando la imagen era :latest); IfNotPresent reiniciaría los pods
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(CF_TUNNEL_TOKEN)
          env:
            - name: CF_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 256Mi
