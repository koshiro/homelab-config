apiVersion: v1
data:
  config.yml: |
    tunnel: ${CF_TUNNEL_TOKEN}
    credentials-file: /etc/cloudflared/creds/credentials.json

    ingress:
      - hostname: forge.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: auth.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: grafana.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: plex.danielriquelme.cl
        service: http://plex.plex.svc.cluster.local:32400
        originRequest:
          noTLSVerify: true
          httpHostHeader: plex.danielriquelme.cl
      - hostname: truenas.danielriquelme.cl
        service: http://192.168.1.20:80
        originRequest:
          noTLSVerify: true
          httpHostHeader: truenas.danielriquelme.cl
      - hostname: comfyui.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
          httpHostHeader: comfyui.danielriquelme.cl
      - hostname: unsloth.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
          httpHostHeader: unsloth.danielriquelme.cl
      - service: http_status:404
kind: ConfigMap
metadata:
  name: cloudflared-tunnel-config
  namespace: cloudflared
