apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-tunnel-config
  namespace: cloudflared
data:
  config.yml: |
    tunnel: ${CF_TUNNEL_TOKEN}
    credentials-file: /etc/cloudflared/creds/credentials.json
    
    ingress:
      - hostname: forge.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: auth.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: grafana.danielriquelme.cl
        service: http://traefik.kube-system.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
      - hostname: plex.danielriquelme.cl
        service: http://plex.plex.svc.cluster.local:32400
        originRequest:
          noTLSVerify: true
          httpHostHeader: plex.danielriquelme.cl
      - service: http_status:404
