# Conector del túnel pibot-webs: solo sitios estáticos, todo en pibot para que sigan en línea si cae
# Proxmox (los workers son VMs). No pasa por Traefik ni CoreDNS:
#   - dnsPolicy Default: resuelve con el DNS de la Pi (router 192.168.1.1), no con CoreDNS (en los workers).
#   - Origen = NodePort de cada sitio en la IP de pibot (kube-proxy de la Pi), p. ej. josekast.cl ->
#     http://192.168.1.15:30890. Las rutas se gestionan en Cloudflare (Zero Trust > Tunnels > pibot-webs).
# Dos réplicas en la misma Pi: aguanta la caída de un proceso y permite rolling update sin corte.
# Tráfico liviano (HTML/JSON estáticos): el costo de cifrado en la Pi que obliga a sacar el túnel pve
# de pibot (ver deployment.yml) no aplica aquí.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-webs
  namespace: cloudflared
  labels:
    app: cloudflared-webs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-webs
  template:
    metadata:
      labels:
        app: cloudflared-webs
    spec:
      nodeName: pibot
      dnsPolicy: Default
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(CF_TUNNEL_TOKEN)
          env:
            - name: CF_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-webs-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
