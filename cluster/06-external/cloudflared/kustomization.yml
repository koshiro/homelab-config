apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El túnel se gestiona remotamente en Cloudflare (Zero Trust > Tunnels):
#   plex.danielriquelme.cl -> plex.plex.svc:32400
#   *.danielriquelme.cl    -> traefik.kube-system.svc:80
# Cualquier Ingress con host *.danielriquelme.cl queda PÚBLICO.
# El token vive en el secret cloudflared-token (secret.sops.yml, aplicar con sops -d | kubectl apply -f -).
resources:
  - namespace.yml
  - deployment.yml
