apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El túnel se gestiona remotamente en Cloudflare (Zero Trust > Tunnels):
#   plex.danielriquelme.cl -> plex.plex.svc:32400
#   *.danielriquelme.cl    -> traefik.kube-system.svc:80
#   josekast.cl, www.josekast.cl -> traefik.kube-system.svc:80   (zona josekast.cl, CNAME al túnel)
# Cualquier Ingress con host *.danielriquelme.cl queda PÚBLICO.
# El token vive en el secret cloudflared-token (secret.sops.yml; lo aplica Flux por solo-flux/).
#
# Segundo túnel pibot-webs (deployment-webs.yml): sitios estáticos, conector en pibot, origen NodePort:
#   josekast.cl, www.josekast.cl       -> http://192.168.1.15:30890
#   noledigasanadie.danielriquelme.cl  -> http://192.168.1.15:30891   (registro propio, gana al comodín)
# Token en cloudflared-webs-token (secret-webs.sops.yml). Las reglas josekast.cl del túnel pve se
# mantienen: volver atrás = apuntar el CNAME de nuevo al túnel pve.
resources:
  - namespace.yml
  - deployment.yml
  - deployment-webs.yml
components:
  - ../../components/proteger-datos
