---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system  # Usa el mismo secreto que creó bootstrap
  url: https://gitea.danielriquelme.cl/daniel/homelab-config.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster
  prune: false  # Por seguridad, no eliminar recursos automáticamente
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  # decryption:
  #   provider: sops
  #   secretRef:
  #     name: sops-age
  postBuild:
    substitute:
      cluster_name: "homelab"
