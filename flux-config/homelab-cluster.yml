---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-ssh-key
  url: ssh://git@gitea.gitea.svc.cluster.local/daniel/homelab-config.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster
  prune: false  # Por seguridad, no eliminar recursos automáticamente
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      cluster_name: "homelab"
